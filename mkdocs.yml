site_name: Containerizer
site_description: Can this application run as a Linux container on Kubernetes? Assessment, hardened builds and manifests.
site_url: https://containerizer.eu/
repo_url: https://github.com/olljanat-ai/containerizer
repo_name: olljanat-ai/containerizer
edit_uri: edit/main/docs/
docs_dir: docs
hooks:
  - .github/mkdocs_hooks.py

theme:
  name: material
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}

extra_css:
  - stylesheets/landing.css

markdown_extensions:
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - attr_list
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Home: index.md
  - Overview: overview.md
  - Running at scale:
      - Whole organization: organization-run.md
      - Scheduled scans: scheduled-scans.md
      - Source control tokens and the LLM: source-control.md
      - Sandbox verification: sandbox-verification.md
      - Sandbox HTTPS: sandbox-https.md
      - Dev databases: dev-databases.md
      - Lab services: lab-services.md
      - Secrets (External Secrets): external-secrets.md
      - Sandbox identity provider: sandbox-idp.md
  - Java and Node.js: java-node.md
  - Results and review:
      - Results database and web UI: results-database.md
      - Rule review: rule-review.md
      - SBOM, licences and CVEs: sbom.md
  - Deployment:
      - Appliance: appliance.md
      - Self-hosted LLM: self-hosted-llm.md
  - Development:
      - Local dev server: local-dev-server.md

validation:
  links:
    anchors: warn
