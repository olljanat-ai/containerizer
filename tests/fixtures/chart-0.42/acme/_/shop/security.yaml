apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
spec:
  limits:
  - type: Container
    default:
      memory: 512Mi
      ephemeral-storage: 1Gi
    defaultRequest:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 64Mi
    max:
      memory: 4Gi
      ephemeral-storage: 4Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
spec:
  hard:
    requests.cpu: 1000m
    requests.memory: 1024Mi
    limits.memory: 2048Mi
    requests.ephemeral-storage: 128Mi
    limits.ephemeral-storage: 2048Mi
    pods: '10'
    services: '10'
    persistentvolumeclaims: '10'
    secrets: '20'
    configmaps: '20'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-secrets-reader
automountServiceAccountToken: false
