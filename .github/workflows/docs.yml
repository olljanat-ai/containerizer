name: docs

# Builds the documentation site (README + docs/) with MkDocs Material. Pull requests only check that it
# builds; pushes to main publish it to the gh-pages branch, which GitHub Pages serves.
on:
  pull_request:
    paths: [README.md, "docs/**", mkdocs.yml, .github/mkdocs_hooks.py, .github/workflows/docs.yml]
  push:
    branches: [main]
    paths: [README.md, "docs/**", mkdocs.yml, .github/mkdocs_hooks.py, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: "1"
    permissions:
      contents: write   # push to gh-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mkdocs==1.6.1" "mkdocs-material==9.8.0"
      - run: mkdocs build --strict
      - name: Publish to gh-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force --no-history --message "Publish docs from {sha}"
