name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  # Results database and web UI against a real SQL Server (tests/test_sqlstore.py), plus the compose image.
  sql:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Ci-Only-Passw0rd!
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci-Only-Passw0rd!' -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s --health-timeout 5s --health-retries 20 --health-start-period 20s
    env:
      CONTAINERIZER_TEST_SQL: "Server=127.0.0.1,1433;Database=master;User Id=sa;TrustServerCertificate=yes"
      CONTAINERIZER_SQL_PASSWORD: Ci-Only-Passw0rd!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-sql.txt pytest
      - run: python -m pytest -q tests/test_sqlstore.py -rs
      - name: Image builds and the UI serves results
        run: |
          docker build -f results/Dockerfile -t containerizer-results .
          export CONTAINERIZER_SQL="Server=127.0.0.1,1433;Database=Containerizer;User Id=sa;TrustServerCertificate=yes"
          export CZ_CZ_WEB_PASSWORD=Ci-Web-Passw0rd!
          python -m containerizer db init --create-database --login cz_web:cz_reader
          python -m containerizer assess -q examples/ci-demo
          docker run -d --name web --network host -e CONTAINERIZER_SQL_PASSWORD="$CZ_CZ_WEB_PASSWORD" \
            -e CONTAINERIZER_SQL="Server=127.0.0.1,1433;Database=Containerizer;User Id=cz_web;TrustServerCertificate=yes" \
            --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp \
            containerizer-results web --host 127.0.0.1 --port 8080
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q ci-demo || { docker logs web; exit 1; }

  # Dogfood: gate this repository's own example app with the action, as a user's repo would.
  containerizer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - id: check
        uses: ./
        with:
          path: examples/ci-demo
          max-rating: B
      - run: echo "rating=${{ steps.check.outputs.rating }} new=${{ steps.check.outputs.new-findings }}"

  # Same gate with the PR head checked out instead of the merge commit: the action compares with the merge base.
  containerizer-head:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - id: check
        uses: ./
        with:
          path: examples/ci-demo
          comment: "false"
          sarif-file: head.sarif
      - run: echo "rating=${{ steps.check.outputs.rating }} new=${{ steps.check.outputs.new-findings }}"

  # End-to-end self-test on a challenge app: a commit that adds a Windows-only dependency must fail the gate,
  # and the unchanged app must pass.
  action-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tool
      - uses: actions/checkout@v4
        with:
          repository: onek8s/containerization-challenge
          path: challenge
          fetch-depth: 1
      - name: Add a Windows-only dependency in a commit
        working-directory: challenge
        run: |
          git config user.email ci@example.com && git config user.name ci
          app=scenarios/parts-catalog/src/PartsCatalog
          sed -i 's#<PackageReference Include="Microsoft.EntityFrameworkCore.Sqlite" Version="8.0.11" />#&\n    <PackageReference Include="Microsoft.Win32.Registry" Version="5.0.0" />#' $app/PartsCatalog.csproj
          printf '\nstatic class Settings { public static object? Get() => Microsoft.Win32.Registry.LocalMachine.OpenSubKey(@"SOFTWARE\\\\Parts"); }\n' >> $app/Program.cs
          printf '\nstatic class Printing { public static void Print() { var d = new System.Drawing.Printing.PrintDocument(); var o = Type.GetTypeFromProgID("Excel.Application"); } }\n' >> $app/Program.cs
          git commit -qam "use the registry and Excel"
      - name: Gate must fail on the new dependency
        id: bad
        continue-on-error: true
        uses: ./tool
        with:
          path: challenge/scenarios/parts-catalog
          base-ref: HEAD~1
          comment: "false"
          sarif-file: bad.sarif
      - name: Gate must pass on the unchanged app
        id: good
        uses: ./tool
        with:
          path: challenge/scenarios/expense-claims
          base-ref: HEAD~1
          max-rating: A
          comment: "false"
          sarif-file: good.sarif
      - name: Assert
        run: |
          echo "bad: outcome=${{ steps.bad.outcome }} failed=${{ steps.bad.outputs.failed }} rating=${{ steps.bad.outputs.rating }}"
          echo "good: outcome=${{ steps.good.outcome }} failed=${{ steps.good.outputs.failed }} rating=${{ steps.good.outputs.rating }}"
          test "${{ steps.bad.outcome }}" = failure && test "${{ steps.bad.outputs.failed }}" = true
          test "${{ steps.good.outputs.failed }}" = false && test "${{ steps.good.outputs.rating }}" = A
          python3 -c "import json; r=json.load(open('bad.sarif'))['runs'][0]['results']; assert any(x.get('baselineState')=='new' for x in r), r"

  # One-shot assessment, the main way the tool is used: assess, generate, then build and run every
  # generated container on the runner. Apps rated ready must actually build and serve.
  assess-oneshot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: tool
      - uses: actions/checkout@v4
        with:
          repository: onek8s/containerization-challenge
          path: challenge
      - id: assess
        uses: ./tool
        with:
          mode: assess
          path: challenge/scenarios/parts-catalog challenge/scenarios/expense-claims challenge/scenarios/batch-release
          sarif-file: assess.sarif
      - name: Assert
        env:
          REPORT: ${{ steps.assess.outputs.report-dir }}
        run: |
          echo "rating=${{ steps.assess.outputs.rating }} unconfirmed=${{ steps.assess.outputs.unconfirmed }}"
          ls -R "$REPORT" | head -100
          test -f "$REPORT/portfolio.md" && test -d "$REPORT/parts-catalog"
          python3 -c "import json,sys; a={x['name']: x for x in json.load(open(sys.argv[1]))}; v=a['parts-catalog'].get('verification') or []; print(v); assert any(r['status'].startswith('ok') for r in v)" "$REPORT/assessment.json"
          test "${{ steps.assess.outputs.rating }}" = D        # worst of A, A and D
          test "${{ steps.assess.outputs.unconfirmed }}" = 0
