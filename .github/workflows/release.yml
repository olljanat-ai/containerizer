# The containerizer appliance: build the OS image, the ISO and the disk images, boot the disk image in
# QEMU and test it (firewall, DNS filter, services, sandbox cluster, local registry, roll back).
# On a release tag (vX.Y.Z) the tested image is pushed to GHCR, signed with cosign (keyless: this
# workflow's identity, which the appliance checks before it installs an upgrade), its SBOM is attested,
# and the ISO and disk images are published as release assets.
# Every release also publishes its application alone (the code and rules) as the small, signed app update image
# ghcr.io/<owner>/containerizer-app:vX.Y.Z: appliances of the same series (vX.Y) install a patch release from it
# without an OS upgrade (containerizer/apppatch.py). So a patch release (Z > 0) must not change the OS image:
# appliance/ci/patch-release-check.sh refuses it otherwise, and such changes go into a minor release.
#
# The appliance verifies upgrades against the identity
#   https://github.com/<owner>/<repo>/.github/workflows/release.yml@refs/tags/vX.Y.Z
# so this file keeps its name.
name: release

on:
  # Release: push an annotated tag vX.Y.Z on main, after containerizer/__init__.py and CHANGELOG.md say X.Y.Z
  # (the appliance job checks it)
  push:
    tags: ["v*.*.*"]
  # Or run this workflow by hand on main with a version (0.1.0 or v0.1.0). The tag job checks it
  # against containerizer/__init__.py, tags the commit vX.Y.Z and starts this workflow again on the tag,
  # so the image is signed with the tag identity above. Without a version it is a plain build and test.
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.0 (empty: build and test only)"
        required: false
        default: ""
      boot_test:
        description: "Boot the disk image in QEMU and test it (optional; a tag push skips it)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/containerizer-appliance
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/containerizer-app
  COSIGN_VERSION: v3.1.4
  COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa

jobs:
  tag:
    if: github.event_name == 'workflow_dispatch' && inputs.version != '' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # push the tag
      actions: write         # start this workflow on the tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # the tags: a patch release is checked against its vX.Y.0
      - name: Tag and start the release on the tag
        env:
          INPUT: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${INPUT#v}"
          [[ "$v" =~ ^[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}$ ]] || { echo "the version is X.Y.Z, got $INPUT" >&2; exit 1; }
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "release from main, not $GITHUB_REF" >&2; exit 1; }
          have=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' containerizer/__init__.py)
          [ "$have" = "$v" ] || { echo "containerizer/__init__.py says $have: bump it (and CHANGELOG.md) to $v first" >&2; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "v$v is already tagged" >&2; exit 1
          fi
          appliance/ci/patch-release-check.sh "v$v"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$v" -m "containerizer $v" "$GITHUB_SHA"
          git push origin "refs/tags/v$v"
          # a tag pushed with this token starts no workflow; a dispatch does
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "v$v" -f boot_test=${{ inputs.boot_test }}
          echo "Tagged v$v at $GITHUB_SHA; the release runs on the tag: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/release.yml" >> "$GITHUB_STEP_SUMMARY"

  appliance:
    # a manual run with a version only tags; the build, test and release run on the tag
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.version != '' && !startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write        # release assets (tags only)
      packages: write        # GHCR (tags only)
      id-token: write        # keyless signing (tags only)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # the tags: a patch release is checked against its vX.Y.0

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}$ ]] || { echo "tags are vX.Y.Z" >&2; exit 1; }
            v=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' containerizer/__init__.py)
            [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "containerizer/__init__.py says $v, the tag is $GITHUB_REF_NAME" >&2; exit 1; }
            appliance/ci/patch-release-check.sh "$GITHUB_REF_NAME"
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            # a patch release (Z > 0) ships the app update only: no installer or disk images (those of vX.Y.0 install
            # the same OS); the OS image is still pushed, for appliances of another series that upgrade to it
            if [[ "$GITHUB_REF_NAME" =~ \.0$ ]]; then echo "patch=false" >> "$GITHUB_OUTPUT"; else
              echo "patch=true" >> "$GITHUB_OUTPUT"
              echo "series_base=$(sed -E 's/\.[0-9]+$/.0/' <<< "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "version=ci-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "patch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build the OS image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: appliance/Dockerfile
          load: true
          push: false
          tags: containerizer-appliance:build
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            IMAGE=${{ env.IMAGE }}
            APP_IMAGE=${{ env.APP_IMAGE }}
            SIGNER_REPO=${{ github.repository }}
          cache-from: type=gha,scope=appliance
          cache-to: type=gha,scope=appliance,mode=max

      - name: App update image
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          rm -rf build/app && mkdir -p build/app/app
          cp -r containerizer rules build/app/app/
          rm -rf build/app/app/rules/learned
          find build/app -name __pycache__ -prune -exec rm -rf {} +
          series=""
          [[ "$V" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]] && series="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          lock=$(sha256sum appliance/requirements.lock | cut -d' ' -f1)
          printf '{"version": "%s", "series": "%s", "requirements_sha256": "%s"}\n' "$V" "$series" "$lock" \
            > build/app/app/manifest.json
          docker build -f appliance/app/Dockerfile -t containerizer-app:build build/app
          # the update's code imports in the OS image of its series, from its own folder, as the appliance checks
          docker run --rm -v "$PWD/build/app/app:/patch:ro" --entrypoint /usr/lib/containerizer/venv/bin/python \
            containerizer-appliance:build -I -c "import sys; sys.path.insert(0, '/patch'); import containerizer, \
            containerizer.webui, containerizer.admin, containerizer.cli, containerizer.worker, containerizer.sysagent; \
            assert containerizer.__file__.startswith('/patch'), containerizer.__file__"
          test "$(docker run --rm --entrypoint cat containerizer-appliance:build /usr/lib/containerizer/requirements.sha256)" = "$lock"

      - name: Tools
        if: steps.v.outputs.patch != 'true' || inputs.boot_test
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils ovmf zstd expect
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Disk images and ISO
        if: steps.v.outputs.patch != 'true' || inputs.boot_test
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p build build/test
          ssh-keygen -q -t ed25519 -N '' -f build/ci_key
          sed "s#@KEY@#$(cat build/ci_key.pub)#" appliance/ci/test-login.yaml.in > build/test-login.yaml
          run_elemental() {
            docker run --rm --privileged -v /dev:/dev -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/build:/build" --entrypoint /usr/bin/elemental containerizer-appliance:build --debug "$@"
          }
          # an expandable disk holds only the recovery system; on its first boot it installs itself to the
          # whole disk (the persistent partition takes what the OS snapshots leave)
          run_elemental build-disk --expandable --local --system containerizer-appliance:build \
            -n "containerizer-$V" -o /build
          if [ "${{ inputs.boot_test }}" = true ]; then
            run_elemental build-disk --expandable --local --system containerizer-appliance:build \
              --cloud-init /build/test-login.yaml -n test -o /build/test
          fi
          run_elemental build-iso --local --bootloader-in-rootfs --extra-cmdline "console=tty1 console=ttyS0" \
            -n "containerizer-$V" -o /build containerizer-appliance:build
          sudo chown -R "$USER" build
          ls -la build build/test

      - name: Boot test
        if: inputs.boot_test
        run: OUT=$PWD/build/boot appliance/ci/boot-test.sh build/test/test.raw build/ci_key

      - name: Boot test logs
        if: always() && inputs.boot_test
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-logs
          path: build/boot/*.log
          if-no-files-found: ignore
      - name: Boot test diagnostics
        if: always() && inputs.boot_test
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-diagnostics
          path: build/boot/diagnostics.txt
          if-no-files-found: ignore

      # ------------------------------------------------------------------ release (tags only)
      - name: Install cosign
        if: steps.v.outputs.release == 'true'
        run: |
          curl -fsSLo /tmp/cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  /tmp/cosign" | sha256sum -c -
          sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign

      - name: Push to GHCR and sign
        if: steps.v.outputs.release == 'true'
        id: push
        env:
          V: ${{ steps.v.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag containerizer-appliance:build "$IMAGE:$V"
          docker tag containerizer-appliance:build "$IMAGE:latest"
          docker push "$IMAGE:$V"
          docker push "$IMAGE:latest"
          digest=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE:$V" | grep -m1 "^$IMAGE@" | cut -d@ -f2)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          cosign sign --yes "$IMAGE@$digest"
          # the app update of this release (appliances of the series install a patch release from it)
          docker tag containerizer-app:build "$APP_IMAGE:$V"
          docker push "$APP_IMAGE:$V"
          app_digest=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$APP_IMAGE:$V" | grep -m1 "^$APP_IMAGE@" | cut -d@ -f2)
          [[ "$app_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest for the app update" >&2; exit 1; }
          echo "app_digest=$app_digest" >> "$GITHUB_OUTPUT"
          cosign sign --yes "$APP_IMAGE@$app_digest"

      - name: Check the signature like the appliance does
        if: steps.v.outputs.release == 'true'
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          for ref in "$IMAGE:$V" "$APP_IMAGE:$V"; do
            cosign verify --output json \
              --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY//./\\.}/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref" > /dev/null
          done

      - name: Release assets
        if: steps.v.outputs.release == 'true' && steps.v.outputs.patch != 'true'
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          cd build
          # A 64 GB thin disk (the minimum): the expandable image partitions the whole disk on its first boot, and
          # the shipped 1 GB would leave it in recovery with no COS_STATE to boot next time.
          qemu-img convert -c -O qcow2 "containerizer-$V.raw" "containerizer-$V.qcow2"
          qemu-img resize "containerizer-$V.qcow2" 64G
          sha256sum "containerizer-$V.iso" "containerizer-$V.qcow2" > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          ls -la

      - name: GitHub release
        if: steps.v.outputs.release == 'true' && steps.v.outputs.patch != 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Appliance image `${{ env.IMAGE }}:${{ steps.v.outputs.version }}` (`${{ steps.push.outputs.digest }}`),
            signed with cosign by this repository's release workflow; installed appliances can upgrade to it
            from **Admin → System**. Appliances that run an earlier release of the same series install it as an
            app update instead (`${{ env.APP_IMAGE }}:${{ steps.v.outputs.version }}`, `${{ steps.push.outputs.app_digest }}`):
            only their containerizer services restart, the OS does not. Install: [docs/appliance.md](https://github.com/${{ github.repository }}/blob/${{ steps.v.outputs.version }}/docs/appliance.md).

            - `containerizer-${{ steps.v.outputs.version }}.iso`: installer (UEFI)
            - `containerizer-${{ steps.v.outputs.version }}.qcow2`: 64 GB disk image for KVM/Proxmox/OpenStack (grow it before the first boot for a larger disk)
            - `SHA256SUMS` + `SHA256SUMS.sigstore.json`: verify with `cosign verify-blob --bundle SHA256SUMS.sigstore.json --certificate-identity-regexp '^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/' --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS`
          files: |
            build/containerizer-${{ steps.v.outputs.version }}.iso
            build/containerizer-${{ steps.v.outputs.version }}.qcow2
            build/SHA256SUMS
            build/SHA256SUMS.sigstore.json

      - name: "GitHub release (patch release: the app update only)"
        if: steps.v.outputs.release == 'true' && steps.v.outputs.patch == 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            A patch release: appliances of this series install it as an app update from **Admin → System**
            (`${{ env.APP_IMAGE }}:${{ steps.v.outputs.version }}`, `${{ steps.push.outputs.app_digest }}`): only their
            containerizer services restart, the OS does not. Appliances of an earlier series upgrade to the appliance
            image `${{ env.IMAGE }}:${{ steps.v.outputs.version }}` (`${{ steps.push.outputs.digest }}`), both signed with
            cosign by this repository's release workflow.

            No installer or disk images: install a new appliance from
            [${{ steps.v.outputs.series_base }}](https://github.com/${{ github.repository }}/releases/tag/${{ steps.v.outputs.series_base }}),
            which has the same OS, and it updates itself to this release.
