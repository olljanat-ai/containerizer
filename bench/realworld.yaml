  - name: rw2-musicstore
    url: https://github.com/aspnet/MusicStore
    commit: 0abdfec1e87aeab68bc5e8502ec73968a4b8c7ef
    expected_rating: B
    expected_roles: {web: [MusicStore], test: [MusicStore.Test, MusicStore.E2ETests]}
    notes: >-
      Pinned to the commit before the archive commit (HEAD only has a README). ASP.NET Core on netcoreapp3.0 with
      3.0.0-alpha1 packages from dead dotnet.myget.org feeds (build/sources.props, build/dependencies.props), so it
      needs retargeting to released packages / FrameworkReference, not just roll-forward. Kestrel is the default
      server; HttpSys + NTLM only when server=HttpSys (Program.cs). config.json points at (localdb) -> env override.
      Platform.cs P/Invokes api-ms-win-core-sysinfo only for Nano Server detection, guarded by IsRunningOnWindows.
      tool (2026-10-30): E. pinvoke-vendor blocker on Platform.cs:13 DllImport("api-ms-win-core-sysinfo-l1-2-1.dll") -- a Windows API-set DLL, not a vendor SDK, only reached when IsRunningOnWindows (Platform.cs:76) and inside try/catch. Without it the tool gives B (http-sys refactor). Test projects classified correctly but invisible to the checker (not in components).

