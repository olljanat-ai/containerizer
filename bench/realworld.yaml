      3.0 on an out-of-support runtime: retarget, not a pure lift.
      tool (2026-10-30): A, no findings on WebUI. Disagreement is judgement (old TFM + IdentityServer4 retarget), but the tool also misses the cert-store key in appsettings.Production.json (cert-store rule only has a code: condition).

