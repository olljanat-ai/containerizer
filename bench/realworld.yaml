# Real-world validation corpus: public .NET repositories with hand-judged expectations.
# Clone each with `git clone --depth 1 <url> /home/claude/validation/<name>` then
# `git fetch --depth 1 origin <commit> && git checkout <commit>` to pin (Umbraco: tag release-8.18.9).
# Never build or run their code. Expectations come from reading each repo, not from tool output.
#
# expected_rating: A lift&shift, B minor refactor, C framework port, D partial, E not feasible.
# expected_roles: role per project (web/worker/console/library/test/tool/desktop/spa...).
# Convention: desktop/mobile clients are reported but do not lower the rating, which is
# about the server side (a server + WinForms client whose server needs a port is C, not D).
# Azure Functions apps have role worker.
repos:
  - name: rw-eshop
    url: https://github.com/dotnet/eShop
    commit: 913acea66708a59595351174cee9b29f37179d29
    expected_rating: A
    expected_roles: {web: [Basket.API, Catalog.API, Identity.API, Ordering.API, WebApp, WebhookClient, Webhooks.API, PaymentProcessor], worker: [OrderProcessor], desktop: [ClientApp, HybridApp], tool: [eShop.AppHost], test: ["*.FunctionalTests"]}
    notes: .NET 10 Aspire microservices, Linux containers by design. ClientApp/HybridApp are MAUI clients (UseMaui), not server components; their Windows TFM is only added under Condition IsOSPlatform('windows').

