# The host resolves through the DNS filter only. /etc/resolv.conf can't be set in the image (container
# builds bind-mount it), so it is linked at boot. This file sorts before systemd-resolved's own
# tmpfiles entry for the same path, so this entry wins; L+ replaces whatever is there.
L+ /etc/resolv.conf - - - - /usr/lib/containerizer/resolv.conf
