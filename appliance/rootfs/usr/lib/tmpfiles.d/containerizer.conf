d /run/containerizer 0755 root root -
d /run/containerizer/system 0755 root root -
# the web UI drops upgrade, roll back and firewall requests here; the system agent checks each one
d /run/containerizer/system/requests 0770 root cz-web -
# the system agent's answers to the database browser (dbbrowse.py): rows of the sandbox databases, root and cz-web only
d /run/containerizer/system/answers 0770 root cz-web -
d /run/containerizer/dnsmasq 0755 root root -
