global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/containerizer-alerts.yml

scrape_configs:
  - job_name: containerizer-worker
    static_configs:
      - targets: ["127.0.0.1:9464"]
        labels: {instance: appliance}
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
