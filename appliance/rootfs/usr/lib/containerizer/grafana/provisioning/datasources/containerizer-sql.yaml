# The results database for the "LLM token usage" dashboard: login cz_grafana, whose role (usage) reads only the views
# vLlmUsage and vLlmUsageDaily (schema 43). The address comes from /run/containerizer/grafana-sql.env (sysagent
# sql-env), the password from secrets/grafana.env (cz-firstboot). Encrypted; the certificate is not checked (the
# appliance's own server has a self-signed one).
apiVersion: 1
datasources:
  - name: Containerizer results
    uid: containerizer-sql
    type: mssql
    access: proxy
    url: ${CZ_GRAFANA_SQL_SERVER}
    user: cz_grafana
    jsonData:
      database: ${CZ_GRAFANA_SQL_DATABASE}
      encrypt: "true"
      tlsSkipVerify: true
      maxOpenConns: 4
      maxIdleConns: 2
      connMaxLifetime: 14400
    secureJsonData:
      password: ${CZ_GRAFANA_SQL_PASSWORD}
    editable: false
