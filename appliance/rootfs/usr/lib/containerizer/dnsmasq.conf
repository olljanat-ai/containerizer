# The DNS filter of the appliance. The names it resolves, and the nftables sets their addresses go into,
# are in /run/containerizer/dnsmasq/egress.conf (rendered by `python -m containerizer.sysagent firewall apply`).
listen-address=169.254.53.53
bind-dynamic
port=53
user=dnsmasq
group=nogroup
no-hosts
domain-needed
bogus-priv
cache-size=2000
no-negcache
# no log-queries: some 900 000 journal lines an hour on a busy appliance; the names no rule allows go to the refuser
# (containerizer-dns-refused.service, the default server in egress.conf), which counts them for Admin -> Firewall
log-facility=-
conf-file=/run/containerizer/dnsmasq/egress.conf
