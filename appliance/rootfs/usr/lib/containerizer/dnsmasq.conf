# The DNS filter of the appliance. The names it resolves, and the nftables sets their addresses go into,
# are in /run/containerizer/dnsmasq/egress.conf (rendered by `python -m containerizer.sysagent firewall apply`).
listen-address=169.254.53.53
bind-dynamic
port=53
user=dnsmasq
group=nogroup
no-hosts
domain-needed
bogus-priv
cache-size=2000
no-negcache
log-queries=extra
log-facility=-
conf-file=/run/containerizer/dnsmasq/egress.conf
