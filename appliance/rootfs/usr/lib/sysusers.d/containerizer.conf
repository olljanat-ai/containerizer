# Fixed ids: the persistent partition keeps files owned by these ids across OS versions.
u containerizer 900 "containerizer scan worker" /var/lib/containerizer/worker /usr/sbin/nologin
u cz-web 901 "containerizer web UI" /nonexistent /usr/sbin/nologin
# the scan worker and the LLM queue runner are not in the docker group (root-equivalent): they reach Docker through
# containerizer-docker-guard.socket, whose service runs as cz-dockerguard (containerizer/dockerguard.py)
u cz-dockerguard 902 "containerizer Docker socket guard" /nonexistent /usr/sbin/nologin
m cz-dockerguard docker
