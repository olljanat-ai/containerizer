# root signs in with its password or a key (the appliance has no other administrator account on the OS).
# The password is "containerizer" until changed and expired, so the first sign-in asks for a new one (PAM,
# keyboard-interactive); see cz-root-password.
PermitRootLogin yes
PasswordAuthentication yes
KbdInteractiveAuthentication yes
UsePAM yes
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
AllowAgentForwarding no
PermitTunnel no
# local forwarding stays on: `ssh -L 3000:127.0.0.1:3000` for Grafana, `-L 6443:...` for kubectl
AllowTcpForwarding local
GatewayPorts no
PermitUserEnvironment no
HostKey /etc/ssh/ssh_host_ed25519_key
