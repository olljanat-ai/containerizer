[Unit]
# not on the live installer ISO, not in recovery
ConditionKernelCommandLine=!cdroot
ConditionPathExists=!/run/elemental/recovery_mode

[Service]
# Docker itself fetches what a build names by URL (ADD https://..., a remote build context) from the host's network:
# it may not open TCP connections to the appliance's own addresses (loopback: Grafana, Prometheus, the web UI, SQL
# Server, ...) except the registry (5000) and the DNS filter, nor to the k3s networks (docs/appliance-admin.md#builds-of-scanned-code).
# Its own table, matched by this service's cgroup, so it is loaded again with each start of Docker.
ExecStartPost=-/usr/lib/containerizer/bin/cz-docker-egress
