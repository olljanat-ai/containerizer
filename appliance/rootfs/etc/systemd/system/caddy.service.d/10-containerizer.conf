[Unit]
ConditionKernelCommandLine=!cdroot
ConditionPathExists=!/run/elemental/recovery_mode
After=containerizer-firstboot.service containerizer-dns.service

[Service]
EnvironmentFile=/etc/containerizer/appliance.env
EnvironmentFile=/run/containerizer/caddy.env
# Debian's unit starts Caddy with --environ, which writes its whole environment (appliance.env with it) to the
# journal at every start: the same command without it
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile
