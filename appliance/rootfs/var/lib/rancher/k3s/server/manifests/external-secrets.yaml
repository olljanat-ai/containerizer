# External Secrets Operator for the sandbox cluster (docs/external-secrets.md). The chart is in the OS image
# (appliance/Dockerfile, verified by digest) and served by k3s itself; the images are pinned by digest.
# cz-sandbox creates the store (ClusterSecretStore app-secrets over namespace containerizer-secrets) and
# puts the values there. Features the sandbox does not use are off: PushSecret (writing back to a store),
# ClusterExternalSecret and ClusterGenerator (cluster-wide fan-out).
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: external-secrets
  namespace: kube-system
spec:
  chart: https://%{KUBERNETES_API}%/static/charts/external-secrets-2.14.0.tgz
  targetNamespace: external-secrets
  createNamespace: true
  valuesContent: |-
    installCRDs: true
    crds:
      createClusterExternalSecret: false
      createClusterGenerator: false
      createClusterPushSecret: false
      createPushSecret: false
    processClusterExternalSecret: false
    processClusterGenerator: false
    processClusterPushSecret: false
    processPushSecret: false
    image:
      tag: "v2.14.0@sha256:10608eb53e636e744903d5f3657a4d9c44e28d9d9c181b73e07bc7dd2e6884dc"
    resources:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {memory: 256Mi}
    webhook:
      image:
        tag: "v2.14.0@sha256:10608eb53e636e744903d5f3657a4d9c44e28d9d9c181b73e07bc7dd2e6884dc"
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 128Mi}
    certController:
      image:
        tag: "v2.14.0@sha256:10608eb53e636e744903d5f3657a4d9c44e28d9d9c181b73e07bc7dd2e6884dc"
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 128Mi}
