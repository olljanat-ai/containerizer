# Metrics of the sandbox cluster for the appliance's Prometheus and Grafana (docs/appliance-admin.md#metrics).
# k3s applies this file at every start (auto-deploying manifests).
#
# - kube-state-metrics: the state of the cluster's objects (nodes, pods, deployments, restarts, ...) and, through its
#   custom resource state configuration below, of Flux's objects (gotk_resource_info: ready, suspended, revision).
#   Prometheus (on the host) finds it, and Flux's controllers, through the API server (job kubernetes-pods).
# - cz-prometheus: the read-only identity Prometheus uses for the API server, the kubelet (cAdvisor: CPU and memory
#   of every container) and that discovery. Its token is copied to the host by containerizer-prometheus-k8s.service.
apiVersion: v1
kind: Namespace
metadata:
  name: cz-monitoring
  labels:
    app.kubernetes.io/managed-by: containerizer
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: cz-monitoring
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cz-kube-state-metrics
rules:
  - apiGroups: [""]
    resources: [configmaps, endpoints, limitranges, namespaces, nodes, persistentvolumeclaims, persistentvolumes,
                pods, replicationcontrollers, resourcequotas, services]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [daemonsets, deployments, replicasets, statefulsets]
    verbs: [list, watch]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, volumeattachments]
    verbs: [list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [list, watch]
  - apiGroups: [source.toolkit.fluxcd.io, kustomize.toolkit.fluxcd.io, helm.toolkit.fluxcd.io,
                notification.toolkit.fluxcd.io, image.toolkit.fluxcd.io]
    resources: ["*"]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cz-kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cz-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: cz-monitoring
---
# Flux's objects as metrics (the configuration of Flux's own monitoring example): one gotk_resource_info series per
# object, with its kind, namespace, name, Ready condition, suspend flag and revision.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-state-metrics-flux
  namespace: cz-monitoring
data:
  flux.yaml: |
    kind: CustomResourceStateMetrics
    spec:
      resources:
        - groupVersionKind: {group: kustomize.toolkit.fluxcd.io, version: v1, kind: Kustomization}
          metricNamePrefix: gotk
          labelsFromPath: &common
            exported_namespace: [metadata, namespace]
            name: [metadata, name]
            ready: [status, conditions, "[type=Ready]", status]
            reason: [status, conditions, "[type=Ready]", reason]
            suspended: [spec, suspend]
          metrics:
            - name: resource_info
              help: The current state of a Flux object.
              each:
                type: Info
                info:
                  labelsFromPath:
                    revision: [status, lastAppliedRevision]
                    source_name: [spec, sourceRef, name]
        - groupVersionKind: {group: helm.toolkit.fluxcd.io, version: v2, kind: HelmRelease}
          metricNamePrefix: gotk
          labelsFromPath: *common
          metrics:
            - name: resource_info
              help: The current state of a Flux object.
              each:
                type: Info
                info:
                  labelsFromPath:
                    revision: [status, lastAttemptedRevision]
                    chart_name: [spec, chart, spec, chart]
        - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: GitRepository}
          metricNamePrefix: gotk
          labelsFromPath: *common
          metrics:
            - name: resource_info
              help: The current state of a Flux object.
              each:
                type: Info
                info:
                  labelsFromPath:
                    revision: [status, artifact, revision]
                    url: [spec, url]
        - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: OCIRepository}
          metricNamePrefix: gotk
          labelsFromPath: *common
          metrics:
            - name: resource_info
              help: The current state of a Flux object.
              each:
                type: Info
                info:
                  labelsFromPath:
                    revision: [status, artifact, revision]
                    url: [spec, url]
        - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: HelmRepository}
          metricNamePrefix: gotk
          labelsFromPath: *common
          metrics:
            - name: resource_info
              help: The current state of a Flux object.
              each:
                type: Info
                info:
                  labelsFromPath:
                    revision: [status, artifact, revision]
                    url: [spec, url]
        - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: HelmChart}
          metricNamePrefix: gotk
          labelsFromPath: *common
          metrics:
            - name: resource_info
              help: The current state of a Flux object.
              each:
                type: Info
                info:
                  labelsFromPath:
                    revision: [status, artifact, revision]
        - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: Bucket}
          metricNamePrefix: gotk
          labelsFromPath: *common
          metrics:
            - name: resource_info
              help: The current state of a Flux object.
              each:
                type: Info
                info:
                  labelsFromPath:
                    revision: [status, artifact, revision]
        - groupVersionKind: {group: image.toolkit.fluxcd.io, version: v1, kind: ImageRepository}
          metricNamePrefix: gotk
          labelsFromPath: *common
          metrics:
            - name: resource_info
              help: The current state of a Flux object.
              each:
                type: Info
                info:
                  labelsFromPath:
                    image: [spec, image]
        - groupVersionKind: {group: image.toolkit.fluxcd.io, version: v1, kind: ImagePolicy}
          metricNamePrefix: gotk
          labelsFromPath: *common
          metrics:
            - name: resource_info
              help: The current state of a Flux object.
              each:
                type: Info
                info:
                  labelsFromPath:
                    revision: [status, latestRef, tag]
        - groupVersionKind: {group: image.toolkit.fluxcd.io, version: v1, kind: ImageUpdateAutomation}
          metricNamePrefix: gotk
          labelsFromPath: *common
          metrics:
            - name: resource_info
              help: The current state of a Flux object.
              each:
                type: Info
                info:
                  labelsFromPath:
                    revision: [status, lastPushCommit]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: cz-monitoring
  labels: {app.kubernetes.io/name: kube-state-metrics}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kube-state-metrics}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kube-state-metrics}
    spec:
      serviceAccountName: kube-state-metrics
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: kube-state-metrics
          # Rancher's mirror on Docker Hub (on the appliance's egress allow-list, as k3s's own images): registry.k8s.io
          # redirects to a regional Artifact Registry host that the allow-list cannot name
          image: docker.io/rancher/mirrored-kube-state-metrics-kube-state-metrics:v2.17.0@sha256:2bbc915567334b13632bf62c0a97084aff72a36e13c4dabd5f2f11c898c5bacd
          args:
            - --port=8080
            - --telemetry-port=8081
            - --custom-resource-state-config-file=/etc/kube-state-metrics/flux.yaml
          ports:
            - {name: http-metrics, containerPort: 8080}
            - {name: telemetry, containerPort: 8081}
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /livez, port: 8080}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/kube-state-metrics, readOnly: true}
      volumes:
        - name: config
          configMap: {name: kube-state-metrics-flux}
---
# Prometheus on the host: read-only, the API server's and kubelet's metrics, and the pods to scrape.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cz-prometheus
  namespace: cz-monitoring
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: cz-prometheus-token
  namespace: cz-monitoring
  annotations:
    kubernetes.io/service-account.name: cz-prometheus
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cz-prometheus
rules:
  - apiGroups: [""]
    resources: [pods, nodes, endpoints, services]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes/metrics]
    verbs: [get]
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cz-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cz-prometheus
subjects:
  - kind: ServiceAccount
    name: cz-prometheus
    namespace: cz-monitoring
