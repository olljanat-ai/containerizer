# The shared chart of Containerizer's generated components (docs/helm-chart.md).
#
# A HelmRelease sets `component`, `partOf`, `image` and `objects`: one entry per Kubernetes object of the
# component, holding only what differs from the defaults below. An object is built as
#   defaults["*"]  <-  defaults[<kind>]  <-  (pod and container defaults, for a Deployment or a CronJob)  <-  the entry
# An object named <name> also gets defaults["<kind>/<name>"] after defaults[<kind>].
# Maps merge key by key, a list replaces the default list, and the string "~unset" removes a default key.
# A list item or a map value "@<name>" is the fragment <name>. "${component}" and "${partOf}" in the defaults and fragments are
# the component's name and its application's namespace.
component: ""
partOf: ""
image:
  repository: ""
  tag: ""
  digest: ""
# kinds left out (the sandbox routes with its own Ingress and leaves out the HTTPRoutes)
skipKinds: []
objects: []

apiVersions:
  ConfigMap: v1
  CronJob: batch/v1
  Deployment: apps/v1
  ExternalSecret: external-secrets.io/v1
  HTTPRoute: gateway.networking.k8s.io/v1
  Ingress: networking.k8s.io/v1
  NetworkPolicy: networking.k8s.io/v1
  Password: generators.external-secrets.io/v1alpha1
  PersistentVolumeClaim: v1
  Role: rbac.authorization.k8s.io/v1
  RoleBinding: rbac.authorization.k8s.io/v1
  Secret: v1
  Service: v1
  ServiceAccount: v1

defaults:
  "*":
    metadata:
      name: ${component}
      labels:
        app.kubernetes.io/name: ${component}
        app.kubernetes.io/part-of: ${partOf}
  ServiceAccount:
    automountServiceAccountToken: false
  Deployment:
    spec:
      replicas: 1
      strategy:
        type: RollingUpdate
      selector:
        matchLabels:
          app.kubernetes.io/name: ${component}
          app.kubernetes.io/part-of: ${partOf}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ${component}
            app.kubernetes.io/part-of: ${partOf}
        spec: {}
  CronJob:
    spec:
      concurrencyPolicy: Forbid
      jobTemplate:
        spec:
          template:
            metadata:
              labels:
                app.kubernetes.io/name: ${component}
                app.kubernetes.io/part-of: ${partOf}
            spec:
              restartPolicy: OnFailure
  Service:
    spec:
      selector:
        app.kubernetes.io/name: ${component}
        app.kubernetes.io/part-of: ${partOf}
      ports:
      - name: http
        port: 80
        targetPort: http
  NetworkPolicy:
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: ${component}
          app.kubernetes.io/part-of: ${partOf}
      policyTypes:
      - Ingress
      - Egress
  Ingress:
    metadata:
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
        nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  ExternalSecret:
    spec:
      refreshInterval: 1h
      secretStoreRef:
        kind: ClusterSecretStore
        name: app-secrets
      target:
        creationPolicy: Owner
        deletionPolicy: Retain
  Password:
    spec:
      length: 64
      digits: 10
      symbols: 0
      noUpper: false
      allowRepeat: true
  # the component's secrets from the secret store (harden.externalize_secrets)
  ExternalSecret/${component}-secrets:
    spec:
      target:
        name: ${component}-secrets
  # the ASP.NET Core Data Protection key, generated in the cluster once (harden.dataprotection_docs): its key ring
  # file (spec.target.template.data) is the component's own
  Password/${component}-dataprotection: {}
  ExternalSecret/${component}-dataprotection:
    spec:
      secretStoreRef: ~unset
      refreshPolicy: CreatedOnce
      refreshInterval: "0"
      target:
        name: ${component}-dataprotection
        template:
          engineVersion: v2
      dataFrom:
      - sourceRef:
          generatorRef:
            apiVersion: generators.external-secrets.io/v1alpha1
            kind: Password
            name: ${component}-dataprotection
  PersistentVolumeClaim:
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi

# The hardening is not a value: templates/_helpers.tpl cz.harden sets it on every pod and container after the values
# (own user namespace, no service account token, non-root, seccomp RuntimeDefault, not privileged, no privilege
# escalation, read-only root file system, all capabilities dropped) and refuses host namespaces, hostPath volumes,
# hostPorts, unsafe sysctls, capabilities beyond NET_BIND_SERVICE and containers without a memory limit. The same
# settings below only keep the values short.

# the pod of a Deployment or a CronJob
pod:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1654
    runAsGroup: 1654
    fsGroup: 1654
    seccompProfile:
      type: RuntimeDefault
  # its own user namespace (hardening.user_namespaces in rules/60-security.yaml)
  hostUsers: false
  automountServiceAccountToken: false
  enableServiceLinks: false
  serviceAccountName: ${component}
  terminationGracePeriodSeconds: 30

# its first container (the image is image.repository:image.tag@image.digest)
container:
  name: ${component}
  imagePullPolicy: IfNotPresent
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    privileged: false
    capabilities:
      drop:
      - ALL
    seccompProfile:
      type: RuntimeDefault
    appArmorProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 512Mi
      ephemeral-storage: 1Gi

# list items and map values the objects name as "@<name>"
fragments:
  # probes on the http port: GET /health, or a TCP connect
  ready-health:
    httpGet:
      path: /health
      port: http
    periodSeconds: 10
  live-health:
    httpGet:
      path: /health
      port: http
    periodSeconds: 20
    initialDelaySeconds: 20
  start-health:
    httpGet:
      path: /health
      port: http
    periodSeconds: 5
    failureThreshold: 30
  ready-tcp:
    tcpSocket:
      port: http
    periodSeconds: 10
  live-tcp:
    tcpSocket:
      port: http
    periodSeconds: 20
    initialDelaySeconds: 20
  start-tcp:
    tcpSocket:
      port: http
    periodSeconds: 5
    failureThreshold: 30
  # NetworkPolicy egress: cluster DNS
  dns:
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  # NetworkPolicy egress and ingress: the pods of the same application
  to-app:
    to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: ${partOf}
  from-app:
    from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: ${partOf}
  # NetworkPolicy egress peers: any address outside the cluster except the cloud metadata endpoints, any namespace
  internet-v4:
    ipBlock:
      cidr: 0.0.0.0/0
      except:
      - 169.254.169.254/32
      - 169.254.170.2/32
      - 100.100.100.200/32
  internet-v6:
    ipBlock:
      cidr: ::/0
      except:
      - fd00:ec2::254/128
  # volumes and mounts
  tmp-mount:
    name: tmp
    mountPath: /tmp
  # env
  aspnetcore-production:
    name: ASPNETCORE_ENVIRONMENT
    value: Production
  dotnet-production:
    name: DOTNET_ENVIRONMENT
    value: Production
  dotnet-roll-forward:
    name: DOTNET_ROLL_FORWARD
    value: Major
