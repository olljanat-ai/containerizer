# Java dependencies (groupId:artifactId) whose Linux behaviour is known: pure Java, or native parts
# that ship Linux builds. A runtime dependency not matched here (and not explained by a finding rule)
# lowers the confidence of a Java component; the self-learning loop adds the ones that ran.
