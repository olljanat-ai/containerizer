# Plan rules learned by `containerizer verify --learn`. Safe to edit or delete.
rules:
- id: learned-build-rid-downgrade-controltower-booking-web
  phase: plan
  source: learned
  when:
    name: ^ControlTower\.Booking\.Web$
  plan:
    rid: portable
  learned_from: control-tower/ControlTower.Booking.Web
  learned_at: '2026-10-30'
  why: Restoring for linux-x64 pulls RID-specific packages of an old netstandard1.x dependency that conflict (package downgrade).
    A portable publish restores the same graph as the Windows build.
  refs:
  - https://learn.microsoft.com/en-us/nuget/reference/errors-and-warnings/nu1605
  - https://learn.microsoft.com/en-us/dotnet/core/rid-catalog
- id: learned-run-readonly-path-controltower-identity
  phase: plan
  source: learned
  when:
    name: ^ControlTower\.Identity$
  plan:
    add_writable:
    - /.devdata
  learned_from: control-tower/ControlTower.Identity
  learned_at: '2026-10-30'
  why: The app writes to a folder that is read-only in the hardened container.
  refs:
  - https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
