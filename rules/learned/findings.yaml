- id: learned-runtime-staffonboarding-provisioning-3
  source: learned
  severity: refactor
  category: runtime-observed
  title: Windows system library httpapi.dll called at runtime
  why: The app hosts on HTTP.sys (httpapi.dll), the Windows kernel HTTP driver; it does not exist on Linux.
  fix: Host on Kestrel and use the Negotiate handler for Windows authentication; re-run `containerizer verify`.
  when:
    name: ^StaffOnboarding\.Provisioning$
  learned_from: staff-onboarding/StaffOnboarding.Provisioning
  learned_at: '2026-10-30'
