- id: learned-runtime-vanarsdel-customers-api-13
  source: learned
  severity: refactor
  category: runtime-observed
  title: Machine-wide named mutex for single-instance
  why: A machine-wide named mutex (Global\\...) guards against a second instance. Containers do not share it; run a single
    replica or use a Kubernetes Lease / database lock.
  fix: See the verification log; fix and re-run `containerizer verify`.
  when:
    name: ^VanArsdel\.Customers\.Api$
  learned_from: retail-backoffice/VanArsdel.Customers.Api
  learned_at: '2026-10-30'
