# Identity, storage, data, messaging and third-party product dependencies.
rules:
  # ---------------------------------------------------------------- identity
  - id: windows-auth-iis
    applies_to: [dotnet]
    when:
      any:
        - config: '<authentication\s+mode="Windows"|windowsAuthentication\s+enabled="true"|"windowsAuthentication"\s*:\s*true'
        - code: 'WindowsPrincipal\b|User\.IsInRole\("[A-Z]+\\\\'
          unguarded: true
    severity: refactor
    category: identity
    effort: 2
    windows_container: true
    title: Windows (Kerberos/NTLM) authentication
    why: >-
      Users are authenticated by IIS Windows authentication against Active Directory. Linux
      containers are not domain joined; Negotiate can work with a keytab but is fragile behind
      ingress/load balancers.
    fix: Prefer OIDC (Entra ID/AD FS/Keycloak) at the app or ingress; otherwise use the Negotiate handler with a keytab Secret and an LDAP connection for roles.
    refs:
      - https://learn.microsoft.com/en-us/aspnet/core/security/authentication/windowsauth

  - id: negotiate-auth
    applies_to: [dotnet]
    when:
      any:
        - package: Microsoft\.AspNetCore\.Authentication\.Negotiate
        - code: 'NegotiateDefaults|AddNegotiate\('
    severity: config
    category: identity
    effort: 1
    title: Negotiate (Kerberos) authentication on ASP.NET Core
    why: >-
      Negotiate works on Linux only with Kerberos: a keytab for the service SPN mounted as a
      Secret, krb5.conf and the gss-ntlmssp/krb5 libraries in the image. Role (group) lookup
      on Linux needs LDAP settings.
    fix: Add krb5 libs to the image, mount KRB5_KTNAME keytab, configure EnableLdap; or switch to OIDC.
    refs:
      - https://learn.microsoft.com/en-us/aspnet/core/security/authentication/windowsauth

  - id: windows-identity-impersonation
    applies_to: [dotnet]
    when:
      code: 'WindowsIdentity\.(RunImpersonated(Async)?|Impersonate)\b|WindowsImpersonationContext|LogonUser\(|\.Impersonate\('
      unguarded: true
    severity: rewrite
    category: identity
    effort: 3
    windows_container: false
    title: Windows identity / impersonation / delegation
    why: >-
      Acts as the calling Windows user (impersonation, Kerberos delegation) to reach SQL,
      file shares or other services. Linux containers cannot obtain Windows tokens.
    fix: Use service identities with explicit authorization (OIDC on-behalf-of, scoped SQL logins) instead of impersonation.
    refs:
      - https://learn.microsoft.com/en-us/aspnet/core/security/authentication/windowsauth

  - id: windows-identity-current
    applies_to: [dotnet]
    when:
      all:
        - code: 'WindowsIdentity\.GetCurrent\('
          unguarded: true
        - not: {code: 'WindowsIdentity\.(RunImpersonated(Async)?|Impersonate)\b|WindowsImpersonationContext|LogonUser\(|\.Impersonate\('}
    severity: config
    category: identity
    effort: 0.25
    windows_container: true
    title: Reads the current Windows identity
    why: >-
      WindowsIdentity.GetCurrent() (usually to show or log the service account, or list its
      groups) throws PlatformNotSupportedException on Linux. It is not impersonation; the call
      just needs an OperatingSystem.IsWindows() guard or Environment.UserName instead.
    fix: Guard the call with OperatingSystem.IsWindows() or use Environment.UserName.

  - id: active-directory-ds
    applies_to: [dotnet]
    when:
      any:
        # type names are case-sensitive and must be the ADSI types: `new DirectoryEntry(...)` with an
        # ADSI path, or AD types in a file that imports System.DirectoryServices (a ClaimsPrincipal
        # variable `userPrincipal.` or an own method `DirectoryEntry(string path)` is not AD)
        - code: '(?-i:\bnew\s+DirectoryEntry\(\s*@?"(LDAP|WinNT|IIS|GC)://)'
        - all:
            - code: '(?-i:\bnew\s+(PrincipalContext|DirectoryEntry|DirectorySearcher)\(|(?<![\w.])(UserPrincipal|GroupPrincipal|ComputerPrincipal)\.\w|\bSystem\.DirectoryServices\.(AccountManagement\.)?(PrincipalContext|DirectoryEntry|DirectorySearcher|UserPrincipal)\b)'
            - code: '(?-i:\bSystem\.DirectoryServices\b(?!\.Protocols))'
          same_file: true
        - package: System\.DirectoryServices(\.AccountManagement)?
        - reference: System\.DirectoryServices(\.AccountManagement)?
    severity: refactor
    category: identity
    effort: 2
    windows_container: true
    title: Active Directory via System.DirectoryServices
    why: System.DirectoryServices / AccountManagement are Windows-only (ADSI). Only System.DirectoryServices.Protocols (LDAP) works on Linux.
    fix: Port lookups to LDAP (System.DirectoryServices.Protocols or Novell.Directory.Ldap) or to Microsoft Graph.
    refs:
      - https://learn.microsoft.com/en-us/dotnet/core/porting/windows-compat-pack
      - https://learn.microsoft.com/en-us/aspnet/core/security/authentication/windowsauth

  - id: gmsa
    applies_to: [dotnet]
    when:
      any:
        - text: 'gMSA|Group Managed Service Account|New-ADServiceAccount|svc-[\w\-]+\$'
          in: ["*.ps1", "*.psm1", "README.md", "*.md"]
    severity: config
    category: identity
    effort: 1
    title: Group managed service accounts
    why: >-
      Group managed service accounts (gMSA) are an Active Directory identity that only Windows
      containers can use, on domain-joined hosts or hosts with a ccg.exe plug-in. Linux containers
      cannot run as a gMSA.
    fix: Replace with workload identity / SQL logins / Kubernetes secrets.
    refs:
      - https://learn.microsoft.com/en-us/virtualization/windowscontainers/manage-containers/manage-serviceaccounts

  - id: adfs-wsfed-saml
    applies_to: [dotnet]
    when:
      any:
        - package: Microsoft\.AspNetCore\.Authentication\.WsFederation|Sustainsys\.Saml2.*|ITfoxtec\.Identity\.Saml2.*|Microsoft\.Owin\.Security\.WsFederation
    severity: info
    category: identity
    effort: 0.5
    title: WS-Federation / SAML (AD FS)
    why: >-
      The ASP.NET Core / OWIN WS-Federation and SAML handlers work from Linux containers; they need
      correct public URLs behind the ingress (forwarded headers). (WIF - System.IdentityModel.Services
      - is .NET Framework only and covered by mig-wif.)
    fix: Enable ForwardedHeaders and register the ingress host name with the IdP.
    refs:
      - https://learn.microsoft.com/en-us/aspnet/core/security/authentication/ws-federation
      - https://learn.microsoft.com/en-us/aspnet/core/host-and-deploy/proxy-load-balancer

  - id: machinekey
    applies_to: [dotnet]
    when:
      config: '<machineKey\s'
    severity: config
    category: identity
    effort: 0.5
    title: machineKey in web.config
    why: Shared machineKey for cookies/ViewState across a web farm; must not be baked into an image.
    fix: Inject as a Secret; on ASP.NET Core persist Data Protection keys to shared storage.
    refs:
      - https://learn.microsoft.com/en-us/aspnet/core/security/data-protection/compatibility/replacing-machinekey

  # repo scope: keys are often persisted in a shared library (e.g. nopCommerce's Nop.Web.Framework),
  # so the "not persisted" check has to look at the whole repository, not only the web project.
  - id: dataprotection-default
    applies_to: [dotnet]
    scope: repo
    when:
      all:
        - sdk: 'Microsoft\.NET\.Sdk\.Web'
        - code: '(?-i:\b(AddAuthentication|AddIdentity|AddCookie|AddSession|AddAntiforgery|AddRazorPages|AddControllersWithViews|AddDefaultIdentity)\b)'
          in: ["*.cs", "*.vb", "*.fs"]
        - not: {code: 'PersistKeysTo|AddDataProtection\(\)\s*\.\s*Persist', in: ["*.cs", "*.vb", "*.fs"]}
    severity: config
    category: identity
    effort: 0.5
    title: Data Protection keys not persisted
    why: >-
      Cookies and antiforgery tokens are encrypted with Data Protection keys. In a container the
      keys live in the pod's home folder and are lost on restart or differ between replicas, so
      users are logged out and forms fail.
    fix: Mount a volume at the key folder (set by the generator) or persist keys to Redis/SQL/blob in code.
    refs:
      - https://learn.microsoft.com/en-us/aspnet/core/security/data-protection/configuration/default-settings

  - id: dpapi
    applies_to: [dotnet]
    when:
      any:
        - code: 'ProtectedData\.(Protect|Unprotect)|DataProtectionScope\.|ProtectKeysWithDpapi'
        - package: System\.Security\.Cryptography\.ProtectedData
    severity: refactor
    category: secrets
    effort: 1
    windows_container: true
    title: DPAPI (Windows data protection)
    why: DPAPI ties encrypted data to a Windows user/machine; it is unavailable on Linux.
    fix: Store secrets in Kubernetes Secrets/Key Vault; re-encrypt existing data with a managed key.
    refs:
      - https://learn.microsoft.com/en-us/dotnet/api/system.security.cryptography.protecteddata

  - id: cert-store
    applies_to: [dotnet]
    when:
      any:
        - code: 'new\s+X509Store\(|StoreLocation\.LocalMachine|StoreName\.My|FindBySubjectName|FindByThumbprint'
        # configuration that points the app at the store (IdentityServer "Key": {"Type": "Store", ...},
        # Kestrel certificate {"Store": "My", "Location": "LocalMachine"}, WCF storeLocation=...)
        - config: '"StoreLocation"\s*:\s*"(LocalMachine|CurrentUser)"|"Location"\s*:\s*"(LocalMachine|CurrentUser)"|\bstoreLocation\s*=\s*"(LocalMachine|CurrentUser)"'
    severity: config
    category: secrets
    effort: 0.5
    title: Windows certificate store
    why: >-
      Certificates are looked up in the Windows certificate store (LocalMachine\My). On Linux
      the .NET X509Store is a per-user directory, empty in a fresh container.
    fix: Mount the certificate (PFX/PEM) from a Secret and load it from a file path; use cert-manager for TLS at the ingress.
    refs:
      - https://learn.microsoft.com/en-us/dotnet/standard/security/cross-platform-cryptography

  - id: secrets-in-config
    when:
      config: '("?(password|pwd|secret|apikey|api_key|clientsecret|accesskey)"?\s*[:=]\s*"(?!\s*"|\$\{|#\{|__|%|<|\*{3}|changeme|change_me|{{|\[[^"\]]*\]"|\{[^"}]*\}"|[x*\-]{3,}"|(your|enter[-_ ])[^"]*"|placeholder|todo)[^"]{4,}")|(Password\s*=\s*(?!\s*;|\$\{|#\{|__|<|\[|\{|[x*]{3,}\s*;|changeme|(your|my)[-_ ]?\w*\s*;)[^;"]{3,};)'
    severity: config
    category: secrets
    effort: 0.5
    title: Secrets in configuration files
    why: Passwords or keys are committed in config files and would be baked into the image.
    fix: Remove them from the image (.dockerignore) and inject via Kubernetes Secrets as environment variables.
    refs:
      - https://learn.microsoft.com/en-us/aspnet/core/security/app-secrets
      - https://kubernetes.io/docs/concepts/configuration/secret/

  # ---------------------------------------------------------------- data
  - id: sqlserver
    when:
      any:
        - package: Microsoft\.Data\.SqlClient|System\.Data\.SqlClient|Microsoft\.EntityFrameworkCore\.SqlServer|Dapper|EntityFramework|dbup-sqlserver|Hangfire\.SqlServer
        - config: '\bServer=(?![^"\n<]*;\s*(Port|Host)\s*=)|Data Source=[^;"]*(\\\\|,\d+|tcp:)|Initial Catalog='
    severity: info
    category: data
    effort: 0
    title: SQL Server database
    why: Stays external (managed SQL / existing server); reachable from the cluster over TCP 1433.
    fix: Pass the connection string as a Secret (ConnectionStrings__Name env var).
    refs:
      - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/configuration/

  - id: conn-string-compiled-in
    applies_to: [dotnet]
    when:
      all:
        - not: {role: 'test'}
        - code: '\.Use(SqlServer|AzureSql|Npgsql|MySql|MySQL|Oracle|Sqlite|Cosmos)\s*\(\s*(\w+\.)*(Constants?|Consts)\.\w+\s*[,)]|new\s+(Sql|Npgsql|MySql|Oracle|SqlCe)Connection\(\s*(\w+\.)*(Constants?|Consts)\.\w+\s*\)'
    severity: refactor
    category: data
    effort: 0.25
    windows_container: true
    title: Database connection string compiled into the code
    why: >-
      The code passes a constant (e.g. Constants.ConnectionString) to UseSqlServer or new
      SqlConnection, so the server, database and any password are fixed when the code is compiled.
      Every environment gets the same database, the value cannot be supplied through configuration,
      an environment variable or a Kubernetes Secret, and a password in it ends up in source control
      and in the image.
    fix: >-
      Read it with Configuration.GetConnectionString("Name") (or options) and supply
      ConnectionStrings__Name from a Secret.
    refs:
      - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/configuration/
      - https://learn.microsoft.com/en-us/aspnet/core/security/app-secrets
      - https://kubernetes.io/docs/concepts/configuration/secret/

  - id: sql-integrated-security
    when:
      config: '(Integrated Security\s*=\s*(true|SSPI|yes))|(Trusted_Connection\s*=\s*(true|yes))'
    severity: config
    category: data
    effort: 0.5
    windows_container: true
    title: SQL Server Windows authentication
    why: Integrated Security uses the Windows service account. From Linux it needs Kerberos (keytab) or a switch to SQL/Entra authentication.
    fix: Switch to SQL authentication or Entra managed identity with the password from a Secret.

  - id: msdtc
    when:
      any:
        - code: &dtc_code 'EnterpriseServicesInteropOption|TransactionInterop|DependentTransaction|EnlistDistributedTransaction|\.EnlistDurable\(|\bIPromotableSinglePhaseNotification\b'
        - config: &dtc_config '<system\.transactions>|\bMSDTC\b'
        - text: &dtc_text 'MSDTC|Distributed Transaction Coordinator'
          in: ["README.md", "*.ps1", "*.md"]
        # one transaction scope spanning two connections (or a connection and a queue) escalates to MSDTC
        - &dtc_multi
          all:
            - code: '\bTransactionScope\b'
            - code: '(new\s+\w*(Sql|Db|Oracle|OleDb|Odbc)Connection\(|\bnew\s+MessageQueue\()[\s\S]{1,3000}?(new\s+\w*(Sql|Db|Oracle|OleDb|Odbc)Connection\(|\bnew\s+MessageQueue\()'
          same_file: true
    severity: refactor
    category: data
    effort: 2
    windows_container: false
    title: Distributed transactions (MSDTC)
    why: >-
      Transactions that span several connections or queues escalate to a distributed transaction
      coordinated by MSDTC. Modern .NET (7+) supports distributed transactions only on Windows, and
      MSDTC is not available to Linux containers, so such a transaction throws at run time.
    fix: Restructure into single-resource transactions plus an outbox/saga pattern.
    refs:
      - https://github.com/dotnet/runtime/issues/715
      - https://learn.microsoft.com/en-us/dotnet/api/system.transactions.transactionmanager.implicitdistributedtransactions

  - id: transaction-scope
    when:
      all:
        - code: '\bTransactionScope\b'
        - not: {code: *dtc_code}
        - not: {config: *dtc_config}
        - not: *dtc_multi
    severity: info
    category: data
    effort: 0
    title: TransactionScope (local transactions)
    why: >-
      TransactionScope over a single connection stays a local transaction and works on Linux.
      Only if the scope opens a second connection/resource does it escalate to MSDTC, which
      Linux containers do not have - worth a check in testing.
    fix: None if each scope uses one connection; otherwise see msdtc.
    refs:
      - https://learn.microsoft.com/en-us/dotnet/api/system.transactions.transactionmanager.implicitdistributedtransactions

  - id: sql-filestream
    when:
      any:
        - code: '(?-i:SqlFileStream|FILESTREAM|\.PathName\(\)|GET_FILESTREAM_TRANSACTION_CONTEXT)'
        - text: '(?-i:FILESTREAM|FileTable)'
          in: ["*.sql", "README.md"]
    severity: refactor
    category: data
    effort: 2
    windows_container: false
    title: SQL Server FILESTREAM / FileTable
    why: SqlFileStream uses Win32 file handles over SMB to the SQL Server host; it does not work from Linux.
    fix: Read/write the varbinary(max) column through T-SQL, or move blobs to object storage.
    refs:
      - https://github.com/dotnet/corefx/issues/15652
      - https://learn.microsoft.com/en-us/sql/linux/sql-server-linux-editions-and-components-2022

  - id: sql-clr
    when:
      role: sqlclr
    severity: info
    category: data
    effort: 0
    title: SQL CLR assembly (runs inside SQL Server)
    why: This code runs inside the database engine, not as a container. It stays with SQL Server (Windows; SQL on Linux supports only SAFE CLR assemblies).
    fix: Keep with the database, or move logic to the application tier.
    refs:
      - https://learn.microsoft.com/en-us/sql/linux/sql-server-linux-editions-and-components-2022

  - id: sql-agent-ssis
    when:
      any:
        - role: ssis
        - file: "*.dtsx"
        - text: 'sp_add_job|SQL Server Agent|msdb\.dbo\.sp_add_jobstep'
          in: ["*.sql", "README.md"]
    severity: info
    category: data
    effort: 0
    title: SQL Server Agent jobs / SSIS packages
    why: Jobs and packages execute in SQL Server Agent/SSIS (Windows); they are database-tier, not containers.
    fix: Keep with SQL Server or re-implement as Kubernetes CronJobs.
    refs:
      - https://learn.microsoft.com/en-us/sql/linux/sql-server-linux-editions-and-components-2022

  - id: ssrs
    when:
      any:
        - package: Microsoft\.ReportingServices\..*|Microsoft\.ReportViewer\..*|ReportViewerCore\.WinForms
        - reference: Microsoft\.ReportViewer\..*|Microsoft\.ReportingServices\..*
        - file: "*.rdl"
        - all:
            - file: "*.rdlc"
            - not: {package: 'ReportViewerCore\.NETCore'}
    severity: rewrite
    category: reporting
    effort: 3
    windows_container: true
    title: SSRS / ReportViewer reports
    why: The ReportViewer controls (WebForms/WinForms) are .NET Framework only; local RDLC rendering is Windows-only.
    fix: Call the SSRS REST API from the app, or re-implement reports (QuestPDF, a BI tool).
    refs:
      - https://learn.microsoft.com/en-us/sql/reporting-services/application-integration/integrating-reporting-services-using-reportviewer-controls-get-started

  - id: ssrs-reportviewercore
    when:
      package: 'ReportViewerCore\.NETCore'
    severity: refactor
    category: reporting
    effort: 2
    title: Local RDLC reports with ReportViewerCore.NETCore
    why: >-
      ReportViewerCore.NETCore is a .NET (Core) port of the ReportViewer local-report engine that
      renders .rdlc reports on Linux, so the image must contain the fonts the reports use. Its README
      warns that PDF rendering measures fonts with a Windows library (Uniscribe) and that reports with
      images need System.Drawing, which is Windows-only; test those reports in the Linux image.
    fix: >-
      Install the fonts the reports use (e.g. fonts-liberation or the corporate fonts) in a full
      (non-chiseled) image, then test every report and export format in the Linux image; move PDF
      export or image-heavy reports to a Linux-capable engine (e.g. QuestPDF or a report server) if they fail.
    refs:
      - https://github.com/lkosson/reportviewercore

  - id: oledb-odbc-access
    when:
      any:
        - package: System\.Data\.OleDb
        # a database file name (orders.mdb), not a bare ".accdb" extension in a MIME/file-type map
        - code: 'Microsoft\.(ACE|Jet)\.OLEDB|OleDbConnection|\w\.(mdb|accdb)\b'
    severity: blocker
    category: data
    effort: 0
    windows_container: false
    title: OLE DB / Access database engine
    why: >-
      OLE DB is a COM-based Windows data access technology, and the Access/Jet/ACE database engine
      behind .mdb/.accdb files is a Windows-only Office component; neither exists on Linux.
    fix: Use a managed provider (e.g. ODBC with a Linux driver, or export the data); keep on Windows otherwise.

  - id: ibm-i-access
    when:
      any:
        - code: 'cwbx|IBM\.Data\.DB2\.iSeries|AS400System|iDB2Connection|cwbapi|IBMDA400'
        - package: IBM\.Data\.DB2\.iSeries
    severity: refactor
    category: data
    effort: 3
    windows_container: false
    title: IBM i Access Client (cwbx/iSeries provider)
    why: >-
      The IBM i Access Windows package (COM cwbx, iSeries .NET provider) is Windows-only.
      Linux alternatives exist (IBM i Access ODBC driver for Linux, Net.IBM.Data.Db2 with DB2
      Connect, or REST services on the IBM i).
    fix: Replace calls with the Linux ODBC driver/Net.IBM.Data.Db2 or IBM i web services.
    refs:
      - https://www.ibm.com/support/pages/odbc-driver-ibm-i-access-client-solutions

  - id: ax-business-connector
    when:
      any:
        - reference: Microsoft\.Dynamics\.BusinessConnectorNet|Microsoft\.Dynamics\.AX\..*
        - code: 'Microsoft\.Dynamics\.BusinessConnectorNet|\bAxapta\b|BusinessConnector'
    severity: blocker
    category: thirdparty
    effort: 0
    windows_container: false
    title: Dynamics AX 2012 .NET Business Connector
    why: The Business Connector is a 32/64-bit Windows client component of AX 2012; it cannot run on Linux.
    fix: Call AX through AIF/web services exposed by AX instead, or keep this component on a Windows host.
    refs:
      - https://learn.microsoft.com/en-us/previous-versions/dynamicsax-2012/developer/net-business-connector-overview

  - id: sharepoint-server
    when:
      any:
        - role: sharepoint
        - code: 'Microsoft\.SharePoint\.(Administration|SPFarm)|\bSPFarm\b|\bSPSecurity\b'
    severity: blocker
    category: thirdparty
    effort: 0
    windows_container: false
    title: SharePoint Server farm code
    why: Full-trust farm solutions (.wsp) run inside SharePoint Server on Windows.
    fix: Stays in SharePoint; only provider-hosted add-ins/remote sync components can move.
    refs:
      - https://learn.microsoft.com/en-us/sharepoint/dev/scenario-guidance/development-models

  - id: sharepoint-csom
    when:
      all:
        - package: Microsoft\.SharePoint(2013|2016|2019)?\.CSOM|Microsoft\.SharePointOnline\.CSOM|PnP\..*
        - not: {role: sharepoint}
    severity: config
    category: thirdparty
    effort: 0.5
    title: SharePoint client (CSOM)
    why: CSOM for SharePoint 2016 targets .NET Framework; on modern .NET use the SharePoint Online CSOM or REST. Server-to-server trust needs the certificate as a Secret.
    fix: Mount the S2S certificate from a Secret; use REST/CSOM for .NET Standard.
    refs:
      - https://learn.microsoft.com/en-us/sharepoint/dev/sp-add-ins/using-csom-for-dotnet-standard

  - id: biztalk
    when:
      any:
        - role: biztalk
        - reference: Microsoft\.BizTalk\..*|Microsoft\.XLANGs\..*
        - file: ["*.btm", "*.odx", "*.btp", "*.btproj"]
    severity: blocker
    category: thirdparty
    effort: 0
    windows_container: false
    title: BizTalk Server artifacts
    why: Orchestrations, maps, pipelines and pipeline components run inside BizTalk Server on Windows.
    fix: Keep on BizTalk or migrate integrations to Logic Apps / an integration platform; custom .NET helpers can move.
    refs:
      - https://learn.microsoft.com/en-us/biztalk/install-and-config-guides/hardware-and-software-requirements-for-biztalk-server-2020

  # ---------------------------------------------------------------- messaging
  - id: msmq
    when:
      any:
        - reference: System\.Messaging
        - code: '\bnew\s+(System\.Messaging\.)?MessageQueue\(|\bMessageQueue\.(Create|Exists|Delete|GetPrivateQueues\w*|GetPublicQueues\w*)\(|^\s*(using|Imports)\s+System\.Messaging\b|FormatName:|private\$\\\\|\bMsmqTransport\b'
        - config: 'netMsmqBinding|msmqIntegrationBinding|FormatName:|msmq\.formatname:'
        - package: Experimental\.System\.Messaging|MSMQ\.Messaging|NServiceBus\.(Transports?\.)?Msmq.*|MassTransit\.Msmq
    severity: rewrite
    category: messaging
    effort: 3
    windows_container: false
    title: MSMQ
    why: MSMQ is a Windows-only queueing service; it is not available to Linux containers.
    fix: Replace with RabbitMQ, Azure Service Bus or Kafka (MassTransit/NServiceBus abstractions help).
    refs:
      - https://github.com/dotnet/corefx/issues/6204

  - id: rabbitmq
    when:
      package: RabbitMQ\.Client|MassTransit\.RabbitMQ|EasyNetQ.*|NServiceBus\.RabbitMQ
    severity: info
    category: messaging
    effort: 0
    title: RabbitMQ
    why: >-
      The RabbitMQ .NET client is cross-platform and works from a Linux container; only the broker
      address and credentials must come from the environment. Run the broker as a cluster service or
      use a managed offering.
    fix: Provide the broker connection via Secret.

  - id: mqtt
    when:
      package: MQTTnet.*
    severity: info
    category: messaging
    effort: 0
    title: MQTT
    why: >-
      MQTTnet is a cross-platform MQTT client and works from a Linux container; the broker (for
      example Mosquitto) can run in the cluster or stay external.
    fix: None; supply the broker address and credentials through configuration/Secrets.

  - id: named-pipes
    when:
      code: 'NamedPipe(Server|Client)Stream|net\.pipe://'
    severity: refactor
    category: messaging
    effort: 1
    title: Named pipes IPC
    why: Windows named pipes are local IPC between processes on the same machine; containers in different pods cannot use them.
    fix: Use HTTP/gRPC between containers, or run both processes in one pod over a Unix domain socket.
    refs:
      - https://learn.microsoft.com/en-us/aspnet/core/grpc/interprocess

  # ---------------------------------------------------------------- storage
  - id: unc-shares
    when:
      any:
        - config: '\\\\\\\\[A-Za-z0-9][\w.\-]+\\\\[\w$.\-]+'
        - code: '@"\\\\\\\\[A-Za-z0-9][\w.\-]+\\\\|"\\\\\\\\\\\\\\\\[A-Za-z0-9][\w.\-]+\\\\\\\\'
    severity: config
    category: storage
    effort: 1
    title: Windows file shares (UNC paths)
    why: UNC paths (\\server\share) only work on Windows with SMB credentials of the process identity.
    fix: Mount the share as a Kubernetes volume (SMB CSI driver with a credentials Secret) and point the setting to the mount path.
    refs:
      - https://github.com/kubernetes-csi/csi-driver-smb

  - id: windows-drive-paths
    when:
      config: '"[A-Za-z]:\\\\\\\\|=\s*"?[C-Zc-z]:\\\\[^\\]|"[C-Z]:/'
    severity: config
    category: storage
    effort: 0.5
    title: Windows drive paths in configuration
    why: >-
      Settings point at Windows drive paths such as D:\Data. Linux has no drive letters, so the app
      cannot find or write these folders in a container.
    fix: Override the settings with Linux paths (env vars) that point at mounted volumes.

  - id: local-state-files
    when:
      all:
        - not: {role: 'test|library'}
        - any:
            - code: 'File\.(WriteAllText|WriteAllBytes|AppendAllText|Create|Move|Copy)\(|new\s+FileStream\(|Directory\.CreateDirectory\('
            - package: Serilog\.Sinks\.File|log4net|NLog
    severity: config
    category: storage
    effort: 0.25
    title: Writes to the local file system
    why: >-
      Files written in the container are lost on restart and not shared between replicas, and
      the image's app folder is read-only for the non-root user.
    fix: Mount volumes (emptyDir for scratch/logs, PVC or object storage for data) at the paths the app writes to; log to stdout.
    refs:
      - https://kubernetes.io/docs/concepts/storage/volumes/

  - id: sqlite-local
    when:
      package: Microsoft\.EntityFrameworkCore\.Sqlite|Microsoft\.Data\.Sqlite|System\.Data\.SQLite.*|LiteDB|dbup-sqlite
    severity: config
    category: storage
    effort: 0.25
    title: Embedded file database (SQLite/LiteDB)
    why: The database file must be on a persistent volume and the app limited to one replica.
    fix: Mount a PVC at the database folder and run a single replica (or move to a server database).
    refs:
      - https://kubernetes.io/docs/concepts/storage/persistent-volumes/

  - id: lucene-local-index
    when:
      package: Lucene\.Net.*
    severity: config
    category: storage
    effort: 0.5
    title: Local Lucene index
    why: >-
      Lucene.NET keeps its index in a local directory. In a container that folder is lost on restart
      unless it is on a persistent volume, and only one process may write to an index at a time.
    fix: PVC for the index and one replica for the indexer (or Elasticsearch/OpenSearch).
    refs:
      - https://kubernetes.io/docs/concepts/storage/persistent-volumes/

  - id: ftp-server-iis
    when:
      text: 'IIS FTP|Web-Ftp-Server|New-WebFtpSite|FTP Server'
      in: ["README.md", "*.ps1", "*.psm1"]
    severity: config
    category: networking
    effort: 1
    title: IIS FTP site for inbound files
    why: Partners upload files to an IIS FTP site; that becomes a separate SFTP/FTP service in the cluster.
    fix: Run an SFTP server container (e.g. atmoz/sftp) or managed SFTP, sharing a volume with the processor.

  - id: in-memory-session-scaleout
    applies_to: [dotnet]
    when:
      any:
        - config: '<sessionState\s+mode="InProc"|<sessionState(?![^>]*mode=)'
        - code: 'AddDistributedMemoryCache\(\)'
    severity: config
    category: scaling
    effort: 0.5
    title: In-process session state
    why: Sessions are kept in memory; with several replicas users lose sessions unless sticky sessions are used.
    fix: Use Redis/SQL distributed cache or enable session affinity on the ingress.
    refs:
      - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/app-state

  - id: signalr-scaleout
    when:
      all:
        - code: 'AddSignalR\(|MapHub<'
        - not: {code: 'AddStackExchangeRedis|AddAzureSignalR'}
    severity: config
    category: scaling
    effort: 0.5
    title: SignalR without backplane
    why: With more than one replica, clients connected to other pods miss messages.
    fix: Add a Redis backplane or enable session affinity and run one replica.
    refs:
      - https://learn.microsoft.com/en-us/aspnet/core/signalr/scale

  - id: hangfire-quartz
    when:
      package: Hangfire.*|Quartz.*|FluentScheduler|Cronos
    severity: info
    category: scaling
    effort: 0
    title: In-process job scheduler
    why: Scheduled jobs run inside the app; multiple replicas run them more than once unless the scheduler uses a shared store/locks.
    fix: Use a persistent job store (Hangfire SQL, Quartz clustering) or run the job host with one replica / as a CronJob.
    refs:
      - https://www.quartz-scheduler.net/documentation/quartz-3.x/tutorial/advanced-enterprise-features.html

  # ---------------------------------------------------------------- third-party binaries
  - id: vendor-install-required
    when:
      text: '\.msi\b|Install-[A-Za-z]+\.ps1|licen[cs]e (file|key)|\.mrl\b|dongle'
      in: ["README.md"]
    scope: repo
    severity: info
    category: thirdparty
    effort: 0
    title: Vendor software installed on servers
    why: The README lists vendor installers/licences; check whether each one has a Linux version.
    fix: Inventory each vendor component's Linux support before planning.
