# Make it A+: OpenTelemetry for the applications rated A, without a code change (containerizer/telemetry.py,
# docs/telemetry.md). What is injected into a component's workloads in the sandbox is data: the agent of each
# runtime (the auto-instrumentation images of the OpenTelemetry Operator project, used here without the operator:
# an init container copies the agent into an emptyDir, and the environment loads it), and where they send.
telemetry:
  # The sandbox's collector (the appliance: /var/lib/rancher/k3s/server/manifests/containerizer-telemetry.yaml).
  # CONTAINERIZER_OTLP_ENDPOINT of the queue runner replaces `endpoint` for another cluster's collector.
  collector:
    endpoint: http://otel-collector.cz-monitoring.svc.cluster.local:4318
    protocol: http/protobuf
    # the NetworkPolicy rule the instrumented components get: the collector's pods and port
    namespace: cz-monitoring
    pod_labels: {app.kubernetes.io/name: otel-collector}
    port: 4318
    # what the queue runner asks Prometheus (CONTAINERIZER_TELEMETRY_PROMETHEUS) to see whose telemetry arrives:
    # the services that have a series there now. The collector exports every series (the applications' metrics,
    # and the request metrics it makes from their spans) with the namespace and the service as labels, and drops
    # a series 15 minutes after its last value.
    seen_query: 'count by (k8s_namespace_name, service_name) ({k8s_namespace_name!="", service_name!=""})'
    namespace_label: k8s_namespace_name
    service_label: service_name
  # on every instrumented workload, next to its name, namespace and the collector's address
  resource_attributes:
    deployment.environment.name: sandbox
  env:
    OTEL_TRACES_EXPORTER: otlp
    OTEL_METRICS_EXPORTER: otlp
    OTEL_LOGS_EXPORTER: otlp
    OTEL_PROPAGATORS: tracecontext,baggage
    OTEL_METRIC_EXPORT_INTERVAL: "30000"
  # One agent per runtime. `match`: the image the component runs on (the last FROM of its generated Dockerfile; the
  # generator's images are glibc: rules/images.yaml), with the runtime's version when the image names it.
  # `copy`: the init container's command ({dir}: the emptyDir). `mount`: where the workload sees it. `env`: set as
  # it is; `append` and `prepend`: added to what the image or the manifest sets already ({dir}: the mount).
  agents:
    dotnet:
      title: .NET
      image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-dotnet:1.19.1-1@sha256:1978ec9b72d2faccee7b7504190374284e7979c280780d2df51a0f953ec95456
      match:
        - 'mcr\.microsoft\.com/dotnet/(?:aspnet|runtime):(?P<version>\d+\.\d+)'
      # this agent release has .NET 8, 9 and 10 (a newer runtime crashes at start with it; 6 and 7 are gone since 1.10)
      min_version: "8.0"
      max_version: "10.0"
      copy: [cp, -r, /autoinstrumentation/., "{dir}"]
      mount: /otel-auto-instrumentation-dotnet
      size: 200Mi
      env:
        CORECLR_ENABLE_PROFILING: "1"
        CORECLR_PROFILER: "{918728DD-259F-4A6A-AC2B-B85E1B658318}"
        CORECLR_PROFILER_PATH: "{dir}/linux/OpenTelemetry.AutoInstrumentation.Native.so"
        DOTNET_STARTUP_HOOKS: "{dir}/net/OpenTelemetry.AutoInstrumentation.StartupHook.dll"
        OTEL_DOTNET_AUTO_HOME: "{dir}"
        # its own log goes to a file by default; the root filesystem is read-only
        OTEL_DOTNET_AUTO_LOGGER: none
    java:
      title: Java
      image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.33.1-3@sha256:383a36e8d63a96435a04f2a32f0bf065f211f9ef0c6e75e9e895f0f7d272659a
      match:
        - 'gcr\.io/distroless/java(?P<version>\d+)'
        - '(?:^|/)eclipse-temurin:(?P<version>\d+)'
        - '(?:^|/)tomcat:[\d.]+-jre(?P<version>\d+)'
      min_version: "8"
      copy: [cp, /javaagent.jar, "{dir}/javaagent.jar"]
      mount: /otel-auto-instrumentation-java
      size: 200Mi
      append:
        JAVA_TOOL_OPTIONS: "-javaagent:{dir}/javaagent.jar"
    node:
      title: Node.js
      image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-nodejs:0.83.0-2@sha256:95eab2e69371bfd867206a95704cc5c87713f26315497fd0d0d27c4b102d70f0
      match:
        - 'gcr\.io/distroless/nodejs(?P<version>\d+)'
        - '(?:^|/)node:(?P<version>\d+)'
      min_version: "22"
      copy: [cp, -r, /autoinstrumentation/., "{dir}"]
      mount: /otel-auto-instrumentation-nodejs
      size: 200Mi
      append:
        NODE_OPTIONS: "--require {dir}/autoinstrumentation.js"
    python:
      title: Python
      image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python:0.66b2-5@sha256:2758fda65f55f77b6de42ee28bfcc190d3e31552bad30a38bc6724b822b7c245
      match:
        - '(?:^|/)python:(?P<version>\d+\.\d+)'
      min_version: "3.10"
      copy: [cp, -r, /autoinstrumentation/., "{dir}"]
      mount: /otel-auto-instrumentation-python
      size: 200Mi
      prepend:
        PYTHONPATH: "{dir}/opentelemetry/instrumentation/auto_instrumentation:{dir}"
  # Images without an agent, with why. `static`: no code of the application runs there, so it does not keep the
  # application from A+.
  unsupported:
    - match: '(?:^|/)nginx|nginxinc/'
      static: true
      reason: "static files served by nginx: no code of the application runs there"
    - match: 'gcr\.io/distroless/(?:static|base)'
      reason: "Go: OpenTelemetry has no agent for a Go binary; add the OpenTelemetry SDK to its code, and Make it A+ gives it the collector's address"
  # A component with one of these packages (its own or a referenced project's) brings the OpenTelemetry SDK in its
  # code: it gets the collector's address and the NetworkPolicy rule, no agent.
  sdk_packages:
    - '^OpenTelemetry$'
    - '^OpenTelemetry\.(Extensions\.Hosting|Exporter\.)'
    - '^Azure\.Monitor\.OpenTelemetry'
    - '^@opentelemetry/(sdk-node|sdk-trace-node|auto-instrumentations-node)$'
    - '^opentelemetry[-_](sdk|distro)$'
    - 'opentelemetry-(sdk|spring-boot-starter|javaagent)'
    - 'micrometer-tracing-bridge-otel'
    - '^go\.opentelemetry\.io/otel/sdk'
