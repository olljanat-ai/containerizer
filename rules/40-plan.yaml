# Build-plan rules: adjust how a component is built and run. Each `plan`
# patch is merged into the component's build plan:
#   base: chiseled | full          runtime image flavour
#   add_packages: [..]             apt packages (forces base: full)
#   env: {K: V}                    environment variables
#   add_writable: [..]             folders (relative to /app or absolute) that must be writable
#   publish_args: [..]             extra `dotnet publish` arguments
#   remove_files: [..]             files removed in the build stage (never in the app repo)
#   strategy: rollforward|retarget how out-of-support TFMs are handled
rules:
  - id: plan-negotiate-krb5
    phase: plan
    applies_to: [dotnet]
    why: >-
      Windows (Negotiate/Kerberos) authentication on Linux needs the GSSAPI libraries and a keytab; the image gets the packages and KRB5_KTNAME points at a keytab mounted from a Secret.
    refs:
      - https://learn.microsoft.com/en-us/aspnet/core/security/authentication/windowsauth
    when: {package: Microsoft\.AspNetCore\.Authentication\.Negotiate}
    plan:
      add_packages: [libkrb5-3, libgssapi-krb5-2, gss-ntlmssp]
      env: {KRB5_KTNAME: /etc/krb5/keytab/service.keytab}

  - id: plan-wkhtmltox
    phase: plan
    applies_to: [dotnet]
    why: >-
      The PDF library wraps wkhtmltopdf, a native library; the Linux build is installed from the distribution packages.
    when:
      any:
        - package: DinkToPdf|Rotativa.*|TuesPechkin.*|WkHtmlToPdf.*
        - code: 'libwkhtmltox'
    plan:
      add_packages: [libwkhtmltox0]

  - id: plan-global-json
    phase: plan
    applies_to: [dotnet]
    why: >-
      global.json pins an SDK version that the build image may not have; it is removed in the build stage only (never in the repository) so the image's SDK builds the project.
    refs:
      - https://learn.microsoft.com/en-us/dotnet/core/tools/global-json
    scope: repo
    when: {file: global.json}
    plan:
      remove_files: [global.json]

  - id: plan-sqlite-data
    phase: plan
    applies_to: [dotnet]
    why: >-
      SQLite keeps data in a local file that only one process can safely write; the component runs as a single replica with the file on a volume.
    refs:
      - https://learn.microsoft.com/en-us/dotnet/standard/data/sqlite/connection-strings
      - https://kubernetes.io/docs/concepts/storage/persistent-volumes/
    when: {package: 'Microsoft\.EntityFrameworkCore\.Sqlite|Microsoft\.Data\.Sqlite'}
    plan:
      single_replica: true

  - id: plan-hangfire-memory
    phase: plan
    applies_to: [dotnet]
    why: >-
      Hangfire in-memory storage keeps jobs inside one process; more replicas would each run their own copy of every job, so one replica is used.
    when: {package: 'Hangfire\.MemoryStorage|Hangfire\.InMemory'}
    plan:
      single_replica: true

  - id: plan-dataprotection-keys
    phase: plan
    applies_to: [dotnet]
    why: >-
      ASP.NET Core Data Protection keeps its key ring under the user's home folder. The generated manifests mount one key there, read-only, from a Secret that External Secrets Operator generates once in the cluster, so every replica and restart shares it (PersistKeysTo* in code takes over when present).
    refs:
      - https://learn.microsoft.com/en-us/aspnet/core/security/data-protection/configuration/overview
    when:
      all:
        - role: web
        - not: {code: 'PersistKeysTo'}
    plan:
      add_writable: [/home/app/.aspnet/DataProtection-Keys]

  - id: plan-file-logs
    phase: plan
    applies_to: [dotnet]
    why: >-
      The app logs to files under its own folder; the folder is made writable so start-up does not fail on the read-only root file system (console logging is preferred).
    refs:
      - https://learn.microsoft.com/en-us/dotnet/core/extensions/logging/providers
    when: {package: 'Serilog\.Sinks\.File|NLog(\..*)?|log4net'}
    plan:
      add_writable: [logs]

  - id: plan-aspnet-framework-worker
    phase: plan
    applies_to: [dotnet]
    why: >-
      The worker references the ASP.NET Core shared framework, which is only in the aspnet runtime image.
    refs:
      - https://learn.microsoft.com/en-us/dotnet/core/docker/container-images
    when:
      all:
        - not: {role: web}
        - any:
            - sdk: 'Microsoft\.NET\.Sdk\.Web'
            - framework_ref: 'Microsoft\.AspNetCore\.App'
            # a referenced library with <FrameworkReference Include="Microsoft.AspNetCore.App" />
            # puts the framework into the worker's runtimeconfig.json as well
            - closure: {framework_ref: 'Microsoft\.AspNetCore\.App'}
    plan:
      aspnet_runtime: true

  - id: plan-rid-portable-netstandard1
    phase: plan
    applies_to: [dotnet]
    why: >-
      A dependency built for netstandard1.x pins System.* 4.0.x packages (SSH.NET 2016.x directly;
      Microsoft.Azure.Amqp 2.5.6 through System.Net.WebSockets.Client 4.0.2, pulled in by
      Azure.Messaging.ServiceBus 7.5.0 and MassTransit.Azure.ServiceBus.Core 7.3). Restoring for
      the linux-x64 runtime identifier adds runtime.unix.* packages that need 4.3.0, which NuGet
      reports as a package downgrade (NU1605, an error in SDK builds). A portable publish (no -r)
      restores the same graph as the Windows build and runs on the Linux runtime image. Upgrading
      the package (SSH.NET 2020.0.0+, a current Azure.Messaging.ServiceBus) removes the conflict.
    refs:
      - https://learn.microsoft.com/en-us/nuget/reference/errors-and-warnings/nu1605
      - https://learn.microsoft.com/en-us/dotnet/core/rid-catalog
      - https://www.nuget.org/packages/SSH.NET/2016.1.0
      - https://www.nuget.org/packages/Microsoft.Azure.Amqp/2.5.6
    when:
      # each combination below was reproduced with `dotnet restore -r linux-x64` (2026-10-31)
      closure:
        any:
          - {package: 'SSH\.NET', version: '2016\..*'}
          - {package: 'MassTransit\.Azure\.ServiceBus\.Core', version: '7\.3\..*'}
          - {package: 'Azure\.Messaging\.ServiceBus', version: '7\.5\.0'}
          - {package: 'Microsoft\.Azure\.Amqp', version: '2\.5\.6'}
    plan:
      rid: portable

  # ---- platform techniques (containerizer/techniques.py): configuration that satisfies a finding, so the code
  # stays as it is. `resolves` names the findings; while the technique applies they count as `config`.
  - id: plan-kerberos-client
    phase: plan
    applies_to: [dotnet]
    resolves: [wcf-windows-client-credentials]
    why: >-
      The WCF client calls with Windows credentials. The image gets the GSSAPI libraries, and
      KRB5_CLIENT_KTNAME points at a client keytab mounted read-only from an optional Secret
      (<component>-client-keytab): MIT krb5 then gets an initial ticket for the keytab's principal on its
      own, so the unchanged binding authenticates as that account. KRB5_CONFIG reads krb5.conf from the same
      Secret when it is there (the realm's KDCs are otherwise found through DNS SRV records), and the
      NetworkPolicy allows Kerberos to the KDC.
    refs:
      - https://web.mit.edu/kerberos/krb5-latest/doc/basic/keytab_def.html
      - https://web.mit.edu/kerberos/krb5-latest/doc/admin/env_variables.html
    when: {}
    plan:
      add_packages: [libkrb5-3, libgssapi-krb5-2, gss-ntlmssp]
      env:
        KRB5_CLIENT_KTNAME: /etc/krb5/client/client.keytab
        KRB5_CONFIG: /etc/krb5/client/krb5.conf:/etc/krb5.conf
      needs_external: a Kerberos client identity (client keytab and a reachable KDC)

  - id: plan-machine-hostname
    phase: plan
    applies_to: [dotnet]
    resolves: [os-machine-name-switch]
    technique: machine-hostname
    why: >-
      The code switches behaviour on Environment.MachineName, which on Linux is the pod's host name. The pod
      spec's `hostname:` field sets it to the name the code compares with, so the same branch runs as on the
      old server without a code change.
    refs:
      - https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/#pod-s-hostname-and-subdomain-fields
      - https://learn.microsoft.com/en-us/dotnet/api/system.environment.machinename
    when: {}

  - id: plan-x509-user-store
    phase: plan
    applies_to: [dotnet]
    resolves: [cert-store]
    technique: x509-user-store
    why: >-
      The code looks certificates up in the CurrentUser\My store. .NET on Linux reads that store from
      ~/.dotnet/corefx/cryptography/x509stores/my, one password-less .pfx file per certificate, so an optional
      Secret (<component>-x509-my, keys ending in .pfx) is mounted there read-only and the unchanged lookup
      (FindByThumbprint, FindBySubjectName) finds the certificate. LocalMachine\Root and \CA are the image's CA bundle.
    refs:
      - https://learn.microsoft.com/en-us/dotnet/standard/security/cross-platform-cryptography
    when: {}

  - id: plan-special-folder-workdir
    phase: plan
    applies_to: [dotnet]
    resolves: [os-special-folder-windows]
    technique: special-folder-workdir
    why: >-
      Environment.GetFolderPath returns "" for Program Files, Windows and the other Windows-only folders on
      Linux, so Path.Combine(GetFolderPath(...), "Vendor", ...) becomes the relative path Vendor/... under the
      working directory /app. A volume is mounted at each of those folders, so the unchanged code finds
      (and can write) them; the files the app expects there come from a ConfigMap, a Secret or an init container.
    refs:
      - https://learn.microsoft.com/en-us/dotnet/api/system.environment.getfolderpath
      - https://learn.microsoft.com/en-us/dotnet/api/system.io.path.combine
    when: {}
