# Security gate: Kubernetes hardening, the exceptions an application may need,
# Dockerfile/manifest lint checks, image scan policy and base image lifecycle.
# Used by `containerizer generate` (hardening), `containerizer gate` and
# `containerizer images`.

hardening:
  # Applied to every generated pod and container.
  baseline:
    pod:
      securityContext:
        runAsNonRoot: true
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      automountServiceAccountToken: false
      enableServiceLinks: false
    container:
      securityContext:
        runAsNonRoot: true
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
        seccompProfile: {type: RuntimeDefault}
      resources:
        requests: {cpu: 100m, memory: 256Mi, ephemeral-storage: 64Mi}
        limits: {memory: 512Mi, ephemeral-storage: 1Gi}
    # every emptyDir gets a size limit so a runaway writer can't fill the node
    empty_dir_size_limit: 256Mi

  # UID/GID the final image runs as (runAsUser/runAsGroup/fsGroup).
  run_as:
    dotnet: 1654          # 'app' user of the Microsoft .NET 8+ images
    spa: 101              # nginx-unprivileged
    default: 10001

  # Exceptions: added only when `when` (rule conditions, see rules.py) and
  # `if_plan` (regex per build-plan key) match. Patch keys:
  #   writable: [paths]            extra emptyDir mounts (read-only root FS stays on)
  #   size_limits: {path: size}    emptyDir size limit for a mounted path
  #   sysctls: [{name, value}]     pod sysctls (only the Kubernetes "safe" set passes the lint)
  #   capabilities_add: [..]       container capabilities (only NET_BIND_SERVICE passes the lint)
  #   automount_token: true        mount the service account token
  #   resources: {...}             merged over the baseline resources
  #   env: {K: V}                  extra environment variables
  #   secret_mounts: [{name, path, items?}]  Secret `<component>-<name>` mounted read-only at path
  #   waives: [check ids]          lint checks this exception is allowed to relax
  # Each applied exception is recorded on the pod template as an annotation
  # (containerizer.io/exception.<id>) with its reason, so reviewers see why.
  exceptions:
    - id: nginx-writable-dirs
      when: {role: spa}
      patch:
        writable: [/tmp, /var/cache/nginx]
      why: nginx keeps its pid file and request buffers in /tmp and its proxy cache in /var/cache/nginx.

    - id: kerberos-keytab
      when: {package: 'Microsoft\.AspNetCore\.Authentication\.Negotiate'}
      patch:
        writable: [/tmp]
        env: {KRB5CCNAME: 'FILE:/tmp/krb5cc_app'}
        secret_mounts: [{name: keytab, path: /etc/krb5/keytab}]
      why: Windows authentication on Linux needs the service keytab (from a Secret, never the image) and a writable credential cache.

    - id: native-rendering-memory
      when:
        any:
          - package: 'DinkToPdf|Rotativa.*|TuesPechkin.*|WkHtmlToPdf.*|PdfSharp.*|QuestPDF|SkiaSharp.*|SixLabors\.ImageSharp.*|Magick\.NET.*|System\.Drawing\.Common|PuppeteerSharp|Microsoft\.Playwright'
      patch:
        writable: [/home/app/.cache]
        resources:
          requests: {memory: 512Mi}
          limits: {memory: 1Gi}
      why: PDF and image rendering allocates large native buffers outside the .NET heap, and fontconfig writes a font cache under $HOME/.cache.

    - id: file-uploads
      when: {code: '\bIFormFile\b|\bMultipartReader\b|\bIFormFileCollection\b'}
      patch:
        size_limits: {/tmp: 1Gi}
        resources:
          limits: {ephemeral-storage: 2Gi}
      why: ASP.NET Core buffers uploads larger than 64 KB to temporary files.

    - id: icmp-ping
      when: {code: '\bnew\s+Ping\s*\(|\.SendPingAsync\s*\(|\bPing\(\)\.Send\('}
      patch:
        sysctls: [{name: net.ipv4.ping_group_range, value: '0 2147483647'}]
      why: System.Net.NetworkInformation.Ping uses unprivileged ICMP sockets on Linux; the pod must allow them (no NET_RAW needed).

    - id: kubernetes-api-client
      when: {package: '^KubernetesClient$|^k8s\.|^Steeltoe\.Discovery\.Kubernetes|^Microsoft\.Extensions\.Configuration\.Kubernetes'}
      patch:
        automount_token: true
      why: The application talks to the Kubernetes API and needs its service account token. Bind it to a Role with only the verbs it uses.
      waives: [sa-token]

    - id: privileged-port
      if_plan: {port: '^([1-9]\d{0,2}|10[01]\d|102[0-3])$'}
      patch:
        capabilities_add: [NET_BIND_SERVICE]
      why: The container listens on a port below 1024.

  # Container AppArmor profile (NSA/CISA: "Hardening container environments").
  # Needs AppArmor-enabled nodes (Ubuntu/Debian/COS). On SELinux nodes
  # (RHEL, OpenShift) set this to none; SELinux confines pods there.
  apparmor: RuntimeDefault
  # Every component gets its own ServiceAccount with no token automount and
  # no RBAC bindings (NSA/CISA "Authentication and authorization", CIS 5.1.5/5.1.6).
  service_account: true

# Network separation (NSA/CISA "Network policies", CIS 5.3.2): the namespace
# denies all ingress and egress by default; each component may only
#   - receive traffic on its own service port,
#   - talk to the other components of the same application,
#   - resolve names through cluster DNS,
#   - reach the external dependencies below, found from its packages and
#     configuration, never the cloud metadata endpoints.
# Review the inferred egress before production: unknown dependencies are not
# opened, so a missing entry shows up as a connection timeout.
network:
  default_deny: true
  dns:
    namespace: kube-system
    pod_labels: {k8s-app: kube-dns}
    ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
  # external destinations (ipBlock) never reachable from application pods
  blocked_cidrs: [169.254.169.254/32, 169.254.170.2/32, fd00:ec2::254/128, 100.100.100.200/32]
  # roles that serve static files only (their configured URLs are called by the browser, not the pod)
  no_egress_roles: [spa]
  # configured URLs pointing here are not dependencies
  local_hosts: '^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1?\]|\*|\+)$'
  # who may call a component's service port: any namespace (ingress controllers live elsewhere)
  ingress_from: [{namespaceSelector: {}}]
  egress:
    - id: sql-server
      when: {package: 'Microsoft\.Data\.SqlClient|System\.Data\.SqlClient|Microsoft\.EntityFrameworkCore\.SqlServer.*|Hangfire\.SqlServer|dbup-sqlserver|Microsoft\.SqlServer\..*'}
      ports: [1433]
    - id: postgres
      when: {package: 'Npgsql.*|dbup-postgresql'}
      ports: [5432]
    - id: mysql
      when: {package: 'MySql\..*|MySqlConnector|Pomelo\.EntityFrameworkCore\.MySql'}
      ports: [3306]
    - id: oracle
      when: {package: 'Oracle\.(ManagedDataAccess|EntityFrameworkCore).*'}
      ports: [1521]
    - id: mongodb
      when: {package: 'MongoDB\.Driver.*'}
      ports: [27017]
    - id: redis
      when: {package: 'StackExchange\.Redis|Microsoft\.Extensions\.Caching\.StackExchangeRedis|.*SignalR\.StackExchangeRedis'}
      ports: [6379, 6380]
    - id: rabbitmq
      when: {package: 'RabbitMQ\.Client|MassTransit\.RabbitMQ|EasyNetQ.*'}
      ports: [5671, 5672]
    - id: azure-service-bus
      when: {package: 'Microsoft\.Azure\.ServiceBus|Azure\.Messaging\.ServiceBus|MassTransit\.Azure\.ServiceBus.*'}
      ports: [5671, 443]
    - id: kafka
      when: {package: 'Confluent\.Kafka|MassTransit\.Kafka'}
      ports: [9092, 9093]
    - id: smtp
      when:
        any:
          - package: 'MailKit|MimeKit|FluentEmail\.Smtp'
          - code: '\bSmtpClient\b'
      ports: [25, 465, 587]
    - id: active-directory
      when:
        any:
          - package: 'Microsoft\.AspNetCore\.Authentication\.Negotiate|System\.DirectoryServices.*|Novell\.Directory\.Ldap.*'
      ports: [{port: 88, protocol: TCP}, {port: 88, protocol: UDP}, 389, 636, 464, 3268, 3269]
    - id: sftp
      when: {package: 'SSH\.NET|Renci\.SshNet.*|WinSCP'}
      ports: [22]
    - id: seq
      when: {package: 'Serilog\.Sinks\.Seq'}
      ports: [5341, 443]
    - id: http-apis
      when:
        any:
          - package: 'Microsoft\.Extensions\.Http.*|RestSharp|Refit.*|Flurl.*|Grpc\.Net\.Client.*|Grpc\.Net\.ClientFactory|System\.ServiceModel\.Http|Polly.*|Microsoft\.AspNetCore\.SignalR\.Client|Ocelot.*|Yarp\..*'
          - code: '\bnew\s+HttpClient\s*\(|\bIHttpClientFactory\b|\bWebClient\b|\bHttpWebRequest\b'
      ports: [443, 80]
    # explicit ports in configuration: "Server=db,14330", "Port=5433", "http://api:8081"
    - id: configured-ports
      captures_port: true
      when:
        any:
          - config: '(?i)(?:Server|Data Source|Address|Host)\s*=\s*[\w.\-]+,(?P<port>\d{2,5})'
          - config: '(?i)\bPort\s*=\s*(?P<port>\d{2,5})'
          - config: '(?i)\b(?:https?|amqps?|redis|mongodb|ldaps?|smtp)://[\w.\-@]+:(?P<port>\d{2,5})'

# Namespace resource policies (NSA/CISA "Resource policies"): a LimitRange
# gives defaults to anything added by hand, a ResourceQuota caps the namespace
# at the sum of the generated limits times `headroom`.
namespace_policy:
  limit_range:
    # no default CPU limit: limits throttle .NET thread pools; requests are enough for scheduling
    default: {memory: 512Mi, ephemeral-storage: 1Gi}
    defaultRequest: {cpu: 100m, memory: 256Mi, ephemeral-storage: 64Mi}
    max: {memory: 4Gi, ephemeral-storage: 4Gi}
  quota_headroom: 1.5          # room for a rolling update
  quota_extra: {pods: 10, services: 10, persistentvolumeclaims: 10, secrets: 20, configmaps: 20}
  quota_floor: {requests.cpu: '1', requests.memory: 1Gi, limits.memory: 2Gi}

# Secrets (NSA/CISA "Secrets", CIS 5.4.2): no generated file holds a Secret object or a secret value.
# Every Secret is an ExternalSecret (External Secrets Operator) read from `store`. The store
# authenticates as ServiceAccount `reader.name` in the namespace of each ExternalSecret (ESO
# "referent" auth: no namespace in the store's serviceAccountRef), so each namespace reads only what
# its own reader is granted. Remote keys are `key_format`; `{namespace}` is the app's namespace and
# `{name}` the component, or cz-git / cz-git-gpg / cz-registry / cz-cosign-pub for platform credentials.
# docs/external-secrets.md: populating the store, and pointing it at Vault, Azure Key Vault or AWS.
secrets:
  mode: external-secrets            # the only mode
  store: {kind: ClusterSecretStore, name: app-secrets}
  refresh_interval: 1h
  key_format: '{namespace}--{name}'  # valid as a Kubernetes Secret, Azure Key Vault, AWS and Vault name
  reader:
    name: app-secrets-reader
    annotations: {}                 # e.g. eks.amazonaws.com/role-arn, azure.workload.identity/client-id
  # backend of the generated cluster/secret-store.yaml (CONTAINERIZER_SECRET_STORE overrides it).
  # `kubernetes` is the appliance sandbox default: Secrets in a locked-down namespace of the same cluster.
  provider: kubernetes
  providers:
    kubernetes:
      remoteNamespace: containerizer-secrets
      server:
        url: https://kubernetes.default.svc
        caProvider: {type: ConfigMap, name: kube-root-ca.crt, key: ca.crt, namespace: containerizer-secrets}
      auth:
        serviceAccount: {name: app-secrets-reader}
    vault:                          # HashiCorp Vault / OpenBao, KV v2, Kubernetes auth per namespace
      server: https://vault.example.com:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: app-secrets
          serviceAccountRef: {name: app-secrets-reader, audiences: [vault]}
    azurekv:                        # Azure Key Vault, workload identity of each namespace's reader
      authType: WorkloadIdentity
      vaultUrl: https://example-vault.vault.azure.net
      serviceAccountRef: {name: app-secrets-reader}
      readerAnnotations:
        azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000
    aws:                            # AWS Secrets Manager, IRSA role of each namespace's reader
      service: SecretsManager
      region: eu-north-1
      auth:
        jwt:
          serviceAccountRef: {name: app-secrets-reader}
      readerAnnotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/app-secrets-{namespace}

# Lint checks over the generated (or hand-edited) manifests and Dockerfiles.
# severity: error fails the gate, warning and info are reported only.
# A pod template annotation `containerizer.io/waives: "id,id"` relaxes checks;
# the generator only writes it for exceptions that declare `waives`.
lint:
  checks:
    host-namespaces:     {severity: error,   title: No hostNetwork, hostPID or hostIPC}
    privileged:          {severity: error,   title: No privileged containers}
    capabilities:        {severity: error,   title: Drop ALL capabilities; add at most NET_BIND_SERVICE}
    volume-types:        {severity: error,   title: No hostPath or other non-restricted volume types}
    host-ports:          {severity: error,   title: No hostPort}
    privilege-escalation: {severity: error,  title: allowPrivilegeEscalation is false}
    run-as-non-root:     {severity: error,   title: Runs as a non-root user}
    seccomp:             {severity: error,   title: Seccomp profile RuntimeDefault or Localhost}
    sysctls:             {severity: error,   title: Only safe sysctls}
    readonly-rootfs:     {severity: error,   title: Read-only root filesystem}
    resources:           {severity: error,   title: CPU/memory requests and a memory limit}
    secret-literals:     {severity: error,   title: No secret values in manifests or images}
    sa-token:            {severity: warning, title: Service account token not mounted}
    empty-dir-limit:     {severity: warning, title: emptyDir volumes have a sizeLimit}
    image-tag:           {severity: warning, title: Workload image has an explicit, non-latest tag or digest}
    image-digest:        {severity: info,    title: Workload image is pinned to a digest}
    network-policy:      {severity: warning, title: Every workload is selected by a NetworkPolicy}
    egress-policy:       {severity: warning, title: Egress is restricted by a NetworkPolicy}
    service-account:     {severity: warning, title: Workload uses its own ServiceAccount, not default}
    apparmor:            {severity: info,    title: AppArmor profile set}
    plain-secret:        {severity: error,   title: No Secret objects in the manifests; ExternalSecrets only}
    secret-source:       {severity: error,   title: Every Secret a workload uses is produced by an ExternalSecret}
    external-secret-store: {severity: error, title: ExternalSecrets read a platform-defined (Cluster)SecretStore}
    df-user:             {severity: error,   title: Final image stage runs as a non-root user}
    df-base-tag:         {severity: error,   title: Base images have an explicit, non-latest tag}
    df-base-digest:      {severity: info,    title: Base images are pinned to a digest}
    df-remote-add:       {severity: error,   title: No ADD from URLs or curl|sh in the build}
    df-base-eol:         {severity: warning, title: Base image line is supported by its vendor}
  allowed_capabilities: [NET_BIND_SERVICE]
  safe_sysctls:
    - kernel.shm_rmid_forced
    - net.ipv4.ip_local_port_range
    - net.ipv4.ip_unprivileged_port_start
    - net.ipv4.tcp_syncookies
    - net.ipv4.ping_group_range
    - net.ipv4.ip_local_reserved_ports
    - net.ipv4.tcp_keepalive_time
    - net.ipv4.tcp_fin_timeout
    - net.ipv4.tcp_keepalive_intvl
    - net.ipv4.tcp_keepalive_probes
  allowed_volume_types: [configMap, csi, downwardAPI, emptyDir, ephemeral, persistentVolumeClaim, projected, secret]
  # names that must never carry a literal value (env, ENV, Secret stringData)
  secret_names: '(?i)(password|passwd|pwd|secret|token|api[_-]?key|private[_-]?key|connectionstrings?__)'
  # final-stage base images that already run as non-root without a USER line
  nonroot_bases: ['nginx-unprivileged', 'distroless/.*:nonroot', 'chiseled']

# Image vulnerability gate.
scan:
  fail_on: CRITICAL           # lowest severity that fails the gate (UNKNOWN LOW MEDIUM HIGH CRITICAL)
  ignore_unfixed: true        # only vulnerabilities with a fixed version count against the gate
  # `all` scans with every available scanner and merges the findings (their
  # databases differ, so the union misses less); `auto` uses the first one.
  default_scanner: all
  scanners:                   # in order of preference
    - name: trivy
      binary: trivy
      image: aquasec/trivy:0.67.2
    - name: grype
      binary: grype
      image: anchore/grype:v0.86.1
  # When even the newest base tag still ships an OS package with a blocking,
  # fixable vulnerability, `gate` upgrades just those packages in the final
  # stage (images with a package manager only; chiseled/distroless images
  # have none and need a newer tag). `gate --build` re-scans to confirm.
  os_patch:
    enabled: true
    commands:
      alpine: 'apk upgrade --no-cache {packages}'
      ubuntu: 'apt-get update && apt-get install -y --no-install-recommends --only-upgrade {packages} && rm -rf /var/lib/apt/lists/*'
      debian: 'apt-get update && apt-get install -y --no-install-recommends --only-upgrade {packages} && rm -rf /var/lib/apt/lists/*'
    no_package_manager: 'chiseled|distroless|scratch'
  # Accepted risks. An entry stops counting at `expires` (YYYY-MM-DD) and is
  # then reported as expired. `images` (regex) limits it to some images.
  allowlist: []
  #  - id: CVE-2024-12345
  #    reason: not reachable, the vulnerable parser is never used
  #    expires: 2026-12-31
  #    images: 'dotnet/aspnet'

# Software bill of materials for every image the gate builds (`gate --build`,
# `containerizer org`): CycloneDX JSON from Syft, written as sbom.cdx.json next
# to the component's Dockerfile, stored in the results database and, after a
# push, attached to the image (signed with cosign when a key is configured).
sbom:
  enabled: true
  # assess/analyze with --sql also store a source SBOM per component: the
  # packages its project files declare (direct references, no CVEs).
  source: true
  generator: {name: syft, binary: syft, image: anchore/syft:v1.33.0}
  # Syft does not read NuGet licences: look them up in the package's nuspec on
  # this feed (NuGet v3 service index; answers are cached under .work/). Turn
  # off where the runner has no access to the feed.
  nuget_licenses: true
  nuget_feed: https://api.nuget.org/v3/index.json
  attach: true                # without a cosign key: OCI referrer artifact (oras attach)
  # With `org --cosign-key` the SBOM is a signed attestation (cosign attest
  # --type cyclonedx). cosign records it in the public Rekor transparency log
  # by default; set false for private registries that must not show up there
  # (verify with `cosign verify-attestation --insecure-ignore-tlog`).
  cosign_tlog_upload: true
  # OS packages of the base image (deb, apk, rpm): Debian copyright files name
  # the licence of every file a package ships, so glibc reads "GPL AND LGPL".
  # `report` shows them without counting them; `evaluate` applies the policy.
  os_packages: report
  licenses:
    # Regular expressions matched against each SPDX identifier (whole id, case-
    # insensitive). An expression is judged as written: `A OR B` passes when
    # either side passes, `A AND B` needs both. `deny` fails the gate (and keeps
    # the component out of an organization run); `warn` is reported.
    deny: []
    warn:
      - 'AGPL(-.*)?'            # network copyleft: users of the service get the source
      - 'GPL(-.*)?'             # strong copyleft (LGPL is not matched)
      - 'SSPL(-.*)?'
      - 'CC-BY-NC(-.*)?'        # non-commercial
      - 'BUSL(-.*)?|Elastic-2\.0|Commons-Clause'
    # Allowed explicitly: names that are not SPDX identifiers. Any SPDX licence
    # (rules/spdx-licenses.yaml) that deny/warn do not match is allowed anyway.
    allow:
      - 'LicenseRef-public-domain'
      - 'LicenseRef-Microsoft-NET-Library'   # older System.*/Microsoft.* NuGet packages: redistributable with the app
    unknown: report           # packages without a recognised licence: report | warn | deny
    # Accepted exceptions: package (regex), optional version (regex), reason,
    # optional expires (YYYY-MM-DD).
    accepted: []
    #  - package: 'Ghostscript\.NET'
    #    reason: separate commercial licence, contract 2026-114
    #    expires: 2027-06-30

# Base image lifecycle and bump policy for `containerizer images`.
images:
  lock_max_age_days: 14       # the gate warns when images.lock.yaml is older
  # How far `images --update` may move a line on its own:
  #   patch: newest patch tag of the same line (8.0 -> 8.0.33)
  #   minor: newest line with the same major (1.27 -> 1.30), optionally filtered
  #   on_eol: next  once a line is past end of support, move to the `next`
  #                 line from `lifecycle` (build toolchains, where it is safe)
  # .NET lines are not moved automatically: a new .NET major changes the
  # runtime the application runs on and is a planned migration.
  bump:
    - match: 'nginx-unprivileged'
      policy: minor
      line_filter: '^1\.\d*[02468]$'      # stable (even) nginx lines only
    - match: '(^|/)(node|golang):'
      policy: patch
      on_eol: next
    - match: '.*'
      policy: patch
  # End of vendor support per image line (vendor lifecycle pages; review
  # these when new versions ship). `next` is the line to move to.
  lifecycle:
    - {match: 'dotnet/(sdk|aspnet|runtime):6\.0',  eol: 2024-11-12, next: '10.0'}
    - {match: 'dotnet/(sdk|aspnet|runtime):7\.0',  eol: 2024-05-14, next: '10.0'}
    - {match: 'dotnet/(sdk|aspnet|runtime):8\.0',  eol: 2026-11-10, next: '10.0'}
    - {match: 'dotnet/(sdk|aspnet|runtime):9\.0',  eol: 2026-11-10, next: '10.0'}
    - {match: 'dotnet/(sdk|aspnet|runtime):10\.0', eol: 2028-11-14}
    - {match: '(^|/)node:18\b', eol: 2025-04-30, next: '22'}
    - {match: '(^|/)node:20\b', eol: 2026-04-30, next: '22'}
    - {match: '(^|/)node:22\b', eol: 2027-04-30, next: '24'}
    - {match: '(^|/)node:24\b', eol: 2028-04-30}
    - {match: 'nginx(-unprivileged)?:1\.2[0-7]\b', eol: 2025-04-23, next: '1.30'}
    - {match: 'nginx(-unprivileged)?:1\.(28|29)\b', eol: 2026-04-14, next: '1.30'}
    - {match: '(^|/)python:3\.9\b',  eol: 2025-10-31, next: '3.12'}
    - {match: '(^|/)python:3\.10\b', eol: 2026-10-31, next: '3.12'}
    - {match: '(^|/)python:3\.11\b', eol: 2027-10-31}
    - {match: '(^|/)python:3\.12\b', eol: 2028-10-31}
    - {match: '(^|/)golang:1\.2[0-3]\b', eol: 2025-08-12, next: '1.26'}
    - {match: '(^|/)golang:1\.24\b', eol: 2026-02-11, next: '1.26'}
    - {match: '(^|/)golang:1\.25\b', eol: 2026-08-12, next: '1.26'}
    - {match: 'eclipse-temurin:21\b', eol: 2029-12-31}
  warn_days_before_eol: 60

# Controls reported in HARDENING.md. Sources:
#   NSA/CISA Kubernetes Hardening Guide v1.2 (August 2022), by section name
#   CIS Kubernetes Benchmark, section 5 (policies) and the operator sections it cites
# scope: workload (proved by lint checks on the generated manifests),
#        namespace (generated namespace-level objects), gitops, pipeline,
#        cluster (needs action by the cluster operator; cluster/ has a starter kit)
# checks: lint checks that must pass. exception: when one of these hardening
# exceptions is in use, the control is "applied with exception".
controls:
  - {id: non-root, nsa: 'Pod security > Non-root containers and "rootless" container engines', cis: '5.2.7', scope: workload,
     checks: [run-as-non-root, df-user], title: Containers run as a non-root user}
  - {id: immutable-fs, nsa: 'Pod security > Immutable container file systems', cis: '5.7.3', scope: workload,
     checks: [readonly-rootfs, empty-dir-limit], title: 'Read-only root file system; writable paths are size-limited emptyDirs'}
  - {id: secure-images, nsa: 'Pod security > Building secure container images', scope: pipeline,
     checks: [df-base-tag, df-remote-add, df-base-eol], gate: true,
     title: 'Minimal, patched base images; images scanned for vulnerabilities (containerizer gate)'}
  - {id: image-signing, nsa: 'Pod security > Building secure container images', cis: '5.5.1', scope: cluster,
     title: Only signed images run,
     action: 'Sign each pushed image (cosign sign --yes <registry>/<image>@<digest>) and enforce it with cluster/verify-images.yaml (Kyverno) or your admission controller.'}
  - {id: digest-pinning, nsa: 'Pod security > Building secure container images', scope: pipeline, checks: [image-digest],
     title: Images are deployed by digest,
     action: 'In the deploy pipeline: kustomize edit set image <image>=<registry>/<image>@sha256:<digest>; base images: generate --pin-digests.'}
  - {id: pod-security, nsa: 'Pod security > Pod security enforcement', cis: '5.2.1-5.2.13', scope: namespace,
     checks: [host-namespaces, privileged, capabilities, volume-types, host-ports, privilege-escalation, sysctls, seccomp],
     title: 'Pod Security Admission "restricted" enforced on the namespace; workloads comply'}
  - {id: sa-tokens, nsa: 'Pod security > Protecting Pod service account tokens', cis: '5.1.5, 5.1.6', scope: workload,
     checks: [sa-token, service-account], exception: [kubernetes-api-client],
     title: 'Own ServiceAccount per component; no token mounted'}
  - {id: container-env, nsa: 'Pod security > Hardening container environments', cis: '5.7.2', scope: workload,
     checks: [seccomp, apparmor], title: 'Seccomp and AppArmor RuntimeDefault; all capabilities dropped',
     action: 'AppArmor needs AppArmor-enabled nodes; on SELinux nodes set hardening.apparmor: none. Consider a sandboxed runtime class (gVisor, Kata) for untrusted workloads.'}
  - {id: namespaces, nsa: 'Network separation and hardening > Namespaces', cis: '5.7.1, 5.7.4', scope: namespace,
     title: 'One namespace per application; nothing in default'}
  - {id: network-policies, nsa: 'Network separation and hardening > Network policies', cis: '5.3.2', scope: namespace,
     checks: [network-policy, egress-policy],
     title: 'Default-deny ingress and egress; only DNS, sibling components and inferred dependencies allowed',
     action: 'Needs a CNI that enforces NetworkPolicy (CIS 5.3.1): Calico, Cilium, Antrea, ... Review the inferred egress ports below.'}
  - {id: resource-policies, nsa: 'Network separation and hardening > Resource policies', scope: namespace, checks: [resources],
     title: 'Requests and limits on every container; LimitRange and ResourceQuota on the namespace'}
  - {id: control-plane, nsa: 'Network separation and hardening > Control plane hardening, Etcd, Kubeconfig files', cis: '1.x, 2.x, 4.x', scope: cluster,
     title: 'Control plane, etcd, kubelet and kubeconfig hardening',
     action: 'Cluster operator: API server not public, TLS everywhere, anonymous auth off, etcd encrypted and reachable only from the API server, kubeconfigs protected. Check CIS 1-4 with kube-bench.'}
  - {id: node-segmentation, nsa: 'Network separation and hardening > Worker node segmentation', scope: cluster,
     title: Worker nodes segmented from the rest of the network,
     action: 'Cluster operator: nodes in their own subnet; firewall the kubelet (10250) and the NodePort range.'}
  - {id: encryption, nsa: 'Network separation and hardening > Encryption', scope: cluster,
     title: Traffic encrypted in transit,
     action: 'Terminate TLS at the ingress; use a service mesh (mTLS) or TLS to databases (Encrypt=True in SQL Server connection strings).'}
  - {id: secrets, nsa: 'Network separation and hardening > Secrets', cis: '5.4.2', scope: namespace,
     checks: [plain-secret, secret-literals, secret-source, external-secret-store],
     title: 'Secret values come from an external store through External Secrets Operator, never from Git or images',
     action: 'Enable encryption at rest for Secrets (EncryptionConfiguration with a KMS provider).'}
  - {id: secret-store-access, nsa: 'Network separation and hardening > Secrets; Authentication and authorization', cis: '5.1.2',
     scope: cluster, title: 'Each namespace reads only its own keys from the secret store',
     action: 'Cluster operator: install External Secrets Operator and apply cluster/secret-store.yaml (the store; with the kubernetes provider also this namespace''s Role over exactly its remote keys). For Vault, Azure Key Vault or AWS Secrets Manager bind the namespace''s ServiceAccount app-secrets-reader to an identity that can read only <namespace>--* (docs/external-secrets.md).'}
  - {id: secrets-as-files, nsa: 'Network separation and hardening > Secrets', cis: '5.4.1', scope: deviation,
     title: Secrets mounted as files rather than environment variables,
     action: 'Not applied: the applications read their settings from configuration/environment variables, and reading them from files needs a code change (e.g. AddKeyPerFile). Keys and certificates are already mounted as files under /secrets.'}
  - {id: cloud-metadata, nsa: 'Network separation and hardening > Protecting sensitive cloud infrastructure', scope: namespace, checks: [egress-policy],
     title: Cloud instance metadata endpoints are not reachable from application pods}
  - {id: authn, nsa: 'Authentication and authorization', cis: '3.1, 5.1.1-5.1.4', scope: cluster,
     title: Strong user authentication and least-privilege RBAC for people,
     action: 'Cluster operator: OIDC for users, no static tokens or client certificates for people, cluster-admin only for break-glass.'}
  - {id: rbac-apps, nsa: 'Authentication and authorization', cis: '5.1.3, 5.1.5', scope: workload, checks: [service-account],
     exception: [kubernetes-api-client], title: Applications get no RBAC permissions}
  - {id: audit-logging, nsa: 'Audit logging and threat detection > Kubernetes native audit logging configuration', cis: '3.2.1, 3.2.2', scope: cluster,
     title: API server audit logging,
     action: 'Cluster operator: enable audit logging with cluster/audit-policy.yaml (metadata for everything, request bodies for RBAC changes, never Secret payloads) and ship it to a SIEM.'}
  - {id: container-logging, nsa: 'Audit logging and threat detection > Worker node and container logging', scope: workload,
     title: 'Applications log to stdout for central collection (file-only log sinks are re-pointed to the console)'}
  - {id: threat-detection, nsa: 'Audit logging and threat detection > Threat detection, Alerting', scope: cluster,
     title: Runtime threat detection and alerting,
     action: 'Cluster operator: run a runtime detector (Falco, Tetragon) and alert on shells in containers, writes to read-only paths and denied egress.'}
  - {id: upgrades, nsa: 'Upgrading and application security practices', scope: pipeline, gate: true,
     title: 'Base images kept patched and supported (images --update, weekly bump workflow, end-of-support warnings)',
     action: 'Keep Kubernetes itself on a supported version; re-run containerizer gate for every release.'}
  - {id: gitops, nsa: 'Authentication and authorization; Upgrading and application security practices', scope: gitops,
     title: 'GitOps delivery is least privilege: Argo CD AppProject limited to the app namespace and generated kinds; Flux reconciles as a namespace-scoped ServiceAccount, decrypts with SOPS and verifies OCI artifacts with cosign'}
