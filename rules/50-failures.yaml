# Failure rules for the build-and-run verification loop. `match` is a regex
# applied to the build or run log; named groups are available to `fix` as
# {name}. `outcome` decides what the failure means:
#   retry     - apply `fix` (a build-plan patch) and try again
#   external  - the container works; it only misses an external service (DB, broker, AD...)
#   platform  - the app hit a Windows-only API at runtime -> finding
#   code      - needs a code change -> finding
# `learn` makes the fix permanent as a plan rule when the retry succeeds.
#   environment - (stage cluster) the sandbox cluster's setup, not the app: reported, never learned
# Stage `cluster` rules are matched by the sandbox verification (containerizer/sandbox.py) against pod
# states and Warning events of the deployed workloads; the app's log there is matched with the `run`
# rules. Code/platform outcomes found in the cluster become learned findings with their evidence.
failures:
  - id: build-no-space
    stage: build
    match: 'no space left on device'
    outcome: retry
    refs: [https://docs.docker.com/build/cache/garbage-collection/]
    diagnosis: The Docker disk is full on the verification host (not a problem of the application).
    fix: {prune_cache: true}

  - id: build-global-json
    stage: build
    match: 'A compatible \.NET SDK was not found|global\.json file.*(requested|specifies)|Requested SDK version: (?P<ver>[\d.]+)'
    outcome: retry
    refs: [https://learn.microsoft.com/en-us/dotnet/core/tools/global-json]
    diagnosis: global.json pins an SDK version that is not in the build image.
    fix: {remove_files: [global.json]}
    learn: {scope: repo, when: {file: global.json}}

  - id: build-eol-targeting
    stage: build
    match: 'NETSDK1045|NETSDK1209|NETSDK1061|does not support targeting \.NET (Core )?(?P<ver>[\d.]+)|error NU1102: Unable to find package Microsoft\.(NETCore|AspNetCore)\.App\.(Ref|Runtime)'
    outcome: retry
    refs: [https://learn.microsoft.com/en-us/dotnet/core/versions/selection, https://learn.microsoft.com/en-us/dotnet/standard/frameworks]
    diagnosis: The project targets an old .NET version the build image cannot target.
    fix: {strategy: retarget}
    learn: {when: {tfm: '{tfm}'}}

  - id: build-windows-targeting
    stage: build
    match: 'NETSDK1100|EnableWindowsTargeting'
    outcome: retry
    refs: [https://learn.microsoft.com/en-us/dotnet/core/project-sdk/msbuild-props]
    diagnosis: The project (or a dependency) targets a -windows TFM; building it on Linux needs EnableWindowsTargeting.
    fix: {publish_args: ["-p:EnableWindowsTargeting=true"]}
    learn: {when: {tfm: 'net\d+\.\d+-windows.*'}}

  - id: build-rid-downgrade
    stage: build
    # the dependency chain names the direct package that drags in the netstandard1.x graph:
    #   error NU1605:  App -> Lib -> SSH.NET 2016.1.0 -> System.Net.Sockets 4.1.0 -> runtime.unix...
    match: 'error NU1605:(?:(?=[\s\S]*?error NU1605:\s+\S+(?:\s->\s[\w.]+)*?\s->\s(?P<pkg>[\w.]+)\s(?P<ver>\d[\w.\-]*)\s->)|)'
    outcome: retry
    refs: [https://learn.microsoft.com/en-us/nuget/reference/errors-and-warnings/nu1605, https://learn.microsoft.com/en-us/dotnet/core/rid-catalog]
    diagnosis: >-
      Restoring for linux-x64 pulls RID-specific packages of an old netstandard1.x dependency that
      conflict (package downgrade). A portable publish restores the same graph as the Windows build.
    fix: {rid: portable}
    learn: {when: {closure: {package: '{pkg}', version: '{ver}'}}}

  - id: build-npm-missing
    stage: build
    match: '(npm|node): (command )?not found|Node\.js is required to build and run this project'
    outcome: retry
    diagnosis: The project builds a front end with npm during publish.
    fix: {spa_root: ClientApp}
    learn: {when: {file: 'ClientApp/package.json'}}

  - id: build-netfx-reference
    stage: build
    match: 'NETSDK1136|reference assemblies for \.NETFramework|The type or namespace name .System\.Web|MSB3644'
    outcome: code
    refs: [https://learn.microsoft.com/en-us/dotnet/core/porting/]
    diagnosis: The component (or a project it references) needs .NET Framework.
    finding: {severity: rewrite, title: Depends on .NET Framework assemblies at build time,
      fix: 'Port the component and the projects it references to modern .NET (SDK-style project, ASP.NET Core instead of System.Web), or keep it on a Windows container.'}

  - id: build-missing-windows-only-package
    stage: build
    match: "error CS0234: The type or namespace name '(?P<ns>\\w+)' does not exist in the namespace '(?P<parent>Windows|System\\.Windows)"
    outcome: platform
    refs: [https://learn.microsoft.com/en-us/dotnet/standard/frameworks]
    diagnosis: Code uses a Windows-only namespace that the Linux build cannot resolve.
    finding: {severity: blocker, title: 'Windows-only namespace {parent}.{ns}',
      fix: 'Move the code that needs {parent}.{ns} behind an interface with a Linux implementation, or split it into a separate Windows component.'}

  # ---- Java and Node.js builds
  - id: build-java-release-too-new
    stage: build
    # javac: "release version 21 not supported" / "invalid target release: 21"; a dependency built for a
    # newer line: "class file has wrong version 61.0, should be 55.0" (class file 61 = Java 17)
    match: 'release version (?P<ver>\d+) not supported|invalid target release: (?:1\.)?(?P<ver2>\d+)|class file has wrong version (?P<ver3>\d+)\.0, should be'
    outcome: retry
    refs: [https://docs.oracle.com/en/java/javase/21/docs/specs/man/javac.html, https://docs.oracle.com/javase/specs/jvms/se21/html/jvms-4.html]
    diagnosis: The code or a dependency needs a newer Java line than the build used ({ver}); the build and runtime move to it.
    fix: {java: '{ver}'}
    learn: {when: {}}

  - id: build-maven-version-enforced
    stage: build
    match: 'RequireMavenVersion failed|Detected Maven Version: [\d.]+ is not in the allowed range'
    outcome: retry
    refs: [https://maven.apache.org/enforcer/enforcer-rules/requireMavenVersion.html, https://maven.apache.org/wrapper/]
    diagnosis: The build requires another Maven version than the build image has; the repository's Maven wrapper is used.
    fix: {maven_wrapper: true}
    learn: {when: {}}

  - id: build-npm-lock-out-of-sync
    stage: build
    match: '`npm ci` can only install packages when your package\.json and package-lock\.json[^\n]*are in sync|ERR_PNPM_OUTDATED_LOCKFILE|ERR_PNPM_LOCKFILE_CONFIG_MISMATCH|YN0028: [^\n]*lockfile would have been modified|Your lockfile needs to be updated, but yarn was run with `--frozen-lockfile`'
    outcome: retry
    refs: [https://docs.npmjs.com/cli/commands/npm-ci, https://pnpm.io/cli/install#--frozen-lockfile]
    diagnosis: >-
      The lockfile does not match package.json, so a reproducible install from it fails; the
      dependencies are resolved again at build time. Update and commit the lockfile.
    fix: {lockfile: false}
    learn: {when: {}}

  - id: build-node-gyp-toolchain
    stage: build
    match: 'gyp ERR! (find Python|stack Error: not found: (make|g\+\+))|node-gyp[^\n]*(not found|ENOENT)|No (Python|C\+\+ compiler) found'
    outcome: retry
    refs: [https://github.com/nodejs/node-gyp#on-unix]
    diagnosis: A dependency compiles a native addon at install time; the build stage gets Python, make and a C++ compiler.
    fix: {native_build: true}
    learn: {when: {}}

  - id: build-node-heap
    stage: build
    match: 'JavaScript heap out of memory|Reached heap limit Allocation failed'
    outcome: retry
    refs: [https://nodejs.org/api/cli.html#--max-old-space-sizesize-in-mib]
    diagnosis: The front-end or TypeScript build runs out of the default V8 heap; the build gets a larger heap.
    fix: {build_env: {NODE_OPTIONS: --max-old-space-size=4096}}
    learn: {when: {}}

  - id: build-node-engine-unsupported
    stage: build
    match: 'The engine "node" is incompatible with this module\. Expected version "(?P<range>[^"]+)"|ERR_PNPM_UNSUPPORTED_ENGINE[^\n]*\n[^\n]*wanted: (?P<range2>[^\n]+)|EBADENGINE[^\n]*\n[^\n]*required: \{[^}]*node: .(?P<range3>[^\x27"]+)'
    outcome: code
    refs: [https://nodejs.org/en/about/previous-releases, https://docs.npmjs.com/cli/configuring-npm/package-json#engines]
    diagnosis: A package requires a Node.js version ({range}) outside the supported LTS lines the image uses.
    finding: {severity: refactor, title: Requires an unsupported Node.js version,
      fix: 'Upgrade the dependency (or the engines range) to a version that supports a current Node.js LTS line.'}

  # ------------------------------------------------------------------ run
  - id: run-aspnet-framework-missing
    stage: run
    match: "framework=Microsoft\\.AspNetCore\\.App|Microsoft\\.AspNetCore\\.App', version"
    outcome: retry
    refs: [https://learn.microsoft.com/en-us/dotnet/core/docker/container-images]
    diagnosis: The worker uses the ASP.NET Core shared framework; it needs the aspnet base image.
    fix: {aspnet_runtime: true}
    learn: {}

  - id: run-readonly-path
    stage: run
    match: "(Access to the path '(?P<path>/[^']+)' is denied|Read-only file system : '(?P<path2>/[^']+)'|UnauthorizedAccessException: Access to the path '(?P<path3>/[^']+)')"
    outcome: retry
    refs: [https://kubernetes.io/docs/tasks/configure-pod-container/security-context/]
    diagnosis: The app writes to a folder that is read-only in the hardened container.
    fix: {add_writable: ['{dir}']}
    learn: {when: {}}

  - id: run-missing-dir
    stage: run
    match: "DirectoryNotFoundException: Could not find a part of the path '(?P<path>/[^']+)'"
    outcome: retry
    refs: [https://kubernetes.io/docs/concepts/storage/persistent-volumes/]
    diagnosis: The app expects a folder that does not exist in the image.
    fix: {add_writable: ['{dir}']}
    learn: {when: {}}

  - id: run-native-krb5
    stage: run
    match: "libgssapi_krb5\\.so|GSSAPI|gss_\\w+ failed|Cannot load library libgssapi"
    outcome: retry
    refs: [https://learn.microsoft.com/en-us/aspnet/core/security/authentication/windowsauth]
    diagnosis: Kerberos (Negotiate) needs the GSSAPI libraries in the image.
    fix: {add_packages: [libkrb5-3, libgssapi-krb5-2, gss-ntlmssp]}
    learn: {when: {code: 'Negotiate'}}

  - id: run-windows-system-dll
    stage: run
    match: "(DllNotFoundException|Unable to load shared library|Unable to load DLL) '?(?P<lib>(httpapi|advapi32|kernel32|user32|netapi32|secur32|crypt32|ole32|activeds|wtsapi32)(\\.dll)?)'?"
    outcome: platform
    refs: [https://learn.microsoft.com/en-us/aspnet/core/fundamentals/servers/httpsys, https://learn.microsoft.com/en-us/dotnet/standard/native-interop/native-library-loading]
    diagnosis: >-
      The app calls a Windows system library ({lib}) that has a cross-platform .NET replacement
      (HTTP.sys -> Kestrel, Win32 security/registry -> managed APIs).
    finding: {severity: refactor, title: 'Windows system library {lib} called at runtime',
      fix: 'Replace the Windows-specific call with its cross-platform .NET API (HTTP.sys hosting -> Kestrel, P/Invoke to {lib} -> managed equivalent), or guard it with OperatingSystem.IsWindows().'}

  - id: run-native-missing
    stage: run
    match: "(DllNotFoundException|Unable to load shared library|Unable to load DLL) '?(?P<lib>[\\w.\\-]+)'?"
    outcome: platform
    refs: [https://learn.microsoft.com/en-us/dotnet/standard/native-interop/native-library-loading]
    diagnosis: The app loads a native library ({lib}) that is not available in the Linux image.
    finding: {severity: blocker, title: 'Native library {lib} not available on Linux',
      fix: 'Install a Linux build of {lib} in the image (a NuGet runtime package or apt package), or replace the library with a managed or cross-platform one.'}

  - id: run-platform-not-supported
    stage: run
    match: "PlatformNotSupportedException: (?P<msg>[^\\n]{0,200})"
    outcome: platform
    refs: [https://learn.microsoft.com/en-us/dotnet/standard/analyzers/platform-compat-analyzer]
    diagnosis: 'A Windows-only API was called at runtime: {msg}'
    finding: {severity: refactor, title: 'Windows-only API at runtime: {msg}',
      fix: 'Find the call in the log''s stack trace; replace it with a cross-platform API or guard it with OperatingSystem.IsWindows(). The platform compatibility analyzer (CA1416) lists such calls at build time.'}

  - id: run-https-no-cert
    stage: run
    match: "Unable to configure HTTPS endpoint|No server certificate was specified|The default developer certificate"
    outcome: retry
    refs: [https://learn.microsoft.com/en-us/aspnet/core/security/docker-https, https://learn.microsoft.com/en-us/aspnet/core/fundamentals/servers/kestrel/endpoints]
    diagnosis: An HTTPS endpoint is configured without a certificate; TLS terminates at the ingress instead.
    fix: {env: {ASPNETCORE_URLS: "http://+:8080", Kestrel__Endpoints__Https__Url: "http://+:8081"}}
    learn: {when: {config: '"Https"\s*:|https://'}}

  - id: run-kestrel-http-with-certificate
    stage: run
    match: 'The non-HTTPS endpoint (?P<ep>\w+) includes HTTPS-only configuration'
    outcome: code
    diagnosis: >-
      The Kestrel endpoint {ep} was switched to plain HTTP (TLS ends at the ingress), but the
      configuration still gives it a certificate, which Kestrel rejects.
    refs: [https://learn.microsoft.com/en-us/aspnet/core/fundamentals/servers/kestrel/endpoints]
    finding:
      severity: config
      title: 'Kestrel endpoint {ep} has a certificate but runs as HTTP in the container'
      fix: >-
        Remove the Certificate settings of the {ep} endpoint from the configuration used in the container
        (TLS ends at the ingress), or keep HTTPS and mount the certificate from a Kubernetes Secret.

  - id: run-cert-store
    stage: run
    match: "certificate .*(not found|could not be found) in (the )?(store|LocalMachine)|X509Store.*(PlatformNotSupported|not supported)|LocalMachine X509Store is limited"
    outcome: code
    refs: [https://learn.microsoft.com/en-us/dotnet/standard/security/cross-platform-cryptography, https://kubernetes.io/docs/concepts/configuration/secret/]
    diagnosis: The app loads a certificate from the Windows certificate store.
    finding: {severity: config, title: Certificate must be mounted as a file,
      fix: 'Mount the certificate from a Kubernetes Secret and load it with X509Certificate2.CreateFromPemFile / new X509Certificate2(path, password) instead of the LocalMachine store.'}

  - id: run-global-mutex
    stage: run
    match: "IOException: .*: 'Global\\\\[^']+'|WaitHandleCannotBeOpenedException"
    outcome: platform
    refs: [https://learn.microsoft.com/en-us/dotnet/api/system.threading.mutex, https://kubernetes.io/docs/concepts/architecture/leases/]
    diagnosis: >-
      A machine-wide named mutex (Global\\...) guards against a second instance. Containers do not
      share it; run a single replica or use a Kubernetes Lease / database lock.
    finding: {severity: refactor, title: Machine-wide named mutex for single-instance,
      fix: 'Run a single replica (Deployment replicas 1, strategy Recreate), or replace the mutex with a distributed lock such as a Kubernetes Lease or a database lock.'}

  - id: run-eventlog
    stage: run
    match: "System\\.Diagnostics\\.EventLog|EventLog access is not supported on this platform"
    outcome: platform
    refs: [https://learn.microsoft.com/en-us/dotnet/core/extensions/logging/providers]
    diagnosis: Windows Event Log is not available on Linux.
    finding: {severity: refactor, title: Event Log used at runtime,
      fix: 'Log through ILogger to the console and let the cluster collect stdout; remove the EventLog provider or guard it with OperatingSystem.IsWindows().'}

  - id: run-sql-unreachable
    stage: run
    match: "SqlException|A network-related or instance-specific error|Login failed for user|Npgsql.*(Exception)|MySqlException"
    outcome: external
    diagnosis: Database server is not reachable from the test container (expected without the real environment).

  - id: run-dns-unreachable
    stage: run
    match: "Name or service not known|No such host is known|nodename nor servname|Resource temporarily unavailable \\(\\w+\\.(corp|local)|Connection refused|BrokerUnreachableException|RedisConnectionException|ElasticsearchClientException|MongoDB\\.Driver.*Timeout|SocketException"
    outcome: external
    diagnosis: An external service (broker, cache, API, directory) is not reachable from the test container.

  - id: run-broker-connect-timeout
    stage: run
    match: '(TaskCanceledException|OperationCanceledException|TimeoutException)[^\n]*\n\s*thrown at (EasyNetQ|RabbitMQ|MassTransit|Confluent\.Kafka|StackExchange\.Redis|Azure\.Messaging|NATS|NServiceBus|Rebus)'
    outcome: external
    diagnosis: A message broker or cache client timed out connecting (the service is not reachable from the test container).

  - id: run-sqlite-no-schema
    stage: run
    match: "SQLite Error 1: 'no such table"
    outcome: external
    refs: [https://learn.microsoft.com/en-us/ef/core/managing-schemas/migrations/applying]
    diagnosis: >-
      The app is up; its SQLite database has no schema yet (created by migrations or a deployment
      step in the real environment, not by the app at start-up).

  - id: run-connection-string-blank
    stage: run
    match: 'The connection string could not be parsed|Format of the initialization string does not conform|ConnectionString.*(is empty|cannot be empty)|SharedAccessKey.*(empty|null)'
    outcome: external
    diagnosis: >-
      A connection string is incomplete in the repository (its password or key is left blank for the
      deployment to fill in), so the client library rejects it in the test container.
    refs: [https://kubernetes.io/docs/concepts/configuration/secret/, https://learn.microsoft.com/en-us/aspnet/core/fundamentals/configuration/]

  - id: run-oidc-authority-unreachable
    stage: run
    match: "IDX20803|IDX20804|Unable to obtain configuration from|IDX10500"
    outcome: external
    refs: [https://learn.microsoft.com/en-us/aspnet/core/security/authentication/configure-oidc-web-authentication]
    diagnosis: The OpenID Connect authority (identity provider) is not reachable from the test container.

  - id: run-health-dependency-down
    stage: run
    match: "Health check \\S+ with status Unhealthy"
    outcome: external
    refs: [https://learn.microsoft.com/en-us/aspnet/core/host-and-deploy/health-checks]
    diagnosis: The app is up; its health check reports a dependency (database, broker) that is not reachable.

  - id: run-kerberos-config
    stage: run
    match: "Negotiate authentication requires|KRB5|krb5\\.conf"
    outcome: external
    diagnosis: Kerberos needs a keytab and krb5.conf from the real domain.

  - id: run-missing-config-value
    stage: run
    match: "(OptionsValidationException|ArgumentNullException: Value cannot be null.*(Parameter '(connectionString|path|uriString)')|InvalidOperationException: .*(not configured|is missing|must be configured|is required|not found in))"
    outcome: external
    refs: [https://learn.microsoft.com/en-us/aspnet/core/fundamentals/configuration/]
    diagnosis: A required setting has no value in the test container (environment-specific configuration).

  - id: run-sqlite-open
    stage: run
    match: "SQLite Error 14: 'unable to open database file'|SQLite Error 8: 'attempt to write a readonly database'"
    outcome: code
    refs: [https://learn.microsoft.com/en-us/dotnet/standard/data/sqlite/connection-strings, https://kubernetes.io/docs/concepts/storage/persistent-volumes/]
    diagnosis: The embedded SQLite database file is not in a writable, persistent folder.
    finding: {severity: config, title: SQLite database needs a persistent volume (single replica),
      fix: 'Put the database file on a PersistentVolume mounted writable (the generated manifests do this for the configured path) and run one replica, or move the data to a database server.'}

  # ---- Java and Node.js at run time
  - id: run-node-module-not-found
    stage: run
    match: "Error: Cannot find module '(?P<mod>[^'./][^']*)'"
    outcome: retry
    refs: [https://docs.npmjs.com/cli/commands/npm-prune]
    diagnosis: >-
      The app loads the package '{mod}' at run time but declares it as a devDependency, so pruning
      removed it; the image keeps devDependencies. Move the package to dependencies.
    fix: {prune: false}
    learn: {when: {}}

  - id: run-readonly-path-node-java
    stage: run
    match: "(EROFS: read-only file system|EACCES: permission denied), (open|mkdir|scandir|copyfile|rename) '(?P<path>/[^']+)'|java\\.nio\\.file\\.(ReadOnlyFileSystemException|AccessDeniedException): (?P<path2>/[^\\s:]+)|FileSystemException: (?P<path3>/[^\\s:]+): Read-only file system|FileNotFoundException: (?P<path4>/[^\\s(]+) \\((Read-only file system|Permission denied)\\)"
    outcome: retry
    refs: [https://kubernetes.io/docs/tasks/configure-pod-container/security-context/]
    diagnosis: The app writes to a folder that is read-only in the hardened container.
    fix: {add_writable: ['{dir}']}
    learn: {when: {}}

  - id: run-java-db-unreachable
    stage: run
    match: "Communications link failure|PSQLException|Failed to obtain JDBC Connection|Unable to acquire JDBC Connection|Failed to initialize pool|Failed to configure a DataSource|Unable to determine Dialect without JDBC metadata|MongoTimeoutException|RedisConnectionFailureException|AmqpConnectException|Unable to connect to Redis|Connection to [\\w.-]+:\\d+ refused|UnknownHostException"
    outcome: external
    refs: [https://docs.spring.io/spring-boot/reference/data/sql.html]
    diagnosis: A database or broker the app needs is not reachable from the test container (expected without the real environment).

  - id: run-java-config-missing
    stage: run
    match: "Could not resolve placeholder '(?P<key>[^']+)'|Could not locate PropertySource|ConfigClientFailFastException|I/O error on GET request for \"http://[\\w.-]+:8888"
    outcome: external
    refs: [https://docs.spring.io/spring-boot/reference/features/external-config.html]
    diagnosis: The app needs configuration it gets from the environment or a config server ({key}); supply it in the deployment.

  - id: run-node-service-unreachable
    stage: run
    match: "ECONNREFUSED|getaddrinfo (ENOTFOUND|EAI_AGAIN)|MongooseServerSelectionError|MongoServerSelectionError|SequelizeConnection\\w*Error|PrismaClientInitializationError|Can't reach database server|connect ETIMEDOUT|KnexTimeoutError|Redis connection to [\\w.:-]+ failed"
    outcome: external
    refs: [https://nodejs.org/api/errors.html#common-system-errors]
    diagnosis: A database or service the app needs is not reachable from the test container (expected without the real environment).

  - id: run-node-env-missing
    stage: run
    match: "Missing required environment variable|Invalid environment variables|environment variable [A-Z_]+ is (not set|required|missing)|(?P<var>[A-Z][A-Z0-9_]{2,}) (is not defined|is required|must be (set|defined|provided))"
    outcome: external
    refs: [https://12factor.net/config]
    diagnosis: The app needs configuration from environment variables ({var}); supply it in the deployment (Secrets for credentials).

  # ------------------------------------------------------------------ sandbox cluster (Kubernetes)
  - id: cluster-image-pull
    stage: cluster
    match: 'ErrImagePull|ImagePullBackOff|Failed to pull image|pull access denied|unauthorized: authentication required|manifest unknown'
    outcome: environment
    refs: [https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/]
    diagnosis: >-
      The cluster cannot pull the image: the pull secret named with --image-pull-secret is missing in the
      namespace, the nodes have no registry credentials, or the image was not pushed (--no-push-images).

  - id: cluster-image-not-signed
    stage: cluster
    match: 'image verification failed|failed to verify image|no matching signatures|verifyImages'
    outcome: environment
    refs: [https://kyverno.io/docs/writing-policies/verify-images/sigstore/]
    diagnosis: >-
      The admission policy only admits signed images and this image has no valid signature: run the
      organization scan with --cosign-key, or put the matching public key in cluster/verify-images.yaml.

  - id: cluster-config-missing
    stage: cluster
    match: 'CreateContainerConfigError|(secret|configmap) "(?P<name>[^"]+)" not found|couldn''t find key (?P<key>\S+) in (Secret|ConfigMap)'
    outcome: environment
    refs: [https://kubernetes.io/docs/concepts/configuration/secret/, https://external-secrets.io/latest/]
    diagnosis: >-
      A Secret or ConfigMap the pod needs does not exist in the namespace yet; create it, or let External
      Secrets create it from the ClusterSecretStore app-secrets (see HARDENING.md).

  - id: cluster-pod-security
    stage: cluster
    match: 'violates PodSecurity|forbidden: .*(PodSecurity|pod security)'
    outcome: environment
    refs: [https://kubernetes.io/docs/concepts/security/pod-security-standards/]
    diagnosis: >-
      Pod Security admission rejected the pods. The generated manifests target the "restricted" profile;
      a mutating webhook or a cluster default changed them, check the namespace labels and policies.

  - id: cluster-quota
    stage: cluster
    match: 'exceeded quota|forbidden: .*(LimitRange|must specify limits|maximum (cpu|memory) usage)'
    outcome: environment
    refs: [https://kubernetes.io/docs/concepts/policy/resource-quotas/]
    diagnosis: The namespace's ResourceQuota or LimitRange does not admit the pods' resource requests and limits.

  - id: cluster-unschedulable
    stage: cluster
    match: 'FailedScheduling|Unschedulable|Insufficient (cpu|memory)|didn''t match Pod''s node affinity|untolerated taint|unbound immediate PersistentVolumeClaims'
    outcome: environment
    refs: [https://kubernetes.io/docs/concepts/scheduling-eviction/kube-scheduler/]
    diagnosis: >-
      The pods cannot be scheduled: no node has the requested CPU/memory, a taint or affinity excludes the
      nodes, or a PersistentVolumeClaim has no storage class to bind to.

  - id: cluster-pod-sandbox
    stage: cluster
    match: 'FailedCreatePodSandBox|failed to create pod sandbox|failed to setup network for sandbox|FailedMount'
    outcome: environment
    refs: [https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/]
    diagnosis: >-
      The node could not start the pod (container runtime, network plugin or volume mount failed before
      the application ran); check the node and the events, the application was not started.

  - id: cluster-oom
    stage: cluster
    match: 'OOMKilled|exit 137\)'
    outcome: code
    refs: [https://kubernetes.io/docs/tasks/configure-pod-container/assign-memory-resource/]
    diagnosis: The container was killed for using more memory than its limit (512Mi in the generated manifests).
    finding: {severity: config, title: Needs a higher memory limit than generated,
      fix: 'Measure the working set under load and raise resources.limits.memory (and requests) in k8s.yaml; check for unbounded caches if it keeps growing.'}

  - id: cluster-readonly-filesystem
    stage: cluster
    match: "(Read-only file system|EROFS)[^\n]*?'(?P<path>/[^']+)'|Access to the path '(?P<path2>/[^']+)' is denied"
    outcome: retry
    refs: [https://kubernetes.io/docs/tasks/configure-pod-container/security-context/]
    diagnosis: The app writes to a folder that is read-only in the hardened pod.
    fix: {add_writable: ['{dir}']}
    learn: {when: {}}

