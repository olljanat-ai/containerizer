# Packages/assemblies whose Linux behaviour is known. Anything not listed here
# (and not matched by a finding rule) lowers the confidence of an assessment;
# the self-learning loop adds entries to rules/learned/packages.yaml.
linux_ok:
  - 'Microsoft\.Extensions\..*'
  - 'Microsoft\.AspNetCore\..*'
  - 'Microsoft\.EntityFrameworkCore(\..*)?'
  - 'Microsoft\.Data\.(SqlClient|Sqlite)'
  - 'System\.Data\.(SqlClient|Odbc)'
  - 'Microsoft\.NETFramework\.ReferenceAssemblies'
  - 'Microsoft\.NET\.Test\.Sdk|xunit.*|NUnit.*|MSTest\..*|coverlet\..*|FluentAssertions|Moq|NSubstitute|Shouldly|AutoFixture.*|Bogus'
  - 'Newtonsoft\.Json|System\.Text\.Json|CsvHelper|YamlDotNet|protobuf-net|Google\.Protobuf|MessagePack'
  - 'Serilog(\.(AspNetCore|Extensions\..*|Settings\..*|Sinks\.(Console|File|Seq|Async|Debug|Elasticsearch|Http)|Enrichers\..*|Formatting\..*))?'
  - 'NLog(\.Web\.AspNetCore|\.Extensions\..*)?|log4net|Common\.Logging.*'
  - 'Dapper(\..*)?|NHibernate|Iesi\.Collections|FluentNHibernate|EntityFramework|LinqKit|dbup-.*'
  - 'AutoMapper.*|MediatR.*|FluentValidation.*|Polly.*|Scrutor|Autofac.*|Unity(\..*)?|Ninject.*|SimpleInjector.*|Castle\..*|StructureMap.*|Lamar'
  - 'Swashbuckle\..*|NSwag\..*|Microsoft\.OpenApi.*'
  - 'RestSharp|Refit.*|Flurl.*|IdentityModel|System\.IdentityModel\.Tokens\.Jwt|Microsoft\.IdentityModel\..*|Microsoft\.Identity\.(Client|Web).*'
  - 'IdentityServer4.*|Duende\..*|OpenIddict.*'
  - 'StackExchange\.Redis|Microsoft\.Extensions\.Caching\..*|RedLock\.net'
  - 'MassTransit.*|RabbitMQ\.Client|EasyNetQ.*|NServiceBus(?!\.Host(\.|$)|\.Transports?\.Msmq|\.Msmq)(\..*)?|Confluent\.Kafka|Azure\..*|Microsoft\.Azure\..*|AWSSDK\..*|MQTTnet.*'
  - 'MongoDB\.Driver.*|NEST|Elasticsearch\.Net|Elastic\..*|Npgsql.*|MySqlConnector|MySql\.Data|Oracle\.ManagedDataAccess.*|LiteDB'
  - 'Hangfire.*|Quartz.*|FluentScheduler|Cronos|NCrontab'
  - 'SSH\.NET|FluentFTP|MailKit|MimeKit|SendGrid'
  - 'EPPlus|ClosedXML|NPOI|DocumentFormat\.OpenXml|iTextSharp\.LGPLv2\.Core|itext7.*|PdfSharpCore|MigraDocCore\..*|QuestPDF|PDFsharp.*|RazorLight|Handlebars\.Net|Scriban|DotLiquid'
  - 'SixLabors\..*|SkiaSharp.*|QRCoder|ZXing\.Net.*|DotNetZip|SharpZipLib|System\.IO\.Compression.*'
  - 'NetTopologySuite.*|ProjNet|Itinero.*|GeoJSON\.Net'
  - 'Lucene\.Net.*|RulesEngine|NRules|Stateless|Elsa.*'
  - 'Grpc\..*|CoreWCF\..*|System\.ServiceModel\.(Primitives|Http|NetTcp|Security|Duplex)'
  - 'Ocelot.*|Yarp\.ReverseProxy|AspNetCoreRateLimit|AspNetCore\.HealthChecks\..*|elmah\.corelibrary'
  - 'Microsoft\.CSharp|System\.Memory|System\.Buffers|System\.Collections\.Immutable|System\.Threading\..*|System\.Text\.Encoding\.CodePages|System\.Configuration\.ConfigurationManager|System\.Security\.Cryptography\.(Pkcs|Xml)'
  - 'Microsoft\.SourceLink\..*|StyleCop\..*|Microsoft\.CodeAnalysis\..*|Roslynator.*|SonarAnalyzer.*|Microsoft\.VisualStudio\.Threading.*|Nerdbank\..*|MinVer'
  - 'Microsoft\.SqlServer\.Types|Microsoft\.SqlServer\.Server|dotMorten\.Microsoft\.SqlServer\.Types'
  - 'CommandLineParser|System\.CommandLine.*|Spectre\.Console.*|McMaster\..*'
  - 'TimeZoneConverter|NodaTime.*|Humanizer.*'
  - 'Microsoft\.AspNet\.WebApi\.Client|Microsoft\.Net\.Http|System\.Net\.Http'
  - 'MSBuild\.Microsoft\.VisualStudio\.Web\.targets|Microsoft\.Web\.Infrastructure|WebGrease|Antlr|AjaxMin|Microsoft\.AspNet\.Web\.Optimization|WebActivator.*|Microsoft\.CodeDom\.Providers\.DotNetCompilerPlatform'
  - 'Microsoft\.Owin(\.Security(\..*)?|\.Host\.HttpListener|\.Hosting)?|Owin|Microsoft\.AspNet\.(Mvc|WebApi.*|WebPages|Razor|SignalR.*|Identity.*|FriendlyUrls.*|Cors)'
  - 'Microsoft\.SharePoint.*\.CSOM|Microsoft\.ReportingServices\..*'
  - 'Microsoft\.Extensions\.Hosting\.WindowsServices|Microsoft\.Extensions\.Logging\.EventLog|System\.Diagnostics\.EventLog|System\.ServiceProcess\.ServiceController'
  - 'Topshelf.*|System\.DirectoryServices.*|System\.Management|System\.IO\.Ports|System\.Security\.Cryptography\.ProtectedData|System\.Data\.OleDb|System\.Drawing\.Common'
  - 'Novell\.Directory\.Ldap.*|Sustainsys\.Saml2.*|Microsoft\.AspNetCore\.Authentication\..*'
  - 'EnterpriseLibrary\..*|DinkToPdf|Net\.IBM\.Data\.Db2.*'
  - 'Microsoft\.TypeScript\.MSBuild|Microsoft\.VisualStudio\.Azure\.Containers\.Tools\.Targets|Microsoft\.VisualStudio\.Web\.CodeGeneration\.Design'

# Framework assembly references (<Reference Include=...>) that are neutral on
# their own. Windows-only ones are covered by finding rules.
neutral_references:
  - 'System(\.(Core|Data|Data\.DataSetExtensions|Xml|Xml\.Linq|Runtime\.Serialization|ComponentModel\.DataAnnotations|Net\.Http|Configuration|Transactions|Runtime\.Caching|IO\.Compression(\.FileSystem)?|Numerics|Security|IdentityModel|ServiceModel(\.Web|\.Activation)?|ServiceProcess|Configuration\.Install|Web(\..*)?|Drawing|Data\.Linq|Messaging|Management|DirectoryServices(\..*)?|Workflow\..*|Activities(\..*)?|Runtime\.DurableInstancing|Runtime\.Remoting|Windows\.Forms|Deployment|EnterpriseServices|Xaml|Net))?'
  - 'Microsoft\.CSharp|Microsoft\.VisualBasic|mscorlib|WindowsBase|PresentationCore|PresentationFramework'
