# Runtime / framework rules.
# severity: info < config < refactor < rewrite < blocker
#   config   - runs in a Linux container with configuration/infra changes only
#   refactor - needs targeted code changes
#   rewrite  - needs a port of the component (e.g. .NET Framework -> modern .NET)
#   blocker  - cannot run in a Linux container; keep on Windows/VM or replace
# windows_container: whether a Windows Server container would be a workable
# stop-gap (null = unknown / not applicable).
rules:
  - id: netfx-target
    applies_to: [dotnet]
    when:
      all:
        - tfm: 'net[1-4]\d{1,2}|v[1-4].*'
        - not: {tfm: 'net([5-9]|\d\d)\.\d+.*|netcoreapp.*|netstandard.*'}
        - not: {role: 'test|library|sqlclr|sharepoint|biztalk'}
        - not: &aspnetcore_netfx
            all:
              - sdk: 'Microsoft\.NET\.Sdk\.Web'
              - package: 'Microsoft\.AspNetCore(\.(App|All|Mvc|Hosting|Server\.Kestrel))?'
              - not: {reference: 'System\.Web(\.Mvc|\.Http)?'}
              - not: {file: ["Global.asax", "*.aspx"]}
    severity: rewrite
    category: runtime
    effort: 8
    windows_container: true
    title: Targets .NET Framework
    why: >-
      .NET Framework only runs on Windows, so this component cannot run in a Linux container
      as it is. It must be ported to modern .NET (or kept in a Windows Server Core container on
      Windows nodes as a stop-gap).
    fix: >-
      Port to net10.0 (GitHub Copilot app modernization, which replaces the deprecated .NET
      Upgrade Assistant, can drive it; retarget shared libraries to netstandard2.0 or
      multi-target them with net10.0 first). Windows container stop-gap:
      mcr.microsoft.com/dotnet/framework/aspnet:4.8.1-windowsservercore-ltsc2022.
    refs:
      - https://learn.microsoft.com/en-us/dotnet/core/porting/
      - https://learn.microsoft.com/en-us/dotnet/standard/net-standard
      - https://hub.docker.com/r/microsoft/dotnet-framework-aspnet

  - id: aspnetcore-on-netfx
    applies_to: [dotnet]
    when:
      all:
        - tfm: 'net[1-4]\d{1,2}'
        - not: {tfm: 'net([5-9]|\d\d)\.\d+.*|netcoreapp.*|netstandard.*'}
        - not: {role: 'test|library|sqlclr|sharepoint|biztalk'}
        - *aspnetcore_netfx
    severity: refactor
    category: runtime
    effort: 3
    windows_container: true
    title: ASP.NET Core 2.x app on .NET Framework
    why: >-
      The app is already ASP.NET Core (Sdk.Web, Microsoft.AspNetCore.* packages) but targets .NET
      Framework, which ASP.NET Core 2.x allowed. It is not a framework port: retarget the TFM to
      net10.0 and replace the few .NET Framework-only packages/APIs it still uses.
    fix: Change TargetFramework to net10.0, drop Microsoft.AspNetCore 2.x packages for the shared framework, update EF Core and fix the compile errors.
    refs:
      - https://learn.microsoft.com/en-us/dotnet/core/porting/

  - id: netfx-library
    applies_to: [dotnet]
    when:
      all:
        - role: library
        - tfm: 'net[1-4]\d{1,2}'
        - not: {tfm: 'net([5-9]|\d\d)\.\d+.*|netstandard.*'}
    severity: refactor
    category: runtime
    effort: 2
    windows_container: true
    title: Shared library targets .NET Framework
    why: >-
      The library is compiled for .NET Framework only, so the components that use it cannot move
      to .NET 10 until it is retargeted. netstandard2.0 (or multi-targeting) lets the same library
      serve both the old and the ported apps during the migration.
    fix: Retarget to netstandard2.0 or multi-target net48;net10.0, then fix API gaps reported by the analyzers.
    refs:
      - https://learn.microsoft.com/en-us/dotnet/standard/net-standard

  - id: netfx-old
    applies_to: [dotnet]
    when:
      all:
        - tfm: 'net(20|35|40|45|451|452)|v2\.0|v3\.5|v4\.0|v4\.5.*'
        - not: {role: test}
    severity: rewrite
    category: runtime
    effort: 4
    windows_container: true
    title: Very old .NET Framework (2.0-4.5.2)
    why: >-
      .NET Framework 2.0 and 4.0-4.5.2 are out of support (3.5 SP1 is still supported on
      Windows, but is just as far from .NET 10). Libraries and APIs of that era (LINQ to SQL, WF3,
      Remoting, ASMX) often have no .NET 10 equivalent, so the port is larger than usual.
    fix: Upgrade in steps (4.8 first) before porting to .NET 10.
    refs:
      - https://learn.microsoft.com/en-us/lifecycle/products/microsoft-net-framework

  - id: core-eol
    applies_to: [dotnet]
    when:
      all:
        - tfm: 'netcoreapp(1|2|3)\.\d|net5\.0|net6\.0|net7\.0'
        - not: {role: 'test|library'}
    severity: config
    category: runtime
    effort: 0.5
    title: Out-of-support .NET runtime
    why: >-
      Targets an out-of-support .NET version. It can still be containerized without code
      changes by rolling forward onto the supported .NET 10 runtime (DOTNET_ROLL_FORWARD=Major)
      or by publishing with -p:TargetFramework=net10.0.
    fix: The generated Dockerfile builds with the .NET 10 SDK and runs on the .NET 10 runtime with roll-forward; retarget to net10.0 when convenient.
    refs:
      - https://dotnet.microsoft.com/en-us/platform/support/policy/dotnet-core
      - https://learn.microsoft.com/en-us/dotnet/core/versions/selection

  - id: core-windows-tfm
    applies_to: [dotnet]
    when:
      all:
        - tfm: 'net\d+\.\d+-windows.*'
        - not: {role: 'test|desktop'}
    severity: refactor
    category: runtime
    effort: 2
    title: Windows-specific target framework (-windows)
    why: >-
      The project targets a Windows-only framework (net10.0-windows), which makes Windows APIs
      such as Windows Forms, WPF or the registry available. Those APIs do not exist on Linux, so
      the build or the app fails there.
    fix: Retarget to plain net10.0 and replace the Windows-only APIs it uses.
    refs:
      - https://learn.microsoft.com/en-us/dotnet/standard/frameworks

  - id: windows-rid
    applies_to: [dotnet]
    when:
      any:
        - property: {RuntimeIdentifier: 'win.*'}
        - property: {RuntimeIdentifiers: 'win.*'}
    severity: config
    category: runtime
    effort: 0.25
    title: Windows runtime identifier pinned
    why: >-
      The project pins a Windows runtime identifier (e.g. win-x64), so dotnet publish produces a
      Windows executable and Windows native assets that do not run in a Linux container.
    fix: Publish with -r linux-x64 (the generated Dockerfile overrides it).
    refs:
      - https://learn.microsoft.com/en-us/dotnet/core/rid-catalog

  - id: x86-only
    applies_to: [dotnet]
    when:
      any:
        - property: {PlatformTarget: x86}
        - property: {RuntimeIdentifier: 'win(7|10)?-x86'}
        - property: {Prefer32Bit: "true"}
    severity: blocker
    category: runtime
    effort: 0
    windows_container: false
    title: 32-bit (x86) process
    why: >-
      The component is built as a 32-bit Windows process, almost always to load a 32-bit
      native or COM library. Linux .NET containers are 64-bit only, and Windows containers
      have no WoW64-dependent vendor installers either.
    fix: Replace the 32-bit dependency (or isolate it on a Windows VM behind an API) before containerizing.
    refs:
      - https://github.com/dotnet/core/blob/main/release-notes/8.0/supported-os.md

  - id: wcf-server
    applies_to: [dotnet]
    when:
      any:
        - file: "*.svc"
        - all:
            - reference: System\.ServiceModel(\.Activation|\.Web)?
            - code: '\b(Web)?ServiceHost(Factory)?\b|\[ServiceContract\b|\[(WebGet|WebInvoke)\b|<system\.serviceModel>'
            - not: {role: 'library|test'}
        - all:
            - code: '\bnew\s+WebServiceHost\(|\bWebServiceHostFactory\b'
            - not: {role: 'library|test'}
        - config: '<system\.serviceModel\b(?:(?!</system\.serviceModel>)[\s\S])*?<services>\s*<service\s'
    severity: rewrite
    category: framework
    effort: 5
    windows_container: true
    title: WCF service host
    why: >-
      The server side of WCF (ServiceHost, .svc endpoints) only exists in .NET Framework; .NET 10
      ships only the WCF client. The service has to move to CoreWCF, the community port of WCF
      services, or to another API style.
    fix: Port to CoreWCF (keeps contracts, BasicHttp/NetTcp bindings) or expose the operations as REST/gRPC.
    refs:
      - https://github.com/CoreWCF/CoreWCF
      - https://devblogs.microsoft.com/dotnet/corewcf-v1-released/

  - id: wcf-nettcp-msmq
    applies_to: [dotnet]
    when:
      config: '(netTcpBinding|netNamedPipeBinding|netMsmqBinding|msmqIntegrationBinding|wsDualHttpBinding|NetTcpPortSharing)'
    severity: rewrite
    category: framework
    effort: 3
    windows_container: false
    title: WCF Windows-only bindings (NetTcp/NamedPipe/MSMQ/duplex)
    why: >-
      Net.Tcp port sharing, named pipes and MSMQ bindings depend on Windows services (the Net.Tcp
      Port Sharing Service, Windows named pipes, Message Queuing), which do not exist in a Linux
      container; wsDualHttpBinding (duplex over HTTP) is a WS-* binding without a .NET 8 server.
    fix: Move to HTTP/gRPC or CoreWCF NetTcp without port sharing; replace MSMQ with a broker.
    refs:
      - https://devblogs.microsoft.com/dotnet/corewcf-v1-released/

  - id: wcf-client
    applies_to: [dotnet]
    when:
      all:
        - any:
            - reference: System\.ServiceModel
            - package: System\.ServiceModel\.(Http|Primitives|NetTcp|Security)
        - not: {file: "*.svc"}
        - not: {code: '\bServiceHost\b'}
    severity: info
    category: framework
    effort: 0.5
    title: WCF client
    why: >-
      Calling WCF services works on .NET 10 through the System.ServiceModel.* NuGet packages
      (HTTP and NetTcp bindings), but not every .NET Framework binding or WS-* security option is
      available, so check the bindings in the client configuration.
    fix: Use the System.ServiceModel.* NuGet packages; avoid WS-* security bindings.
    refs:
      - https://github.com/dotnet/wcf

  - id: webforms
    applies_to: [dotnet]
    when:
      file: ["*.aspx", "*.ascx", "*.master"]
    severity: rewrite
    category: framework
    effort: 15
    windows_container: true
    title: ASP.NET Web Forms
    why: >-
      ASP.NET Web Forms (.aspx pages, .ascx controls, ViewState, postbacks) is part of System.Web
      on .NET Framework and was not brought to ASP.NET Core, so the pages must be rewritten
      (Razor Pages or Blazor).
    fix: Rewrite UI in Razor Pages or Blazor; consider a Windows container stop-gap.
    refs:
      - https://learn.microsoft.com/en-us/dotnet/architecture/blazor-for-web-forms-developers/

  - id: asmx
    applies_to: [dotnet]
    when:
      file: ["*.asmx"]
    severity: rewrite
    category: framework
    effort: 3
    windows_container: true
    title: ASMX web services
    why: >-
      ASMX SOAP services (System.Web.Services, .asmx files) run only on ASP.NET for .NET
      Framework under IIS; .NET 10 has no ASMX hosting.
    fix: Port to CoreWCF BasicHttpBinding (keeps SOAP contract for existing clients) or REST.
    refs:
      - https://devblogs.microsoft.com/dotnet/corewcf-v1-released/

  - id: aspnet-mvc5
    applies_to: [dotnet]
    when:
      any:
        - package: Microsoft\.AspNet\.(Mvc|WebApi\.WebHost|WebApi|WebPages|Razor)
        - sdk: MSBuild\.SDK\.SystemWeb
        - reference: System\.Web(\.Mvc|\.Http)?
    severity: rewrite
    category: framework
    effort: 6
    windows_container: true
    title: ASP.NET (System.Web) MVC/Web API
    why: >-
      ASP.NET MVC 5 and Web API 2 are built on System.Web, which exists only in .NET Framework on
      Windows/IIS. The app must move to ASP.NET Core; controllers port fairly directly, the
      hosting pipeline does not.
    fix: Port to ASP.NET Core (controllers mostly carry over, filters/modules/handlers need rework).
    refs:
      - https://learn.microsoft.com/en-us/aspnet/core/migration/fx-to-core/
      - https://learn.microsoft.com/en-us/aspnet/core/migration/fx-to-core/tooling?view=aspnetcore-10.0

  - id: owin-systemweb
    applies_to: [dotnet]
    when:
      package: Microsoft\.Owin\.Host\.SystemWeb|Microsoft\.AspNet\.SignalR\.SystemWeb|Microsoft\.AspNet\.Identity\.Owin
    severity: rewrite
    category: framework
    effort: 2
    windows_container: true
    title: OWIN on IIS / ASP.NET SignalR 2 / ASP.NET Identity 2
    why: >-
      Katana/OWIN hosted on IIS (System.Web), classic SignalR 2 and ASP.NET Identity 2 are .NET
      Framework packages; ASP.NET Core has its own middleware pipeline, SignalR and Identity,
      which are not drop-in compatible.
    fix: Port to ASP.NET Core middleware, ASP.NET Core SignalR and ASP.NET Core Identity (password hashes are compatible).
    refs:
      - https://learn.microsoft.com/en-us/aspnet/core/migration/fx-to-core/areas/owin?view=aspnetcore-10.0
      - https://learn.microsoft.com/en-us/aspnet/core/signalr/version-differences

  - id: wf3-wf4
    applies_to: [dotnet]
    when:
      any:
        - reference: System\.Workflow\..*|System\.Activities(\..*)?|System\.ServiceModel\.Activities
        - file: ["*.xoml", "*.xamlx"]
    severity: rewrite
    category: framework
    effort: 8
    windows_container: true
    title: Windows Workflow Foundation
    why: >-
      Windows Workflow Foundation (WF3/WF4) and workflow services are not in .NET 10 (CoreWF is a
      partial community port of WF4; WF3 has none), so workflows must be re-hosted or rewritten.
    fix: Re-implement workflows (state machine in code, Elsa, Temporal, durable functions) or CoreWF for WF4.
    refs:
      - https://learn.microsoft.com/en-us/dotnet/core/porting/net-framework-tech-unavailable
      - https://github.com/UiPath/corewf

  - id: remoting
    applies_to: [dotnet]
    when:
      any:
        - reference: System\.Runtime\.Remoting
        - code: '\bRemotingConfiguration\b|\bMarshalByRefObject\b.*\bRemoting|ChannelServices\.RegisterChannel'
    severity: rewrite
    category: framework
    effort: 4
    windows_container: true
    title: .NET Remoting
    why: >-
      .NET Remoting (calling objects in another process or machine via MarshalByRefObject and
      channels) does not exist in .NET Core/.NET 8; Microsoft did not port it.
    fix: Replace with gRPC or HTTP APIs (or StreamJsonRpc / named pipes for same-machine IPC).
    refs:
      - https://learn.microsoft.com/en-us/dotnet/core/porting/net-framework-tech-unavailable

  - id: appdomain
    applies_to: [dotnet]
    when:
      code: 'AppDomain\.CreateDomain|AppDomainSetup\b'
    severity: rewrite
    category: framework
    effort: 2
    windows_container: true
    title: Multiple AppDomains
    why: >-
      .NET 10 supports only one AppDomain per process: AppDomain.CreateDomain throws
      PlatformNotSupportedException, so plugin loading or isolation built on extra AppDomains
      must be redesigned.
    fix: Use AssemblyLoadContext for plugins or run isolated work as separate processes/containers.
    refs:
      - https://learn.microsoft.com/en-us/dotnet/core/porting/net-framework-tech-unavailable

  - id: enterprise-services
    applies_to: [dotnet]
    when:
      code: '\b(ServicedComponent|ContextUtil|SharedPropertyGroupManager|ObjectPoolingAttribute)\b|\[(assembly:\s*)?(ApplicationName|ApplicationActivation|Transaction)\(\s*(ActivationOption|TransactionOption)'
    severity: rewrite
    category: framework
    effort: 4
    windows_container: false
    title: COM+ / Enterprise Services
    why: >-
      COM+ / Enterprise Services (ServicedComponent, declarative transactions, object pooling)
      is a Windows COM runtime feature; System.EnterpriseServices is not supported on .NET 8.
    fix: Replace with plain services and explicit transactions.
    refs:
      - https://learn.microsoft.com/en-us/dotnet/core/porting/net-framework-tech-unavailable

  - id: enterprise-services-reference
    applies_to: [dotnet]
    when:
      all:
        - reference: System\.EnterpriseServices
        - not: {code: '\b(ServicedComponent|ContextUtil|SharedPropertyGroupManager|ObjectPoolingAttribute)\b|\[(assembly:\s*)?(ApplicationName|ApplicationActivation|Transaction)\(\s*(ActivationOption|TransactionOption)'}
    severity: info
    category: framework
    effort: 0
    title: References System.EnterpriseServices without using COM+
    why: >-
      The project references the COM+ assembly System.EnterpriseServices (a common template
      leftover), which is not available on .NET 8, but its code uses no COM+ types.
    fix: Remove the reference.
    refs:
      - https://learn.microsoft.com/en-us/dotnet/core/porting/net-framework-tech-unavailable

  - id: linq-to-sql
    applies_to: [dotnet]
    when:
      any:
        - reference: System\.Data\.Linq
        - file: "*.dbml"
    severity: refactor
    category: data
    effort: 3
    windows_container: true
    title: LINQ to SQL
    why: >-
      LINQ to SQL (System.Data.Linq, .dbml designer files) ships only with .NET Framework;
      Microsoft provides no supported LINQ to SQL package for .NET 10, so the data access layer
      has to change.
    fix: Move data access to EF Core or Dapper.

  - id: ef6
    applies_to: [dotnet]
    when:
      all:
        - package: EntityFramework
        - tfm: 'net[1-4]\d{1,2}'
    severity: info
    category: data
    effort: 1
    title: Entity Framework 6
    why: >-
      Entity Framework 6.3+ is cross-platform and runs on .NET 10 (including Linux), but the EF
      designer (EDMX) does not work in .NET or SDK-style projects and some third-party providers
      are .NET Framework only.
    fix: Keep EF 6.4/6.5 for the port or move to EF Core.
    refs:
      - https://learn.microsoft.com/en-us/ef/ef6/what-is-new/
      - https://learn.microsoft.com/en-us/ef/efcore-and-ef6/porting/

  - id: system-web-apis-in-core
    applies_to: [dotnet]
    when:
      all:
        - code: 'HttpContext\.Current\b|System\.Web\.HttpContext'
        - not: {tfm: 'net[1-4]\d{1,2}'}
    severity: refactor
    category: framework
    effort: 1
    title: System.Web HttpContext usage in .NET Core code
    why: >-
      HttpContext.Current is the static System.Web accessor for the current request; ASP.NET
      Core has no such static property, so this code does not compile or (via adapters) behaves
      differently.
    fix: Register AddHttpContextAccessor() and inject IHttpContextAccessor, or pass the needed values in.
    refs:
      - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/http-context

  - id: config-manager
    applies_to: [dotnet]
    when:
      all:
        - code: 'ConfigurationManager\.(AppSettings|ConnectionStrings)'
        - not: {tfm: 'net[1-4]\d{1,2}'}
    severity: config
    category: configuration
    effort: 0.5
    title: app.config based settings on .NET Core
    why: Settings read via ConfigurationManager come from a baked-in .config file and cannot be overridden by environment variables.
    fix: Mount the .config file from a ConfigMap/Secret, or move settings to IConfiguration (environment variables use Section__Key).
    refs:
      - https://www.nuget.org/packages/System.Configuration.ConfigurationManager
      - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/configuration/

  - id: http-sys
    applies_to: [dotnet]
    when:
      code: '\bUseHttpSys\b|HttpSysOptions|Microsoft\.AspNetCore\.Server\.HttpSys'
    severity: refactor
    category: hosting
    effort: 1
    windows_container: true
    title: HTTP.sys server
    why: >-
      HTTP.sys is the Windows kernel HTTP driver and the ASP.NET Core HTTP.sys server only runs
      on Windows; in a Linux container the app must use Kestrel.
    fix: Switch to Kestrel (authentication via Negotiate handler instead of HTTP.sys Windows auth).
    refs:
      - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/servers/httpsys
      - https://learn.microsoft.com/en-us/aspnet/core/security/authentication/windowsauth

  - id: iis-in-process
    applies_to: [dotnet]
    when:
      any:
        - property: {AspNetCoreHostingModel: 'inprocess'}
        - code: '\bUseIIS\(|\bUseIISIntegration\(|IISServerOptions'
    severity: info
    category: hosting
    effort: 0
    title: Hosted in IIS
    why: >-
      IIS and the ASP.NET Core Module are Windows-only; in a Linux container the app runs on
      Kestrel and the IIS hosting settings (web.config, in-process model) are simply ignored.
    fix: Nothing to change; move IIS settings (request limits, rewrite rules) to Kestrel/ingress config.
    refs:
      - https://learn.microsoft.com/en-us/aspnet/core/host-and-deploy/iis/

  - id: web-config-rewrite
    applies_to: [dotnet]
    when:
      config: '<rewrite>|<httpRedirect|<ipSecurity|<requestFiltering|<httpProtocol>'
      in: ["web.config", "Web.config", "*.config"]
    severity: config
    category: hosting
    effort: 0.5
    title: IIS modules configured in web.config
    why: >-
      URL rewrite, redirects, IP restrictions and request filtering in web.config are executed
      by IIS modules; Kestrel in a Linux container ignores them, so those rules silently stop
      applying.
    fix: Recreate as ingress-controller rules (NGINX/Gateway API) or ASP.NET Core middleware (UseRewriter can load IIS rewrite rules).
    refs:
      - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/url-rewriting

  - id: windows-service-core
    applies_to: [dotnet]
    when:
      all:
        - code: '\.UseWindowsService\('
        - not: {tfm: 'net[1-4]\d{1,2}'}
    severity: info
    category: hosting
    effort: 0
    title: UseWindowsService (no-op on Linux)
    why: UseWindowsService() does nothing when not running as a Windows service, so the worker runs as a normal console host in a container.
    fix: None required.
    refs:
      - https://learn.microsoft.com/en-us/dotnet/api/microsoft.extensions.hosting.windowsservicelifetimehostbuilderextensions.usewindowsservice

  - id: windows-service-netfx
    applies_to: [dotnet]
    when:
      any:
        - code: ':\s*ServiceBase\b|ServiceBase\.Run\('
        - package: Topshelf.*
    severity: refactor
    category: hosting
    effort: 1
    windows_container: true
    title: Windows Service host (ServiceBase/Topshelf)
    why: >-
      The process is written to be started and stopped by the Windows Service Control Manager
      (ServiceBase/Topshelf), which does not exist on Linux; in a container the app must run as
      an ordinary foreground process that stops on SIGTERM.
    fix: Port to the .NET Generic Host (BackgroundService) - runs as a container's main process.
    refs:
      - https://learn.microsoft.com/en-us/dotnet/core/extensions/workers

  - id: installer-class
    applies_to: [dotnet]
    when:
      any:
        - reference: System\.Configuration\.Install
        - code: '\[RunInstaller\(true\)\]'
    severity: info
    category: hosting
    effort: 0.25
    title: Windows service installer
    why: >-
      installutil-based installers register the program as a Windows service; containers have no
      service registration, the image entrypoint starts the process.
    fix: Remove the installer; the container image is the deployment unit.

  - id: system-drawing-core
    applies_to: [dotnet]
    when:
      all:
        - any:
            - package: System\.Drawing\.Common
            # clear GDI+ use; `using System.Drawing;` alone is often only System.Drawing.Primitives (Color, Point, Rectangle)
            - code: '\bGraphics\.From(Image|Hwnd|Hdc)\(|\b(System\.Drawing\.)?Image\.From(File|Stream|Hbitmap)\(|\bSystem\.Drawing\.(Imaging|Drawing2D|Printing|Text)\b|\bnew\s+System\.Drawing\.(Bitmap|Font|Icon|Pen|SolidBrush)\('
            - all:
                - code: '^\s*using\s+System\.Drawing\s*;'
                - code: '\bnew\s+(Bitmap|Metafile|Pen|SolidBrush)\(|\bnew\s+Font\(\s*("|FontFamily\.)|\.DrawImage\(|\bBitmap\.FromHicon\('
              same_file: true
        - not: {tfm: 'net[1-4]\d{1,2}'}
        - not: {role: 'desktop|test'}
    severity: refactor
    category: libraries
    effort: 1.5
    title: System.Drawing on .NET 6+
    why: >-
      From .NET 6, System.Drawing.Common (GDI+) is Windows-only: on Linux its types throw
      TypeInitializationException / PlatformNotSupportedException at runtime, and the .NET 6
      opt-in switch was removed in .NET 7.
    fix: Replace with ImageSharp, SkiaSharp or QuestPDF/PdfSharpCore for rendering.
    refs:
      - https://learn.microsoft.com/en-us/dotnet/core/compatibility/core-libraries/6.0/system-drawing-common-windows-only

  - id: code-pages
    applies_to: [dotnet]
    when:
      code: 'Encoding\.GetEncoding\((1252|850|437|"windows-1252"|"ibm\d+"|"iso-8859-\d+")'
    severity: info
    category: libraries
    effort: 0.25
    title: Legacy code pages
    why: >-
      .NET 10 includes only Unicode, ASCII and Latin-1 encodings by default; Encoding.GetEncoding
      for Windows code pages such as 1252 or 850 throws unless the CodePages provider is
      registered.
    fix: Call Encoding.RegisterProvider(CodePagesEncodingProvider.Instance) once at startup (check whether it is already there).
    refs:
      - https://learn.microsoft.com/en-us/dotnet/api/system.text.codepagesencodingprovider

  - id: globalization-invariant-risk
    applies_to: [dotnet]
    when:
      code: 'new\s+CultureInfo\("(?!en-US|)[a-z]{2}-[A-Z]{2}"\)|CultureInfo\.GetCultureInfo\(|TimeZoneInfo\.FindSystemTimeZoneById\("[A-Z][a-z]+ [A-Z]'
    severity: config
    category: libraries
    effort: 0.25
    title: Cultures / Windows time zone IDs
    why: >-
      Culture data needs ICU in the image (chiseled 'extra' images include it). Windows time zone
      IDs ("W. Europe Standard Time") are converted automatically on .NET 6+ only when ICU and
      tzdata are present.
    fix: Use an image with ICU and tzdata (the generator picks *-chiseled-extra); keep DOTNET_SYSTEM_GLOBALIZATION_INVARIANT unset.
    refs:
      - https://learn.microsoft.com/en-us/dotnet/core/extensions/globalization-icu
      - https://devblogs.microsoft.com/dotnet/date-time-and-time-zone-enhancements-in-net-6/
      - https://github.com/dotnet/dotnet-docker/blob/main/documentation/image-variants.md
