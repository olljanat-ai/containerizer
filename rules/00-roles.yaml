# Role rules decide what a project *is*. The matching rule with the highest
# priority wins. Roles that are deployable on their own: web, worker, console,
# spa, desktop, biztalk, sharepoint, sqlclr, ssis, sqldb.
rules:
  - id: role-test
    phase: role
    role: test
    priority: 100
    when:
      any:
        - package: 'Microsoft\.NET\.Test\.Sdk|xunit|xunit\.v3(\.[\w.\-]+)?|nunit|MSTest\.TestFramework|MSTest|NUnit3TestAdapter|TUnit(\.\w+)?'
        - sdk: '^MSTest\.Sdk'
        - property: {IsTestProject: "true"}
        - name: '[.\-](Tests?|UnitTests|IntegrationTests|FunctionalTests|E2ETests|EndToEndTests|AcceptanceTests|Specs)$'
        # old-style projects reference the test framework as an assembly (GAC or a checked-in dll)
        # instead of a package, and Visual Studio test projects carry the test-project type GUID
        - reference: 'Microsoft\.VisualStudio\.QualityTools\.UnitTestFramework|Microsoft\.VisualStudio\.TestPlatform\.TestFramework|xunit(\.core|\.assert)?|nunit\.framework'
        - type_guid: '3ac096d0-a1c2-e12c-1390-a8335801fdab'

  - id: role-tool
    phase: role
    role: tool
    priority: 99
    when:
      any:
        - name: '[.\-](LabStubs|LabTools|Lab|Simulators?|TestTools|Seed(er)?|DevTools|Benchmarks?|Fuzz(ing)?)$'
        # a project that lives in a repository tools/ folder (tools/X/X.csproj, src/Tools/X/X.csproj);
        # a Tools/ subfolder *inside* a project (Areas/Mcp/Tools, admin/settings/tools) says nothing
        # (also 'Dev Tools/', 'DevTools/', 'BuildTools/', 'build-tools/': folders of developer utilities)
        - path: '(^|/)((dev|build)[ ._\-]?)?tools/[^/]+/'
        - package: 'BenchmarkDotNet|SharpFuzz'
        - kind: installer
        # .NET Aspire AppHost: a local orchestrator for the services, not a service itself
        # (the ServiceDefaults library is a plain library and stays one)
        - sdk: '^Aspire\.AppHost\.Sdk'
        - property: {IsAspireHost: "true"}
        - package: 'Aspire\.Hosting\.AppHost'
        # setup/installer builder executables (a web app or a library named *.Setup is not one)
        - all:
            - name: '[.\-](Setup|Installer)$'
            - output_type: 'Exe|WinExe'
            - not: {sdk: 'Microsoft\.NET\.Sdk\.(Web|Worker)'}
        # packaged as a `dotnet tool` (installed on developer/CI machines with `dotnet tool install`)
        - property: {PackAsTool: "true"}
        # MSBuild task libraries run inside the build, never in production. The package alone is not
        # enough: runtime libraries reference the MSBuild API too (Umbraco's ModelsBuilder compiles
        # models in memory with Microsoft.Build.Tasks.Core). A task library declares a task class, or
        # at least no other project compiles it in (ReferencedBy is set by the scanner).
        - all:
            - package: 'Microsoft\.Build\.Utilities\.Core|Microsoft\.Build\.Framework|Microsoft\.Build\.Tasks\.Core'
            - not: {output_type: 'Exe|WinExe'}
            - not: {sdk: 'Microsoft\.NET\.Sdk\.(Web|Worker)'}
            - any:
                - not: {property: {ReferencedBy: '.+'}}
                - code: '\bclass\s+\w+\s*(<[^>]*>)?\s*:\s*(Microsoft\.Build\.Utilities\.)?(Task|ToolTask|ToolTaskExtension|AppDomainIsolatedTask)\b|:\s*([\w.]+\s*,\s*)*(Microsoft\.Build\.Framework\.)?ITask\b'
        # source/client code generators (NSwag/NJsonSchema code generation) run at development time
        - all:
            - package: '(NSwag|NJsonSchema)\.CodeGeneration(\.\w+)*'
            - output_type: 'Exe'
            - not: {sdk: 'Microsoft\.NET\.Sdk\.(Web|Worker)'}
        # an executable the repository's own build runs from an MSBuild <Exec> (a post-build
        # cleaner, module packer, schema generator) is a build-time helper; RunByBuild names that
        # build file (set by the scanner)
        - all:
            - property: {RunByBuild: '.+'}
            - output_type: 'Exe'
            - not: {sdk: 'Microsoft\.NET\.Sdk\.(Web|Worker)'}
        # an executable that the repository's scripts start with `dotnet run` (compiled from the
        # checkout with the SDK) is a developer utility; deployed programs are published and
        # started from binaries. RunFromSourceBy names the script. Hosted services stay workers.
        - all:
            - property: {RunFromSourceBy: '.+'}
            - output_type: 'Exe'
            - not: {sdk: 'Microsoft\.NET\.Sdk\.(Web|Worker)'}
            - not: {framework_ref: 'Microsoft\.AspNetCore\.App'}
            - not: {code: '\bAddHostedService\b|(\bInherits|:)\s*BackgroundService\b|\bIHostedService\b|\bServiceBase\b|\bHostFactory\.Run\b|\bUseWindowsService\b|\bUseSystemd\b'}
        # source-code generators run by developers against the checkout (Rock.CodeGeneration, a WPF app
        # that writes C# and TypeScript into the source tree)
        - all:
            - name: '[.\-]CodeGen(eration|erator)?$'
            - output_type: 'Exe|WinExe'
        # build scripts written as .NET programs (NUKE, Cake Frosting, Bullseye) run on CI and developer machines
        - all:
            - any:
                - package: 'Nuke\.Common|Cake\.Frosting|Bullseye'
                - code: ':\s*NukeBuild\b|\bclass\s+\w+\s*:\s*FrostingTask(<[^>]*>)?|\bnew\s+CakeHost\s*\(\s*\)'
            - output_type: 'Exe'
            - not: {sdk: 'Microsoft\.NET\.Sdk\.(Web|Worker)'}
        # version-control hook executables (svn/hg/git hooks) are invoked by the VCS server per commit
        - all:
            - name: '[.\-]\w*(?<!web)Hooks?$'
            - output_type: 'Exe'
            - not: {sdk: 'Microsoft\.NET\.Sdk\.(Web|Worker)'}

  - id: role-biztalk
    phase: role
    role: biztalk
    priority: 95
    when: {kind: biztalk}

  - id: role-sqldb
    phase: role
    role: sqldb
    priority: 95
    when: {kind: sqldb}

  - id: role-ssis
    phase: role
    role: ssis
    priority: 95
    when:
      any:
        - kind: ssis
        - file: "*.dtsx"

  - id: role-sqlclr
    phase: role
    role: sqlclr
    priority: 92
    when:
      code: '[\[<]\s*(Microsoft\.SqlServer\.Server\.)?Sql(Function|Procedure|Trigger|UserDefinedType|UserDefinedAggregate)\b'

  - id: role-sharepoint
    phase: role
    role: sharepoint
    priority: 91
    when:
      all:
        - any:
            - reference: Microsoft\.SharePoint(\..*)?
            - package: Microsoft\.SharePoint(2013|2016|2019)?(\.Server)?(\..*)?
            - file: ["*.wsp", "*.spdata", "Package.package", "*.feature"]
        - any:
            - file: ["*.wsp", "*.spdata", "Package.package", "*.feature", "Elements.xml"]
            - code: '\bSPFarm\b|\bSPSite\b|\bSPWeb\b|\bSPFeatureReceiver\b|\bSPJobDefinition\b'

  # Windows services: the Visual Studio service template uses OutputType WinExe,
  # which would otherwise make them desktop apps.
  - id: role-windows-service
    phase: role
    role: worker
    priority: 85
    when:
      all:
        - output_type: 'WinExe|Exe'
        - code: '\bServiceBase\.Run\s*\(|(\bInherits|:)\s*(System\.ServiceProcess\.)?ServiceBase\b|\bHostFactory\.Run\s*\('
        - not: {property: {UseWPF: "true"}}
        - not: {property: {UseWindowsForms: "true"}}
        - not: {code: '\bApplication\.Run\s*\(|(\bInherits|:)\s*(System\.Windows\.Forms\.)?Form\b|(\bInherits|:)\s*(System\.Windows\.)?(Window|Application)\b|<Application\b|<Window\b'}

  # .NET MAUI apps are phone/desktop clients, never server components.
  - id: role-maui
    phase: role
    role: desktop
    priority: 86
    when:
      all:
        - property: {UseMaui: "true"}
        - output_type: 'Exe|WinExe'

  # Xamarin and UWP app heads (phones, tablets, Windows Store): clients, never server components.
  # A Xamarin.Android app is OutputType Library with AndroidApplication=true; a Xamarin.iOS app is
  # an Exe with the Xamarin.iOS project type; a UWP app is an AppContainerExe. Class libraries for
  # these platforms (bindings, shared code) have none of these and stay libraries.
  - id: role-mobile-app
    phase: role
    role: desktop
    priority: 86
    when:
      any:
        - property: {AndroidApplication: "true"}
        - output_type: AppContainerExe
        - all:
            - output_type: 'Exe|WinExe'
            - any:
                # Xamarin.Android, Xamarin.iOS (unified and classic MonoTouch), Xamarin.Mac, UWP
                - type_guid: 'efba0ad7-5a72-4c68-af49-83d382785dcf|feacfbd2-3405-455c-9665-78fe426c6842|6bc8ed88-2882-458c-8e55-dfd12b67127b|a3f8f2ab-b479-4a4a-a458-a89e7dc349f1|a5a43c5b-de2a-4c0c-9213-0a381af9435a'
                - tfm: 'net\d+\.\d+-(android|ios|maccatalyst|tvos|macos|tizen)[\d.]*|monoandroid.*|xamarin\.?(ios|mac|tvos|watchos).*|uap.*'
                - reference: 'Xamarin\.iOS|Xamarin\.Mac|Mono\.Android'

  - id: role-desktop
    phase: role
    role: desktop
    priority: 80
    when:
      any:
        - output_type: WinExe
        - all:
            - output_type: Exe
            - any:
                - property: {UseWPF: "true"}
                - property: {UseWindowsForms: "true"}
                # a leftover reference alone (common in old console/remoting hosts) is not a UI
                - all:
                    - reference: System\.Windows\.Forms|PresentationFramework
                    - code: '^\s*(using|Imports)\s+System\.Windows\.(Forms|Controls|Markup)\b|\bApplication\.Run\(|(\bInherits|:)\s*(Form|Window)\b|System\.Windows\.Forms\.\w+'
        - all:
            - output_type: Exe
            - tfm: 'net\d+\.\d+-windows.*'
            - code: '\bApplication\.Run\(|System\.Windows\.Forms|new\s+\w+Window\(\)'
            - not: {sdk: 'Microsoft\.NET\.Sdk\.(Web|Worker)'}

  - id: role-clickonce
    phase: role
    role: desktop
    priority: 81
    when:
      # <PublishUrl>publish\</PublishUrl>, <IsWebBootstrapper>, <Install> are Visual Studio
      # boilerplate in every old-style project (libraries and console apps too); only an
      # application with real ClickOnce manifests/deployment code is a ClickOnce client.
      all:
        - output_type: 'WinExe|Exe'
        - any:
            - file: "*.application"
            - property: {GenerateManifests: "true"}
            - property: {SignManifests: "true"}
            - property: {IsWebBootstrapper: "true"}
            - code: '\bApplicationDeployment\b'

  - id: role-spa-standalone
    phase: role
    role: spa
    priority: 70
    when:
      all:
        - kind: node
        - package: '@angular/core|react|react-dom|vue|svelte|@sveltejs/kit|preact|ember-source'
        - not: {property: {HostedBy: ".*"}}
        - not: {package: 'next|nuxt|express|fastify|koa|@nestjs/core|@remix-run/node'}

  # Standalone Blazor WebAssembly: static files (wwwroot after publish) for a web server.
  - id: role-spa-blazor-wasm
    phase: role
    role: spa
    priority: 70
    when:
      all:
        - sdk: 'Microsoft\.NET\.Sdk\.BlazorWebAssembly'
        - not: {property: {HostedBy: ".*"}}

  # ... and one referenced by an ASP.NET Core host is served by that host.
  - id: role-spa-blazor-wasm-hosted
    phase: role
    role: spa-assets
    priority: 71
    when:
      all:
        - sdk: 'Microsoft\.NET\.Sdk\.BlazorWebAssembly'
        - property: {HostedBy: ".*"}

  - id: role-spa-hosted
    phase: role
    role: spa-assets
    priority: 71
    when:
      all:
        - kind: node
        - property: {HostedBy: ".*"}

  - id: role-node-server
    phase: role
    role: web
    priority: 69
    when:
      all:
        - kind: node
        - package: 'next|nuxt|express|fastify|koa|@nestjs/core|@remix-run/node|hapi|@hapi/hapi|restify'

  - id: role-python-web
    phase: role
    role: web
    priority: 60
    when:
      all:
        - kind: python
        - package: 'flask|django|fastapi|starlette|aiohttp|tornado|gunicorn|uvicorn|sanic|falcon|pyramid'

  - id: role-java-web
    phase: role
    role: web
    priority: 60
    when:
      all:
        - kind: java
        - package: 'spring-boot-starter-web|spring-boot-starter-webflux|quarkus-.*|micronaut-.*|javax\.servlet-api|jakarta\.servlet-api'

  - id: role-go-web
    phase: role
    role: web
    priority: 60
    when:
      all:
        - kind: go
        - any:
            - package: 'github\.com/(gin-gonic/gin|labstack/echo.*|gofiber/fiber.*|gorilla/mux|go-chi/chi.*)'
            - code: 'http\.ListenAndServe|net/http'

  - id: role-go-cli
    phase: role
    role: console
    priority: 10
    when: {kind: go}

  - id: role-python-app
    phase: role
    role: console
    priority: 10
    when: {kind: python}

  - id: role-web-aspnetcore
    phase: role
    role: web
    priority: 60
    when:
      any:
        - all:
            - sdk: Microsoft\.NET\.Sdk\.Web$
            - output_type: Exe
        - all:
            - framework_ref: Microsoft\.AspNetCore\.App
            - output_type: Exe
            - code: 'WebApplication\.Create(Builder|SlimBuilder)?|UseStartup<|ConfigureWebHost|WebHost\.CreateDefaultBuilder'
        - all:
            - package: Microsoft\.AspNetCore(\.App|\.All)?
            - output_type: Exe
            - code: 'UseStartup<|WebHost\.CreateDefaultBuilder|ConfigureWebHostDefaults'
        # the shared framework can also come in through a package's own FrameworkReference
        # (Serilog.AspNetCore, ModelContextProtocol.AspNetCore, ...): an Exe whose code builds a
        # WebApplication compiles against ASP.NET Core whatever its Sdk says. Sdk.Worker declares a
        # background service that uses WebApplication only to host health/default endpoints
        # (eShop OrderProcessor), so it stays a worker.
        - all:
            - output_type: Exe
            - code: '\bWebApplication\.Create(Builder|SlimBuilder)?\s*\('
            - not: {sdk: 'Microsoft\.NET\.Sdk\.Worker$'}

  # ASP.NET Core host that only serves health probes while hosted services/jobs do the work
  # (Sdk.Web is used for the Kestrel health endpoint): a background worker, not a web app.
  - id: role-worker-health-only-web
    phase: role
    role: worker
    priority: 61
    when:
      all:
        - output_type: Exe
        - any:
            - sdk: Microsoft\.NET\.Sdk\.Web$
            - framework_ref: Microsoft\.AspNetCore\.App
            - code: '\bWebApplication\.Create(Builder|SlimBuilder)?\s*\('
        - code: '\b(UseHealthChecks|MapHealthChecks)\s*\('
        - code: '\bAddHostedService\s*(<|\(\s*Of\b)|\bAdd(Cron)?Jobs?\s*<|(\bInherits|:)\s*BackgroundService\b|\bIHostedService\b|\bAddQuartz\b|\bAddHangfireServer\b'
        - not:
            code: '\b(MapControllers|MapControllerRoute|MapDefaultControllerRoute|MapGet|MapPost|MapPut|MapPatch|MapDelete|MapMethods|MapGroup|MapRazorPages|MapRazorComponents|MapBlazorHub|MapHub|MapGrpcService|MapFallback\w*|MapReverseProxy|MapGraphQL|MapOpenApi|UseMvc\w*|UseStaticFiles|UseSwagger\w*|UseOcelot|AddControllers\w*|AddMvc|AddRazorPages|AddRazorComponents|AddServerSideBlazor|AddGrpc|AddSignalR)\b|:\s*(Controller|ControllerBase)\b|\[ApiController\]'

  - id: role-web-systemweb
    phase: role
    role: web
    priority: 60
    when:
      # The web-application type GUID and MVC packages alone are not enough: MVC
      # areas/plugins (loaded into a host app) and System.Web libraries carry them too.
      # A deployable System.Web app has an application entry point of its own.
      any:
        - sdk: MSBuild\.SDK\.SystemWeb
        - file: Global.asax
        - all:
            - file: ["*.aspx", "*.asmx", "*.svc", "*.ashx"]
            - any:
                - file: ["Web.config"]
                - type_guid: 349c5851-65df-11da-9384-00065b846f21
            # pages without a Global.asax of their own, built against a web application that has one:
            # a module/plugin whose pages and dll are copied into that host (mojoPortal Features.UI,
            # SuperFlexiUI), not a site of its own
            - not:
                references: {file: Global.asax}
        - all:
            - type_guid: 349c5851-65df-11da-9384-00065b846f21
            - package: Microsoft\.Owin\.Host\.SystemWeb
            - any:
                - code: '[\[<]\s*assembly\s*:\s*OwinStartup'
                - config: '<add\s+key="owin:appStartup"'

  - id: role-web-selfhost
    phase: role
    role: web
    priority: 55
    when:
      all:
        - output_type: Exe
        - any:
            - package: Microsoft\.Owin\.(Host\.HttpListener|Hosting|SelfHost)|Microsoft\.AspNet\.WebApi\.OwinSelfHost|Nancy\.Hosting\.Self
            - code: '\bWebApp\.Start\b|\bHttpSelfHostServer\b'
        - not: {code: '\bServiceBase\b|HostFactory\.Run'}

  # A plain console Exe that opens a listening endpoint and then blocks forever is a long-running
  # server (a Deployment), not a run-once job (a CronJob). The listener and the wait must be in the
  # same file (the Main that starts it), so a client that connects somewhere and waits for a key
  # press stays a console app: a Remoting client registers a channel too, but no service type and
  # no port. HTTP self-hosts (WebApp.Start, HttpSelfHostServer) are web via role-web-selfhost.
  - id: role-network-listener
    phase: role
    role: worker
    priority: 52
    when:
      all:
        - output_type: Exe
        - not: {sdk: 'Microsoft\.NET\.Sdk\.(Web|Worker)'}
        - any:
            - all:
                # .NET Remoting server: publishes objects for remote callers
                - code: '\bRemotingConfiguration\.Register(WellKnownServiceType|ActivatedServiceType)\s*\(|\bRemotingServices\.Marshal\s*\('
                - code: &listener_wait '\bConsole\.Read(Line|Key)?\s*\(|\.WaitOne\s*\(\s*\)|\bThread\.Sleep\s*\(\s*(Timeout\.Infinite|-1)\s*\)|\bTask\.Delay\s*\(\s*(Timeout\.Infinite|-1)\s*\)|\bwhile\s*\(\s*true\s*\)|\bfor\s*\(\s*;\s*;\s*\)'
              same_file: true
            - all:
                # raw socket / HttpListener server; a single GetContext() without a loop or wait
                # (a CLI catching an OAuth redirect on localhost) does not count
                - code: '\bnew\s+TcpListener\s*\(|\bTcpListener\.Create\s*\(|\bnew\s+HttpListener\s*\(|\bnew\s+UdpClient\s*\(\s*\d+\s*\)|\.Listen\s*\(\s*(\d+|\w*[Bb]acklog\w*|int\.MaxValue|SocketOptionName\.MaxConnections)\s*\)'
                - code: *listener_wait
              same_file: true
            # Remoting server configured from the .config file (<service><wellknown .../>)
            - all:
                - code: '\bRemotingConfiguration\.Configure\s*\('
                - config: '<service>\s*<(wellknown|activated)\b'
                - code: *listener_wait

  # A generic-host program whose hosted service stops the application when its work is done
  # (IHostApplicationLifetime.StopApplication() as the last statement of StartAsync/ExecuteAsync):
  # a run-to-completion job such as a database migrator/seeder (Kubernetes Job), not a long-running
  # worker. Not when the stop is an error path (inside catch) or the service loops until cancelled.
  - id: role-run-once-hosted
    phase: role
    role: console
    priority: 51
    when:
      all:
        - output_type: Exe
        - not: {sdk: 'Microsoft\.NET\.Sdk\.(Web|Worker)'}
        - all:
            - code: ':\s*(BackgroundService|IHostedService)\b'
            - code: '\.StopApplication\s*\(\s*\)\s*;(\s*\})+\s*(public|private|protected|internal|override|\[|\}|\Z)'
          same_file: true
        - not: {code: 'catch\s*(\([^)]*\))?\s*\{[^{}]*\.StopApplication\s*\(\s*\)'}
        - not: {code: '\bwhile\s*\(\s*!\s*[\w.]*IsCancellationRequested|\bPeriodicTimer\b|\bwhile\s*\(\s*true\s*\)|\bfor\s*\(\s*;\s*;\s*\)'}
        - not: {code: '\bServiceBase\b|HostFactory\.Run|UseWindowsService|UseSystemd|RunAsService'}

  - id: role-worker
    phase: role
    role: worker
    priority: 50
    when:
      any:
        - sdk: Microsoft\.NET\.Sdk\.Worker
        - all:
            - output_type: Exe
            - code: '\bServiceBase\b|HostFactory\.Run|UseWindowsService|AddHostedService|(\bInherits|:)\s*BackgroundService\b|IHostedService|UseSystemd|ServiceHost\b|RunAsService'

  - id: role-console
    phase: role
    role: console
    priority: 40
    when:
      any:
        - output_type: Exe
        - code: '^\s*static\s+(async\s+)?(void|int|Task|Task<int>)\s+Main\s*\('
