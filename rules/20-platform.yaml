# Windows platform dependencies (OS APIs, native code, COM, hardware, desktop).
rules:
  - id: com-office-automation
    applies_to: [dotnet]
    when:
      any:
        - code: 'GetTypeFromProgID\("(Word|Excel|Outlook|PowerPoint|Access|Visio)\.Application'
        - code: 'Microsoft\.Office\.Interop\.|new\s+(Word|Excel)\.Application\b'
        - reference: 'Microsoft\.Office\.Interop\..*|COM:.*(Word|Excel|Office).*'
    severity: blocker
    category: com
    effort: 0
    windows_container: false
    title: Microsoft Office automation (COM)
    why: >-
      Drives Word/Excel through COM. Office is a desktop product that is not supported for
      server-side automation, cannot be installed in a container and does not exist on Linux.
    fix: Replace with a document library (OpenXML SDK, ClosedXML, NPOI, QuestPDF, a template engine) or keep this component on a Windows VM.

  - id: com-interop
    applies_to: [dotnet]
    when:
      any:
        - code: '\[ComImport\]|Type\.GetTypeFromProgID\(|Type\.GetTypeFromCLSID\(|Marshal\.GetActiveObject\(|Activator\.CreateInstance\(Type\.GetTypeFrom'
        - reference: 'COM:.*|Interop\..*'
    severity: blocker
    category: com
    effort: 0
    windows_container: false
    title: COM interop with a registered component
    why: >-
      Activates COM classes by ProgID/CLSID. COM registration and the vendor COM servers
      exist only on Windows; Linux has no COM runtime.
    fix: Replace the COM component with a Linux-capable SDK/API, or isolate it on a Windows host behind a network API.

  - id: dcom-opc
    applies_to: [dotnet]
    when:
      code: 'OPC(DA|Server)|IOPCServer|GetTypeFromProgID\([^)]*,\s*\w*[Hh]ost'
    severity: blocker
    category: com
    effort: 0
    windows_container: false
    title: OPC DA over DCOM
    why: Classic OPC DA uses DCOM, which only works between Windows hosts.
    fix: Use OPC UA (cross-platform) through a gateway, or keep the collector on Windows.

  - id: pinvoke-gui
    applies_to: [dotnet]
    when:
      code: 'DllImport\(\s*"(user32|gdi32|gdiplus|comctl32|comdlg32|uxtheme|dwmapi|shell32|winspool\.drv|wtsapi32)(\.dll)?"'
      unguarded: true
    severity: blocker
    category: native
    effort: 0
    windows_container: false
    title: Windows GUI / session APIs (user32/gdi32/wtsapi32)
    why: Calls Windows desktop APIs (windows, messages, GDI, terminal sessions). Containers have no desktop session.
    fix: Replace the screen automation with an API integration; otherwise this stays on a Windows desktop/VM.

  - id: pinvoke-security
    applies_to: [dotnet]
    when:
      code: 'DllImport\(\s*"(advapi32|authz|secur32|netapi32|crypt32|ncrypt|tbs|mpr|activeds|wldap32|userenv|credui)(\.dll)?"'
      unguarded: true
    severity: rewrite
    category: native
    effort: 3
    windows_container: true
    title: Windows security / directory native APIs
    why: Calls Win32 security APIs (LogonUser, token privileges, AuthZ, DFS/NetApi, DPAPI/CryptoAPI). These have no Linux equivalent.
    fix: Replace with platform-neutral mechanisms (OIDC tokens, LDAP via Novell/System.DirectoryServices.Protocols, managed crypto, Kubernetes secrets).

  - id: pinvoke-kernel32
    applies_to: [dotnet]
    when:
      code: 'DllImport\(\s*"(kernel32|kernelbase|ntdll|ole32|oleaut32|combase|psapi|iphlpapi|ws2_32|version|dbghelp|dbgeng|winmm|setupapi|wininet|winhttp|shlwapi|rpcrt4|dnsapi|wintrust|msvcrt|(api|ext)-ms-win-[\w\-]+)(\.dll)?"|DllImport\(\s*Kernel32\b'
      unguarded: true
    severity: refactor
    category: native
    effort: 1
    windows_container: true
    title: Win32 kernel/OLE/system DLL native calls
    why: P/Invoke into kernel32/ole32 and other Windows system DLLs (dbghelp, winmm, wininet, shlwapi, ...) does not resolve on Linux.
    fix: Replace with the managed .NET API (most kernel32 calls have one) or guard with OperatingSystem.IsWindows().

  - id: pinvoke-vendor
    applies_to: [dotnet]
    confidence: 0.8
    when:
      all:
        - code: 'DllImport\(\s*(?!"?(kernel32|kernelbase|user32|gdi32|gdiplus|advapi32|ole32|oleaut32|combase|ntdll|crypt32|authz|netapi32|wtsapi32|secur32|shell32|comctl32|comdlg32|uxtheme|dwmapi|winspool|psapi|iphlpapi|ws2_32|mpr|version|userenv|ncrypt|tbs|activeds|wldap32|credui|dbghelp|dbgeng|winmm|setupapi|wininet|winhttp|shlwapi|rpcrt4|dnsapi|wintrust|msvcrt|(api|ext)-ms-win-[\w\-]+|libc|libdl|libm|librt|libpthread|libSystem(\.B)?|libobjc|IOKit|CoreFoundation|Security|__Internal|e_sqlite3|sqlite3)(\.dll|\.so[.\d]*|\.dylib)?"?\s*[,)])(?!"/(usr|lib|System|Library)/)("[^"]+"|[A-Za-z_][\w.]*)'
          unguarded: true
    severity: blocker
    category: native
    effort: 0
    windows_container: false
    title: Native vendor library (P/Invoke)
    why: >-
      Calls a native DLL that is not part of .NET or Windows. Vendor SDKs like this are
      almost always Windows-only binaries; without a Linux build of the library the
      component cannot run in a Linux container.
    fix: Ask the vendor for a Linux SDK or a network API; otherwise keep this component on Windows and call it remotely.

  - id: native-dll-shipped
    applies_to: [dotnet]
    when:
      all:
        - file: ["*.dll", "*.ocx"]
        - not: {file: ["*.so", "*.so.*"]}
        - not: {role: test}
    severity: refactor
    category: native
    effort: 1
    title: Binary DLLs checked into the source tree
    why: Pre-built DLLs in the repo are often Windows-only native or old managed libraries without NuGet packages.
    fix: Check each DLL; replace with NuGet packages or Linux builds.

  - id: libwkhtmltox
    applies_to: [dotnet]
    when:
      any:
        - package: DinkToPdf|Rotativa.*|NReco\.PdfGenerator|TuesPechkin.*|WkHtmlToPdf.*
        - code: 'wkhtmltopdf|libwkhtmltox'
    severity: config
    category: native
    effort: 1
    title: wkhtmltopdf native library
    why: wkhtmltopdf is available for Linux but must be added to the image (and the Windows .dll path changed to the .so).
    fix: Install wkhtmltopdf/libwkhtmltox in the image (Debian package) or move to a maintained renderer such as Playwright/QuestPDF.

  - id: registry
    applies_to: [dotnet]
    when:
      code: '\bRegistry\.(LocalMachine|CurrentUser|ClassesRoot|Users|GetValue|SetValue)|\bRegistryKey\b|RegistryHive\.'
      unguarded: true
    severity: refactor
    category: os
    effort: 1
    windows_container: true
    title: Windows Registry
    why: The registry does not exist on Linux (Microsoft.Win32.Registry throws PlatformNotSupportedException).
    fix: Move the values to configuration (environment variables / ConfigMap).

  - id: eventlog-write
    applies_to: [dotnet]
    when:
      any:
        - code: '\bEventLog\.(WriteEntry|CreateEventSource|SourceExists)|new\s+EventLog\(|\.AddEventLog\(|EventLogTraceListener'
          unguarded: true
        - package: Serilog\.Sinks\.EventLog|NLog\.WindowsEventLog
        - config: 'EventLogAppender|type="eventlog"|xsi:type="EventLog"|"Name"\s*:\s*"EventLog"'
    severity: refactor
    category: observability
    effort: 0.5
    windows_container: true
    title: Writes to the Windows Event Log
    why: There is no Event Log on Linux; EventLog APIs throw PlatformNotSupportedException.
    fix: Log to stdout (console sink/provider) and let the cluster collect logs; guard EventLog calls with OperatingSystem.IsWindows().

  - id: perf-counters
    applies_to: [dotnet]
    when:
      code: '\bPerformanceCounter(Category)?\b'
    severity: refactor
    category: observability
    effort: 0.5
    windows_container: true
    title: Windows performance counters
    why: PerformanceCounter is Windows-only.
    fix: Use System.Diagnostics.Metrics / OpenTelemetry metrics.

  - id: wmi
    applies_to: [dotnet]
    when:
      code: '\b(ManagementObject(Searcher|Collection)?|ManagementClass|ManagementScope|ManagementEventWatcher|ManagementPath)\b'
    severity: refactor
    category: os
    effort: 1
    windows_container: true
    title: WMI
    why: WMI exists only on Windows.
    fix: Replace with Kubernetes/OS-neutral sources (environment, /proc, cluster APIs).

  - id: wmi-reference
    applies_to: [dotnet]
    when:
      all:
        - any:
            - reference: System\.Management
            - package: System\.Management
        - not: {code: '\b(ManagementObject(Searcher|Collection)?|ManagementClass|ManagementScope|ManagementEventWatcher|ManagementPath)\b'}
    severity: info
    category: os
    effort: 0
    title: References System.Management (WMI) without using it
    why: The project references the WMI assembly (often a template leftover) but no WMI types are used in its code.
    fix: Remove the reference.

  - id: windows-service-control
    applies_to: [dotnet]
    when:
      code: '\bServiceController\b'
    severity: refactor
    category: os
    effort: 0.5
    windows_container: true
    title: Controls Windows services
    why: Starting/stopping Windows services from code has no container equivalent.
    fix: Replace with Kubernetes API calls or remove.

  - id: process-start-exe
    applies_to: [dotnet]
    when:
      code: 'Process\.Start\([^)]*\.(exe|cmd|bat)|FileName\s*=\s*[^;]*\.(exe|cmd|bat)"|"(cmd|powershell|pwsh)\.exe"|(?-i:(FileName\s*=\s*|ProcessStartInfo\(\s*|Process\.Start\(\s*)"(cmd|powershell|pwsh)"|"(cmd|powershell|pwsh)"\s*,\s*[$@]*"\s*[/-](c|k|C|K|Command|NoProfile|ExecutionPolicy)\b)'
      unguarded: true
    severity: refactor
    category: os
    effort: 1
    windows_container: true
    title: Starts Windows executables
    why: Launches .exe/.cmd/PowerShell processes that are not present in a Linux image.
    fix: Install a Linux equivalent in the image or replace the external tool with a library.

  - id: scheduled-tasks
    applies_to: [dotnet]
    when:
      any:
        - code: 'TaskScheduler\.TaskService|schtasks(\.exe)?'
        - text: 'Register-ScheduledTask|New-ScheduledTaskTrigger|schtasks\s*/create'
          in: ["*.ps1", "*.psm1", "*.cmd", "*.bat", "*.md"]
    severity: config
    category: hosting
    effort: 0.5
    title: Windows Task Scheduler jobs
    why: Jobs started by Task Scheduler become Kubernetes CronJobs.
    fix: Create a CronJob per scheduled task using the same image and arguments.

  - id: printing
    applies_to: [dotnet]
    when:
      code: 'new\s+PrintDocument\b|new\s+PrinterSettings\b|\bPrintQueue\b|LocalPrintServer|new\s+PrintDialog\b|\bRawPrinterHelper\b|OpenPrinter\(|\.PrintOut\('
    severity: blocker
    category: hardware
    effort: 0
    windows_container: false
    title: Windows printing
    why: Prints through the Windows print spooler/drivers to locally installed printers.
    fix: Generate PDFs and send them to a print service (IPP/CUPS, cloud print) instead of printing from the app.

  - id: serial-port
    applies_to: [dotnet]
    when:
      any:
        - code: '\bSerialPort\b'
        - package: System\.IO\.Ports
    severity: blocker
    category: hardware
    effort: 0
    windows_container: false
    title: Serial port hardware
    why: Reads a device on a local serial/COM port. A pod in a cluster has no access to a badge reader on a desk.
    fix: Keep the device-facing part on the edge device; send events to the cluster over the network.

  - id: hardware-sdk
    applies_to: [dotnet]
    when:
      any:
        - code: '\bTpm\w*\b|Tbsi_|NCryptOpenStorageProvider|MS_PLATFORM_CRYPTO_PROVIDER|"Microsoft Platform Crypto Provider"'
        - code: '\bGpioController\b|\bUsbDevice\b|\bHidDevice\b|\bLibUsb\w*'
    severity: blocker
    category: hardware
    effort: 0
    windows_container: false
    title: Local hardware (TPM, data acquisition boards, USB/HID)
    why: Depends on hardware attached to a specific server, with Windows drivers.
    fix: Keep the hardware-facing service on its host (edge) and integrate over the network; use a KMS/HSM service instead of the TPM.

  - id: efs-ntfs
    applies_to: [dotnet]
    when:
      # calls, not declarations (an interface member returning DirectorySecurity is not ACL use)
      code: 'File\.Encrypt\(|FileSystemAclExtensions|\.(Set|Get)AccessControl\(|\bnew\s+(File|Directory)Security\(|\bFileSystemAccessRule\b|\bEFS\b'
      unguarded: true
    severity: refactor
    category: storage
    effort: 1.5
    windows_container: true
    title: NTFS ACLs / EFS encryption
    why: NTFS permissions and EFS encryption do not exist on Linux volumes.
    fix: Use storage-level encryption and Kubernetes RBAC/volume permissions; drop per-file ACLs in code.

  - id: desktop-ui
    applies_to: [dotnet]
    when:
      role: desktop
    severity: blocker
    category: ui
    effort: 0
    windows_container: false
    title: Windows desktop application (WinForms/WPF)
    why: A desktop GUI used interactively by people at their PCs is not a server workload.
    fix: Keep as a desktop client (it can call containerized APIs) or rebuild the UI as a web app.

  - id: clickonce-offline
    applies_to: [dotnet]
    when:
      all:
        - output_type: 'WinExe|Exe'
        - any:
            - property: {PublishUrl: ".*"}
            - file: "*.application"
            - code: '\bApplicationDeployment\b'
    severity: info
    category: ui
    effort: 0
    title: ClickOnce deployed client
    why: The client is installed on workstations with ClickOnce; only its server side can move to containers.
    fix: The ClickOnce publish folder can be served as static files from a container.

  - id: sta-apartment
    applies_to: [dotnet]
    when:
      code: '\.(Try)?SetApartmentState\(\s*ApartmentState\.STA\s*\)'
    severity: blocker
    category: com
    effort: 0
    windows_container: true
    title: Single-threaded apartment (STA) threads
    why: >-
      Creates STA threads, which exist to host COM/ActiveX/desktop components. SetApartmentState
      throws PlatformNotSupportedException on Linux, and the component it hosts is Windows-only.
    fix: Replace the STA-bound component (usually a COM/vendor SDK) or keep this part on Windows.

  - id: winrt-apis
    applies_to: [dotnet]
    when:
      any:
        - code: &winrt_using '^\s*using\s+Windows\.(Media|Graphics|Storage|Devices|Security\.Credentials|ApplicationModel|UI|Data|Globalization|Foundation|System|Networking)(\.\w+)*\s*;'
    severity: blocker
    category: os
    effort: 0
    windows_container: false
    title: Windows Runtime (WinRT) APIs
    why: Uses Windows Runtime APIs (e.g. Windows.Media.Ocr) that only exist on Windows client/desktop editions.
    fix: Replace with a cross-platform library or service (e.g. Tesseract or a cloud OCR API for Windows.Media.Ocr).

  - id: winrt-tfm
    applies_to: [dotnet]
    when:
      all:
        - tfm: 'net\d+\.\d+-windows10\..*'
        - not: {code: *winrt_using}
    severity: refactor
    category: os
    effort: 1
    windows_container: true
    title: Targets the Windows 10 SDK TFM (WinRT projections)
    why: >-
      The project targets net*-windows10.*, which only builds/runs on Windows, but no WinRT
      namespaces are used in its code, so retargeting to the plain TFM is usually enough.
    fix: Retarget to net10.0 (or multi-target) and replace the few Windows-only calls, if any.

  - id: vendor-sdk-install-dir
    applies_to: [dotnet]
    confidence: 0.7
    when:
      same_file: true
      all:
        - code: 'Assembly\.Load(From|File)\(|LoadFromAssemblyPath\(|AssemblyLoadContext\.Default\.Resolving|AppDomain\.CurrentDomain\.AssemblyResolve'
        - code: 'Install(Dir|Path|Folder|Location)\b|Program Files|ProgramFiles'
    severity: blocker
    category: thirdparty
    effort: 0
    windows_container: null
    title: Vendor SDK loaded from its Windows installation
    why: >-
      Loads assemblies of an installed third-party product from its installation folder at
      runtime. The product (and usually its native engine and licensing) is installed with a
      Windows installer; unless the vendor ships a Linux build it cannot be put in a Linux image.
    fix: Check the vendor's Linux/container support; otherwise isolate the product on a Windows host behind an API.

  - id: supported-os-windows
    applies_to: [dotnet]
    when:
      code: &supported_os_type '\[\s*assembly:\s*SupportedOSPlatform\(\s*"windows|\[\s*SupportedOSPlatform\(\s*"windows[^"]*"\s*\)\s*\]\s*(\[[^\]]*\]\s*)*((public|internal|private|protected|sealed|static|partial|abstract|unsafe|readonly)\s+)*(class|struct|interface|record|enum)\b'
    severity: refactor
    category: os
    effort: 1
    windows_container: true
    title: Code marked Windows-only by its authors
    why: Types or assemblies are annotated [SupportedOSPlatform("windows")]; the authors know this code does not run elsewhere.
    fix: Review each annotated type; replace or isolate it.

  - id: supported-os-windows-member
    applies_to: [dotnet]
    when:
      all:
        - code: '\[\s*SupportedOSPlatform\(\s*"windows'
        - not: {code: *supported_os_type}
    severity: info
    category: os
    effort: 0
    title: Windows-only members behind platform checks
    why: >-
      Individual methods are annotated [SupportedOSPlatform("windows")]. The platform analyzer
      (CA1416) makes callers guard them with OperatingSystem.IsWindows(), so the app already has
      a non-Windows code path; Windows-only calls inside these members are not counted.
    fix: None; check that the non-Windows path does what you need in the container.

  - id: winforms-in-library
    applies_to: [dotnet]
    when:
      all:
        - not: {role: desktop}
        - any:
            - code: '^\s*(global\s+)?using\s+System\.Windows\.(Forms|Controls|Media|Documents|Xps|Markup)(\.\w+)*\s*;'
            # bare type names are ambiguous (a web app's own Form model, Avalonia's RenderTargetBitmap):
            # they count only in a project that references the Windows Desktop assemblies
            - all:
                - code: 'new\s+(FixedDocument|XpsDocument|RenderTargetBitmap|PrintDialog|Form)\b'
                - any:
                    - reference: System\.Windows\.Forms|PresentationFramework|PresentationCore|ReachFramework
                    - property: {UseWPF: "true"}
                    - property: {UseWindowsForms: "true"}
                    - framework_ref: Microsoft\.WindowsDesktop\.App(\.\w+)?
    severity: blocker
    category: ui
    effort: 0
    windows_container: false
    title: Uses WinForms/WPF APIs in server code
    why: Server-side code that renders with WPF/WinForms (XPS, visuals, printing) needs the Windows Desktop runtime, which does not exist on Linux.
    fix: Replace the rendering with a server-side library (QuestPDF, PdfSharpCore, SkiaSharp).

  - id: winforms-reference-library
    applies_to: [dotnet]
    when:
      all:
        - not: {role: desktop}
        - any:
            - reference: System\.Windows\.Forms|PresentationFramework|PresentationCore|ReachFramework|System\.Printing
            - property: {UseWPF: "true"}
            - property: {UseWindowsForms: "true"}
        - not: {code: '^\s*using\s+System\.Windows\.(Forms|Controls|Media|Documents|Xps|Markup)(\.\w+)*\s*;'}
        - code: &wf_qualified '\bSystem\.Windows\.(Forms|Controls|Media|Documents|Xps|Markup)\.[A-Z]\w*|\bMessageBox\.Show\('
    severity: refactor
    category: ui
    effort: 1
    windows_container: true
    title: References Windows Desktop assemblies
    why: The project references WinForms/WPF assemblies (often only for a report viewer or a helper type); they are not available on Linux.
    fix: Remove the reference and replace the few types used from it.

  - id: winforms-reference-unused
    applies_to: [dotnet]
    when:
      all:
        - not: {role: desktop}
        - any:
            - reference: System\.Windows\.Forms|PresentationFramework|PresentationCore|ReachFramework|System\.Printing
            - property: {UseWPF: "true"}
            - property: {UseWindowsForms: "true"}
        - not: {code: '^\s*using\s+System\.Windows\.(Forms|Controls|Media|Documents|Xps|Markup)(\.\w+)*\s*;'}
        - not: {code: *wf_qualified}
    severity: info
    category: ui
    effort: 0
    title: References Windows Desktop assemblies without using them
    why: The project references WinForms/WPF assemblies (often a template leftover) but its code uses none of their types.
    fix: Remove the reference.
