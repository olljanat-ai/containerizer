# Local results stack: SQL Server 2025 (Developer edition), schema + logins, and the read-only web UI.
#
#   cp results/.env.example results/.env     # then set strong passwords in results/.env
#   docker compose -f results/compose.yaml up -d --build
#   open http://127.0.0.1:8080/
#
# Scan an app into it (static analysis), e.g. a checkout in ../my-app:
#   docker compose -f results/compose.yaml run --rm -v "$PWD/../my-app:/apps/my-app:ro" scan assess /apps/my-app
# (the image has no git, so the app is keyed by its folder name: mount it under its real name)
# or from a normal checkout with Docker available (adds build-and-run verification):
#   CONTAINERIZER_SQL="Server=127.0.0.1,1433;Database=Containerizer;User Id=cz_scanner;TrustServerCertificate=yes" \
#   CONTAINERIZER_SQL_PASSWORD=... python -m containerizer analyze ../my-app
#
# Admin pages (mapping, products, business units, change history): set the CONTAINERIZER_OIDC_* lines
# in results/.env to sign in with your identity provider.
#
# Development only: the SQL Server certificate is self-signed (TrustServerCertificate=yes) and every
# port is published on 127.0.0.1 only. See docs/local-dev-server.md; production runs on the appliance (docs/appliance.md).
name: containerizer-results

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=16m,mode=1777"]

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in results/.env}
    ports: ["127.0.0.1:1433:1433"]
    volumes: ["mssql-data:/var/opt/mssql"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Creates the database, the containerizer schema, its roles and audit triggers, and one login per
  # role. Runs once and exits.
  db-init:
    build: { context: .., dockerfile: results/Dockerfile }
    image: containerizer-results
    <<: *hardening
    command: ["db", "init", "--create-database",
              "--login", "cz_scanner:writer", "--login", "cz_web:reader", "--login", "cz_admin:admin"]
    environment:
      CONTAINERIZER_SQL: "Server=mssql,1433;Database=Containerizer;User Id=sa;TrustServerCertificate=yes"
      CONTAINERIZER_SQL_PASSWORD: ${MSSQL_SA_PASSWORD}
      CZ_CZ_SCANNER_PASSWORD: ${CZ_SCANNER_PASSWORD:?set CZ_SCANNER_PASSWORD in results/.env}
      CZ_CZ_WEB_PASSWORD: ${CZ_WEB_PASSWORD:?set CZ_WEB_PASSWORD in results/.env}
      CZ_CZ_ADMIN_PASSWORD: ${CZ_ADMIN_PASSWORD:?set CZ_ADMIN_PASSWORD in results/.env}
    depends_on:
      mssql: { condition: service_healthy }
    restart: "no"

  web:
    image: containerizer-results
    <<: *hardening
    environment:
      CONTAINERIZER_SQL: "Server=mssql,1433;Database=Containerizer;User Id=cz_web;TrustServerCertificate=yes"
      CONTAINERIZER_SQL_PASSWORD: ${CZ_WEB_PASSWORD}
      # admin pages: on when CONTAINERIZER_OIDC_ISSUER is set in results/.env (docs/sign-in.md)
      CONTAINERIZER_ADMIN_SQL: "Server=mssql,1433;Database=Containerizer;User Id=cz_admin;TrustServerCertificate=yes"
      CONTAINERIZER_ADMIN_SQL_PASSWORD: ${CZ_ADMIN_PASSWORD}
      CONTAINERIZER_OIDC_ISSUER: ${CONTAINERIZER_OIDC_ISSUER:-}
      CONTAINERIZER_OIDC_CLIENT_ID: ${CONTAINERIZER_OIDC_CLIENT_ID:-}
      CONTAINERIZER_OIDC_CLIENT_SECRET: ${CONTAINERIZER_OIDC_CLIENT_SECRET:-}
      CONTAINERIZER_ADMINS: ${CONTAINERIZER_ADMINS:-}
      CONTAINERIZER_PUBLIC_URL: ${CONTAINERIZER_PUBLIC_URL:-http://127.0.0.1:8080}
      CONTAINERIZER_VIEWERS: ${CONTAINERIZER_VIEWERS:-}
      CONTAINERIZER_OPERATORS: ${CONTAINERIZER_OPERATORS:-}
      CONTAINERIZER_PRODUCT_OWNERS: ${CONTAINERIZER_PRODUCT_OWNERS:-}
      CONTAINERIZER_VIEW_AUDIT: ${CONTAINERIZER_VIEW_AUDIT:-false}
      CONTAINERIZER_API_AUDIENCE: ${CONTAINERIZER_API_AUDIENCE:-}
      CONTAINERIZER_API_CLIENTS: ${CONTAINERIZER_API_CLIENTS:-}
      CONTAINERIZER_GRAFANA_URL: ${CONTAINERIZER_GRAFANA_URL:-}
      # development only: the admin pages without sign-in (docs/local-dev-server.md#admin-pages-without-sign-in)
      CONTAINERIZER_DEV_NO_AUTH: ${CONTAINERIZER_DEV_NO_AUTH:-}
      CONTAINERIZER_DEV_USER: ${CONTAINERIZER_DEV_USER:-}
      CONTAINERIZER_DEV_NAME: ${CONTAINERIZER_DEV_NAME:-}
      CONTAINERIZER_DEV_ROLES: ${CONTAINERIZER_DEV_ROLES:-}
      # dev database backups operators upload (docs/dev-databases.md); the scan worker needs the same folder
      CONTAINERIZER_DEV_DB_DIR: /var/lib/containerizer/dev-databases
      CONTAINERIZER_DEV_DB_MAX_MB: ${CONTAINERIZER_DEV_DB_MAX_MB:-2048}
    volumes: ["dev-databases:/var/lib/containerizer/dev-databases"]
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      db-init: { condition: service_completed_successfully }
    restart: unless-stopped

  # docker compose run --rm -v /path/to/my-app:/apps/my-app:ro scan assess /apps/my-app
  scan:
    image: containerizer-results
    <<: *hardening
    profiles: [tools]
    environment:
      CONTAINERIZER_SQL: "Server=mssql,1433;Database=Containerizer;User Id=cz_scanner;TrustServerCertificate=yes"
      CONTAINERIZER_SQL_PASSWORD: ${CZ_SCANNER_PASSWORD}
    depends_on:
      db-init: { condition: service_completed_successfully }

volumes:
  mssql-data:
  dev-databases:
